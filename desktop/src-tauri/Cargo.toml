[package]
name = "istota-desktop"
version = "0.0.1"
description = "Istota for the Mac: the local VM's supervisor and the web UI's window"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "istota-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` for a window with no Tauri webview in it: the web UI's windows
# hold a plain wry webview, so no Tauri IPC exists in them (web.rs).
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-dialog = "2"
wry = { version = "0.57", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-web-kit = "0.3"
objc2-service-management = "0.3"
block2 = "0.6"

[features]
# The negative control for row M9: the web UI in a stock Tauri webview, which
# carries Tauri's IPC globals. Built only by `scripts/test-desktop.sh --control m9`.
m9-negative-control = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
