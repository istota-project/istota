---
# Manage one istota stack on a dedicated VM: write the inputs provision.sh and
# istota-stack read, then call them. Nothing here renders a unit, an nginx
# config or a cron entry, builds an image or runs a migration; host/ owns those.
#
# Order matters on a first run: host.env before provision.sh (it reads the
# release key and the storage mode from it), provision.sh before the secrets
# (it installs istota-stack, which writes them) and the update
# (allowed_signers), the update before the config (`istota apply` runs in the
# release's image), the config before the image check (a build reads the
# config to decide whether Claude Code goes in), the stack healthy before the
# user settings (they need the database the daemon's entrypoint initializes).
#
# Root writes nothing in config/ or secrets/: both are uid 10001's, and
# `istota-stack put-files` drops to 10001 before it opens a file there.

- name: Check the variables
  tags: [istota_update]
  ansible.builtin.assert:
    that:
      - istota_update_mode in ['release', 'latest']
      - istota_update_mode == 'latest' or istota_release_signing_key | length > 0
      - istota_storage in ['local', 'nextcloud']
      - istota_ingress in ['local', 'proxied', 'direct']
      - istota_ingress != 'direct' or istota_tls_cert_source in ['acme', 'files']
      - istota_ingress != 'proxied' or istota_upstream_proxy | length > 0
      - istota_ingress != 'proxied' or (istota_listen_addr | length > 0 and istota_listen_addr not in ['0.0.0.0', '::'])
      - istota_storage != 'nextcloud' or istota_rclone_remote | length > 0
      - istota_secrets.keys() | difference(istota_secret_names) | length == 0
    fail_msg: >-
      Check istota_update_mode (release or latest), istota_release_signing_key
      (required in release mode), istota_storage, istota_ingress
      and the proxied listener (one private address, an upstream to allow), the
      rclone remote for nextcloud storage, and that every key of istota_secrets
      is one of istota_secret_names.
    quiet: true

# The role reads none of these any more, so an inventory still setting them
# would otherwise apply no settings and report success.
- name: Refuse the retired settings variables
  ansible.builtin.assert:
    that:
      - istota_config is not defined
      - istota_users is not defined
      - istota_user_resources is not defined
      - istota_user_briefings is not defined
      - istota_user_secrets is not defined
      - istota_user_profile_mode is not defined
    fail_msg: >-
      istota_config, istota_users, istota_user_resources, istota_user_briefings,
      istota_user_secrets and istota_user_profile_mode are retired. Set the
      application settings as istota_plan (a snapshot from `istota snapshot
      --format json`) and their credentials as istota_plan_secrets.
    quiet: true

# Refused here, before anything on the VM changes; the plan itself is
# validated by the release's own image further down.
- name: Check the application-settings variables
  ansible.builtin.assert:
    that:
      - istota_plan is mapping and istota_plan_secrets is mapping
      - istota_plan_secrets | length == 0 or istota_plan | length > 0
      - not (istota_plan_prune_secrets | bool) or istota_plan_prune | bool
      - not (istota_plan_prune | bool) or istota_plan | length > 0
    fail_msg: >-
      istota_plan and istota_plan_secrets must be mappings. istota_plan_secrets
      needs istota_plan, istota_plan_prune needs istota_plan, and
      istota_plan_prune_secrets needs istota_plan_prune.
    quiet: true

# Two role-vars envelopes for `istota apply --input-format role-vars`: the
# config, which the stack needs before it can start, and everything else,
# which needs the database it initializes. Each credential goes with its
# section, so a value with no section to land in reaches apply and is refused.
- name: Split the application settings
  ansible.builtin.set_fact:
    _istota_settings_config: "{{ (_istota_settings_json | from_json)[0] }}"
    _istota_settings_users: "{{ (_istota_settings_json | from_json)[1] }}"
  vars:
    _istota_settings_json: |-
      {%- set config = {} -%}
      {%- set users = {} -%}
      {%- set plan_rest = {} -%}
      {%- for key, value in istota_plan.items() if key != 'config' -%}{%- set _ = plan_rest.update({key: value}) -%}{%- endfor -%}
      {%- set secrets_config = {} -%}
      {%- for key, value in istota_plan_secrets.items() if key != 'users' -%}{%- set _ = secrets_config.update({key: value}) -%}{%- endfor -%}
      {%- set secrets_users = {} -%}
      {%- for key, value in istota_plan_secrets.items() if key != 'config' -%}{%- set _ = secrets_users.update({key: value}) -%}{%- endfor -%}
      {%- if 'config' in istota_plan or 'config' in istota_plan_secrets -%}
      {%- set plan_config = {} -%}
      {%- for key, value in istota_plan.items() if key in ['meta', 'config'] -%}{%- set _ = plan_config.update({key: value}) -%}{%- endfor -%}
      {%- set _ = config.update({'istota_plan': plan_config}) -%}
      {%- if 'config' in istota_plan_secrets -%}{%- set _ = config.update({'istota_plan_secrets': secrets_config}) -%}{%- endif -%}
      {%- endif -%}
      {%- if (plan_rest.keys() | reject('equalto', 'meta') | list | length) > 0 or 'users' in istota_plan_secrets -%}
      {%- set _ = users.update({'istota_plan': plan_rest}) -%}
      {%- if 'users' in istota_plan_secrets -%}{%- set _ = users.update({'istota_plan_secrets': secrets_users}) -%}{%- endif -%}
      {%- endif -%}
      {{ [config, users] | to_json }}
  no_log: true

- name: Check the VM was bootstrapped from a verified release
  tags: [istota_update]
  ansible.builtin.stat:
    path: "{{ istota_stack_dir }}/src/host/provision.sh"
  register: _istota_provision_script

- name: Refuse a VM with no checkout
  tags: [istota_update]
  ansible.builtin.fail:
    msg: >-
      {{ istota_stack_dir }}/src has no host/provision.sh. Bootstrap the VM with
      host/cloud-init.yaml, or by hand from a checkout of a verified release tag
      (`host/provision.sh`), first: nothing runs from a checkout before its tag
      is verified, and that bootstrap is where the first verification happens.
  when: not _istota_provision_script.stat.exists

# --- Inputs root owns ---------------------------------------------------------------

- name: Stack directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ istota_stack_dir }}", owner: "0", mode: "0755"}
    - {path: "{{ istota_stack_dir }}/config", owner: "{{ istota_uid }}", mode: "0750"}
    - {path: "{{ istota_stack_dir }}/secrets", owner: "{{ istota_uid }}", mode: "0700"}
  loop_control:
    label: "{{ item.path }}"

- name: host.env
  ansible.builtin.lineinfile:
    path: "{{ istota_stack_dir }}/host.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  loop: "{{ (istota_host_env | combine(istota_host_env_extra)) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  notify: Restart the istota stack

- name: The stack's .env keys
  ansible.builtin.lineinfile:
    path: "{{ istota_stack_dir }}/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  loop: "{{ istota_stack_env | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  notify: Restart the istota stack

# In the stack directory, which is root's, so 10001 cannot put a link here.
- name: rclone.conf
  ansible.builtin.copy:
    dest: "{{ istota_stack_dir }}/rclone.conf"
    content: "{{ istota_rclone_conf }}"
    owner: "{{ istota_uid }}"
    group: "{{ istota_uid }}"
    mode: "0600"
  no_log: true
  when: istota_storage == 'nextcloud' and istota_rclone_conf | length > 0

# --- provision.sh ------------------------------------------------------------------
# Runs when what it would act on differs from what its last successful run
# recorded, so a play that died after an input changed still provisions on the
# next one; after an update; and where istota-stack is missing.

- name: Is istota-stack installed
  tags: [istota_update]
  ansible.builtin.stat:
    path: "{{ istota_stack_command }}"
  register: _istota_stack_installed

- name: What provision.sh last ran with
  ansible.builtin.command:
    argv: [cat, "{{ istota_stack_dir }}/.provisioned"]
  register: _istota_provisioned_with
  changed_when: false
  failed_when: false
  check_mode: false

- name: What provision.sh would run with
  ansible.builtin.command:
    argv: ["{{ istota_stack_dir }}/src/host/provision.sh", --digest]
  register: _istota_provision_inputs
  changed_when: false
  check_mode: false

- name: Report the provision --check would run
  ansible.builtin.debug:
    msg: would run provision.sh
  changed_when: true
  when:
    - ansible_check_mode
    - >-
      istota_provision_always | bool
      or not _istota_stack_installed.stat.exists
      or _istota_provision_inputs.stdout != _istota_provisioned_with.stdout

- name: Provision the VM
  ansible.builtin.command:
    argv: ["{{ istota_stack_dir }}/src/host/provision.sh"]
  when: >-
    istota_provision_always | bool
    or not _istota_stack_installed.stat.exists
    or _istota_provision_inputs.stdout != _istota_provisioned_with.stdout

# --- Files uid 10001 owns, written as 10001 --------------------------------------
# A name given in istota_secrets is written exactly; any other is created empty
# if missing (compose refuses to start a service whose secret file is missing)
# and otherwise left alone. Values go on stdin, never on a command line.

- name: Secrets and admins
  ansible.builtin.command:
    argv: ["{{ istota_stack_command }}", put-files]
    stdin: "{{ _istota_put_files }}"
  vars: &istota_put_files_vars
    # Double-quoted, so YAML makes the newlines; Jinja in a block scalar would not.
    _istota_admins_file: "{{ istota_admins | join('\n') }}\n"
    _istota_put_files: >-
      {%- set secrets = {} -%}
      {%- for name in istota_secret_names -%}
      {%- set _ = secrets.update({name: (istota_secrets[name] | string) if name in istota_secrets else none}) -%}
      {%- endfor -%}
      {{ {'secrets': secrets, 'admins': _istota_admins_file if istota_admins | length > 0 else none,
          'managed': {'source': 'ansible', 'secrets': istota_secrets | length > 0, 'admins': istota_admins | length > 0}} | to_json }}
  register: _istota_put
  changed_when: _istota_put.rc == 2
  failed_when: _istota_put.rc not in [0, 2] or _istota_put.delta is not defined
  no_log: true
  notify: Restart the istota stack
  when: not ansible_check_mode

- name: Secrets and admins (--check)
  ansible.builtin.command:
    argv: ["{{ istota_stack_command }}", put-files, --dry-run]
    stdin: "{{ _istota_put_files }}"
  vars: *istota_put_files_vars
  register: _istota_put_check
  changed_when: _istota_put_check.rc == 2
  failed_when: _istota_put_check.rc not in [0, 2] or _istota_put_check.delta is not defined
  no_log: true
  check_mode: false
  when: ansible_check_mode and _istota_stack_installed.stat.exists

# --- The release -------------------------------------------------------------------

- name: Read the deployed tag
  tags: [istota_update]
  ansible.builtin.command:
    argv: [awk, "-F=", '$1 == "ISTOTA_TAG" { v = substr($0, index($0, "=") + 1) } END { print v }', "{{ istota_stack_dir }}/.env"]
  register: _istota_current_tag
  changed_when: false
  # No .env yet under --check on a fresh VM.
  failed_when: false
  check_mode: false

# latest mode: an update rebuilds even when main has not moved, so the name
# main's tip would install is compared with the deployed one first. Under
# --check on a VM provision.sh has not reached yet, there is no istota-stack.
# An istota-stack from before latest-tag answers it with usage and 64: the tip
# is then unknown and main is followed, and that update installs one that has it.
- name: What main's tip would install
  tags: [istota_update]
  ansible.builtin.command:
    argv: ["{{ istota_stack_command }}", latest-tag]
  register: _istota_latest
  changed_when: false
  failed_when: _istota_latest.rc != 0 and not ((_istota_latest.rc | default(0)) == 64 and 'latest-tag' not in (_istota_latest.stderr | default('')))
  check_mode: false
  when:
    - istota_update_mode == 'latest'
    - not ansible_check_mode or _istota_stack_installed.stat.exists

- name: Report the update --check would make
  tags: [istota_update]
  ansible.builtin.debug:
    msg: "would run istota-stack update {{ _istota_target | default('--unsigned latest', true) }} (deployed: {{ _istota_current_tag.stdout | default('none', true) }})"
  changed_when: true
  vars: &istota_target_vars
    _istota_target: "{{ (_istota_latest.stdout | default('')) if istota_update_mode == 'latest' else istota_release }}"
  when:
    - ansible_check_mode
    - >-
      ((_istota_latest.rc | default(0)) == 64 and 'latest-tag' not in (_istota_latest.stderr | default('')))
      or (_istota_target | length > 0
          and (_istota_target != _istota_current_tag.stdout or istota_update_force | bool))

- name: Update to the release
  tags: [istota_update]
  ansible.builtin.command:
    argv: ["{{ istota_stack_command }}", update, "{{ istota_release }}"]
  register: _istota_updated
  when:
    - not ansible_check_mode
    - istota_update_mode == 'release'
    - istota_release | length > 0
    - istota_release != _istota_current_tag.stdout or istota_update_force | bool

- name: Follow main
  tags: [istota_update]
  ansible.builtin.command:
    argv: ["{{ istota_stack_command }}", update, --unsigned, latest]
  register: _istota_followed
  when:
    - not ansible_check_mode
    - istota_update_mode == 'latest'
    - >-
      ((_istota_latest.rc | default(0)) == 64 and 'latest-tag' not in (_istota_latest.stderr | default('')))
      or (_istota_latest.stdout | default('') | length > 0
          and (_istota_latest.stdout != _istota_current_tag.stdout or istota_update_force | bool))

# The release's own host/ files (istota-stack, the units, the AppArmor profile).
- name: Provision from the new release
  tags: [istota_update]
  ansible.builtin.command:
    argv: ["{{ istota_stack_dir }}/src/host/provision.sh"]
  when: _istota_updated is changed or _istota_followed is changed

# What runs now, and whether it was installed unsigned: main can move between
# `latest-tag` and the update, so the name is read back rather than assumed.
- name: Read the tag now deployed
  tags: [istota_update]
  ansible.builtin.command:
    argv: [awk, "-F=", '$1 == "ISTOTA_TAG" { t = substr($0, index($0, "=") + 1) } $1 == "ISTOTA_TAG_UNSIGNED" { u = substr($0, index($0, "=") + 1) } END { print t; print u }', "{{ istota_stack_dir }}/.env"]
  register: _istota_deployed
  changed_when: false
  failed_when: false
  check_mode: false

# --- The config --------------------------------------------------------------------
# `istota-stack apply` prints istota apply's JSON result document on stdout and
# exits as istota apply does: 0 unchanged, 2 changed (or would be, under
# --dry-run), 1 refused or partly applied. It restarts a running stack once
# when the result says a committed change needs it, so nothing here notifies
# the restart handler. A refusal is reported from the document's error codes.
# When user settings follow, the config apply passes --no-restart and the user
# settings apply takes the restart it leaves owed, so a play changing both
# restarts the stack once. Nothing before that needs the restart: check-image
# and a rebuild read config.toml from disk, and the user settings run in a
# one-shot container that reads it too. So a config the daemon refuses to
# start on is found by the health wait after the user settings, not the first.

- name: The settings step needs a release
  ansible.builtin.assert:
    that:
      - ansible_check_mode or (_istota_deployed.stdout_lines | default([''], true) | first) | length > 0
    fail_msg: >-
      No release is deployed: `istota apply` runs in the release's image, so set
      istota_release, or istota_update_mode to latest.
    quiet: true
  when: _istota_settings_config | length > 0 or _istota_settings_users | length > 0

# The user settings are applied after the health wait, so their schema is
# checked here, before the config is written. `apply --check` reads no config
# and no database, so it runs under --check too and never counts as a change.
- name: Check the user settings
  when:
    - _istota_settings_users | length > 0
    - (_istota_deployed.stdout_lines | default([''], true) | first) | length > 0
  block:
    - name: Make the user settings check file
      ansible.builtin.tempfile:
        suffix: .json
      register: _istota_users_check_input
      changed_when: false
      check_mode: false

    - name: Write the user settings check input
      ansible.builtin.copy:
        dest: "{{ _istota_users_check_input.path }}"
        content: "{{ _istota_settings_users | to_json }}"
        mode: "0600"
      changed_when: false
      check_mode: false
      no_log: true

    - name: istota-stack apply --check (user settings)
      ansible.builtin.command:
        argv: "{{ [istota_stack_command, 'apply', _istota_users_check_input.path, '--input-format', 'role-vars', '--check', '--json'] }}"
      register: _istota_users_checked
      changed_when: false
      failed_when: _istota_users_checked.delta is not defined or _istota_users_checked.rc not in [0, 1]
      check_mode: false

    - name: Report refused user settings
      ansible.builtin.fail:
        msg: >-
          {%- set out = _istota_users_checked.stdout | default('') -%}
          {%- set doc = (out | from_json) if out.startswith('{') else {} -%}
          {%- if doc.problems is defined -%}
          istota apply refused the user settings, and nothing was written.
          {% for problem in doc.problems %}{{ (problem.path | join('.')) or 'the plan' }}: {{ problem.message }}{{ '; ' if not loop.last }}{% endfor %}{{ ' ' ~ doc.error if doc.error }}
          {%- else -%}
          istota-stack apply --check exited {{ _istota_users_checked.rc }} without a result: {{ _istota_users_checked.stderr | default('') }}
          {%- endif -%}
      when: _istota_users_checked.rc == 1
  always:
    - name: Remove the user settings check file
      ansible.builtin.file:
        path: "{{ _istota_users_check_input.path }}"
        state: absent
      changed_when: false
      check_mode: false
      when: _istota_users_check_input.path is defined

- name: Apply the config
  when: _istota_settings_config | length > 0
  block:
    # A temporary file, created under --check too: the dry run has to read the
    # settings this play would apply, not the ones the last play left.
    - name: Make the config input file
      ansible.builtin.tempfile:
        suffix: .json
      register: _istota_config_input
      changed_when: false
      check_mode: false

    # The envelope can carry credentials, so it is private; istota-stack
    # refuses a role-vars input that is not.
    - name: Write the config input
      ansible.builtin.copy:
        dest: "{{ _istota_config_input.path }}"
        content: "{{ _istota_settings_config | to_json }}"
        mode: "0600"
      changed_when: false
      check_mode: false
      no_log: true

    # Runs under --check too, with --dry-run, which writes nothing and whose
    # exit 2 is the drift answer.
    - name: istota-stack apply
      ansible.builtin.command:
        argv: "{{ [istota_stack_command, 'apply', _istota_config_input.path, '--input-format', 'role-vars'] + (['--dry-run'] if ansible_check_mode else []) + (['--no-restart'] if _istota_users_checked.rc is defined else []) }}"
      register: _istota_applied
      changed_when: _istota_applied.rc == 2
      failed_when: _istota_applied.delta is not defined or _istota_applied.rc not in [0, 1, 2]
      check_mode: false

    - name: Report a refused config apply
      ansible.builtin.fail:
        msg: &istota_apply_failure >-
          {%- set out = _istota_result.stdout | default('') -%}
          {%- set doc = (out | from_json) if out.startswith('{') else {} -%}
          {%- if doc.errors is defined -%}
          istota apply {{ 'partially applied the settings: the operations listed as applied are in place and the rest are not' if doc.partial else 'refused the settings, and nothing was written' }}.
          Errors: {% for error in doc.errors %}{{ error.code }} at {{ (error.path | join('.')) or 'the plan' }}{{ (': ' ~ error.message) if error.message is defined }}{{ '; ' if not loop.last }}{% endfor %}.
          {%- if doc.partial %} Applied: {% for op in doc.operations if op.status == 'applied' %}{{ op.section }} {{ op.user | default('') }} {{ op.identity }}{{ '; ' if not loop.last }}{% endfor %}.{% endif -%}
          {%- else -%}
          istota-stack apply exited {{ _istota_result.rc }} without a result document: {{ _istota_result.stderr | default('') }}
          {%- endif -%}
      vars:
        _istota_result: "{{ _istota_applied }}"
      when: _istota_applied.rc == 1
  always:
    - name: Remove the config input file
      ansible.builtin.file:
        path: "{{ _istota_config_input.path }}"
        state: absent
      changed_when: false
      check_mode: false
      when: _istota_config_input.path is defined

# --- The image against the config ----------------------------------------------------
# A build reads config.toml to decide whether Claude Code goes in. On a first
# converge the update ran before the config existed, and a later change of
# brain or of the Claude Code pin rebuilds nothing by itself, so the image is
# checked against the config now and the same tag rebuilt when it falls short.

- name: Does the image have what the config needs
  ansible.builtin.command:
    argv: ["{{ istota_stack_command }}", check-image]
  register: _istota_image
  changed_when: false
  failed_when: _istota_image.rc not in [0, 2] or _istota_image.delta is not defined
  check_mode: false
  when: (_istota_deployed.stdout_lines | default([''], true) | first) | length > 0

- name: Report the rebuild --check would make
  ansible.builtin.debug:
    msg: "would rebuild: {{ _istota_image.stdout }}"
  changed_when: true
  when: ansible_check_mode and (_istota_image.rc | default(0)) == 2

# The deployed tag, rebuilt the way it was installed: a main-<hex> or other
# unsigned tag would be refused by a signed update.
- name: Rebuild the image for the config
  ansible.builtin.command:
    argv: ["{{ istota_stack_command }}", update, "{{ _istota_deployed.stdout_lines[0] }}"]
  when:
    - not ansible_check_mode and (_istota_image.rc | default(0)) == 2
    - (_istota_deployed.stdout_lines + ['', ''])[1] != '1'

- name: Rebuild the image for the config (unsigned tag)
  ansible.builtin.command:
    argv: ["{{ istota_stack_command }}", update, --unsigned, "{{ _istota_deployed.stdout_lines[0] }}"]
  when:
    - not ansible_check_mode and (_istota_image.rc | default(0)) == 2
    - (_istota_deployed.stdout_lines + ['', ''])[1] == '1'

- name: Restart the stack now if an input changed
  ansible.builtin.meta: flush_handlers

# --- The running stack -----------------------------------------------------------

- name: The stack is enabled and running
  tags: [istota_update]
  ansible.builtin.systemd_service:
    name: istota-stack.service
    enabled: true
    state: started
  when: (_istota_deployed.stdout_lines | default([''], true) | first) | length > 0

# A release from before the rename runs the daemon as the service `istota`.
- name: Wait for the daemon service to be healthy
  tags: [istota_update]
  ansible.builtin.shell: &istota_health_check |
    set -euo pipefail
    cid=""
    for service in daemon istota; do
      [ -n "$cid" ] || cid="$(docker ps -q --filter label=com.docker.compose.project=istota --filter "label=com.docker.compose.service=${service}" | head -1)"
    done
    [ -n "$cid" ] && [ "$(docker inspect -f '{{ '{{' }}.State.Health.Status{{ '}}' }}' "$cid")" = healthy ]
  args:
    executable: /bin/bash
  register: _istota_health
  until: _istota_health.rc == 0
  retries: &istota_health_retries "{{ (istota_health_timeout | int) // 5 }}"
  delay: 5
  changed_when: false
  when:
    - not ansible_check_mode
    - (_istota_deployed.stdout_lines | default([''], true) | first) | length > 0

# --- The user settings ----------------------------------------------------------------
# Profiles, folder resources, briefings, scheduled jobs, heartbeats,
# provisionable credentials and shared briefing definitions, through the same
# `istota apply` as the config. They need the database the daemon's entrypoint
# initializes, so they wait for a healthy stack; under --check they are a dry
# run where a release and a config are there to run it against, and reported
# as a change where they are not.

- name: Does the VM have a config
  ansible.builtin.stat:
    path: "{{ istota_stack_dir }}/config/config.toml"
  register: _istota_config_present
  when: _istota_settings_users | length > 0

- name: Report the user settings --check would apply
  ansible.builtin.debug:
    msg: would apply the user settings (no deployed release or no config to dry-run them against)
  changed_when: true
  when:
    - ansible_check_mode
    - _istota_settings_users | length > 0
    - >-
      (_istota_deployed.stdout_lines | default([''], true) | first) | length == 0
      or not _istota_config_present.stat.exists

- name: Apply the user settings
  when:
    - _istota_settings_users | length > 0
    - (_istota_deployed.stdout_lines | default([''], true) | first) | length > 0
    - not ansible_check_mode or _istota_config_present.stat.exists
  block:
    - name: Make the user settings input file
      ansible.builtin.tempfile:
        suffix: .json
      register: _istota_users_input
      changed_when: false
      check_mode: false

    - name: Write the user settings input
      ansible.builtin.copy:
        dest: "{{ _istota_users_input.path }}"
        content: "{{ _istota_settings_users | to_json }}"
        mode: "0600"
      changed_when: false
      check_mode: false
      no_log: true

    # The prune flags apply here only: the config is a whole document.
    - name: istota-stack apply (user settings)
      ansible.builtin.command:
        argv: "{{ [istota_stack_command, 'apply', _istota_users_input.path, '--input-format', 'role-vars'] + (['--dry-run'] if ansible_check_mode else []) + (['--prune'] if istota_plan_prune | bool else []) + (['--prune-secrets'] if istota_plan_prune_secrets | bool else []) }}"
      register: _istota_users_applied
      changed_when: _istota_users_applied.rc == 2
      failed_when: _istota_users_applied.delta is not defined or _istota_users_applied.rc not in [0, 1, 2]
      check_mode: false

    - name: Report a refused user settings apply
      ansible.builtin.fail:
        msg: *istota_apply_failure
      vars:
        _istota_result: "{{ _istota_users_applied }}"
      when: _istota_users_applied.rc == 1
  always:
    - name: Remove the user settings input file
      ansible.builtin.file:
        path: "{{ _istota_users_input.path }}"
        state: absent
      changed_when: false
      check_mode: false
      when: _istota_users_input.path is defined

# That apply took the config's restart along with its own.
- name: Wait for the daemon service to be healthy after the user settings
  ansible.builtin.shell: *istota_health_check
  args:
    executable: /bin/bash
  register: _istota_health_after
  until: _istota_health_after.rc == 0
  retries: *istota_health_retries
  delay: 5
  changed_when: false
  when:
    - not ansible_check_mode
    - _istota_users_applied.rc is defined
