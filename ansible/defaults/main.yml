#
#     # bwrap filesystem isolation per user (Linux only)
#     sandbox_enabled: true
#
#     # proxy skill CLI calls via Unix socket (credential isolation).
#     # Required wherever sandbox_enabled is true, for two reasons.
#     # Off, every configured service credential stays in the task
#     # environment where the model can read it from inside the
#     # sandbox, instead of being injected per call. And the databases
#     # are masked out of the sandbox, so a skill CLI that can't reach
#     # the proxy has nothing to read and refuses rather than guessing.
#     skill_proxy_enabled: true
#
#     # timeout for proxied skill commands (seconds).
#     # Capped at skill_client_wait_seconds minus 30;
#     # see [security.skill_proxy_timeouts] below to give
#     # one skill a different budget.
#     skill_proxy_timeout: 300
#
#     # Per-skill overrides of skill_proxy_timeout, applied instead of the global for
#     # the skills named. An entry narrows as readily as it widens. Everything here is
#     # bounded by the wait the sandboxed client arms before it sends —
#     # skill_client_wait_seconds above, minus a 30s margin, so 570s at the default —
#     # and that bound applies to skill_proxy_timeout above as well.
#     #
#     # code_review already has a 540s ceiling of its own without an entry here: it is
#     # the only skill that drives model calls, and raising the global to suit it
#     # would hand the same minutes to every other skill. That value is in the code
#     # rather than in this table's default, because a table an operator writes
#     # *replaces* the default rather than merging with it — so shipping the entry
#     # here would mean setting some other skill silently took the review's ceiling
#     # back to the global. Naming code_review here still overrides it.
#     # Example entries:
#     #   browse: 90
#     skill_proxy_timeouts: {}
#
#     # how long the sandboxed istota-skill client waits
#     # on the proxy socket. The bound every skill budget
#     # sits under: the global above and every per-skill
#     # entry are capped at this minus a 30s margin, so a
#     # skill wanting more than 570s needs this raised
#     # too. Exported to the client as
#     # ISTOTA_SKILL_CLIENT_WAIT; the proxy reads this
#     # field, never the export.
#     skill_client_wait_seconds: 600
#
#     # how many shared credentials one task attempt may
#     # fetch from the vault namespace over the proxy
#     # socket. 0 is unlimited, and is the only spelling
#     # of it — leaving the key out gives you the 10, not
#     # "off". Counted per request whether or not the name
#     # exists, so probing for absent names is not free;
#     # listing the names costs nothing. A legitimate loop
#     # over several credentials is the first thing to
#     # trip it, which is why it is a setting at all.
#     vault_fetch_limit_per_task: 10
#
#     # how many create requests one task attempt may
