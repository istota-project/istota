#     # operator who wants a different provider.
#     #
#     #   openfreemap  free OSM vector tiles, no key, no account, dark + light.
#     #                Still a third-party request, so it does not make map viewing
#     #                private — it just needs no credential.
#     #   carto        the previous default. Requires a free API key since 2026;
#     #                without one every tile comes back stamped "API KEY REQUIRED"
#     #                with a 200 status, so nothing but a human notices. Get one at
#     #                https://carto.com/basemaps/apikey/ — and note CARTO is
#     #                retiring its raster service, so this buys time, not a fix.
#     #                Set without a key, this falls back to openfreemap rather than
#     #                serving watermarked tiles, and `istota doctor` says so.
#     #   osm          keyless raster last resort. Light tiles only, so the dark
#     #                theme looks wrong, and the OSMF tile usage policy discourages
#     #                application use.
#     #   custom       your own MapLibre style URLs, e.g. a self-hosted tile server.
#     #                One URL is enough; it then covers both themes.
#     #
#     # api_key travels inside the tile URL to every browser that loads a map, so it
#     # is public by construction — treat it as disclosed, whatever it is called.
#     # Each user can also set their own CARTO key on the location settings page,
#     # which selects CARTO for them and overrides whatever is set here.
#     map:
#       # openfreemap | carto | osm | custom
#       provider: "openfreemap"
#
#       # carto only; public
#       api_key: ""
#
#       # custom only: MapLibre style URL
#       dark_style: ""
#
#       # custom only
#       light_style: ""
#
#       # custom only
#       attribution: ""
#
#   models:
#
#     # Model alias registry [models.aliases] (operator override) — optional
#     # One operator-visible table overlaying the code-shipped defaults
#     # (brain.claude_code.DEFAULT_ALIASES). It holds BOTH the portable tiers and the
#     # provider shortcuts, base names only — effort is the orthogonal :effort modifier.
#     # Shipped defaults:
#     #   fast    → claude-haiku-5-5    (used by: context triage, skill classification)
#     #   general → claude-sonnet-5-5   (used by: sleep cycle extraction + USER.md curation)
#     #   smart   → claude-opus-5-5     (exists for `!model smart` from Talk + any code
#     #                                  path that wants "the best model")
#     #   opus / sonnet / haiku         (shortcuts → the current latest of each)
#     #
#     # Rebind any alias to a canonical ID, a shortcut, or a custom name accessible via
#     # `!model <name>` from Talk. Effort composes with the :effort modifier
#     # (`smart = "opus:high"`), never a separate alias. Two forms:
#     #
#     # 1. Flat (namespace-agnostic) — resolved by whichever brain runs the task:
#     # Example entries:
#     #   smart: "claude-opus-4-7:high"
#     #   deep: "opus:max"
#     aliases: {}
#
#   # Experimental feature flags — operator opt-in for rough features that ship
#   # in the tree but are off by default. See docs/EXPERIMENTAL.md for the
#   # registry and graduation policy. Run `uv run istota experimental list` to
#   # see what's gateable on this build. Unknown names log a warning at
#   # startup. Not exposed in the web UI, not per-user.
#   experimental:
#     # example: ["money_tax", "money_wash_sales"]
#     features: []
#
#   # Written [users.<name>] in config.example.toml, which shows the fields.
#   users: {}
#
#   # Default briefings (shared canonical set)
#   # A canonical briefing set seeded once into each opted-in user (per-user
#   # `default_briefings = true`, the default). Same name/cron/output/blocks shape
#   # as a per-user briefing; content is blocks-only. Seed-once: a user's later web
#   # edits win and re-runs never clobber them. Omit the section for no defaults.
#   # Written [[default_briefings]] in config.example.toml, which shows the fields.
#   default_briefings: []
#
#   # Shared briefing blocks (module-owned curated content)
#   # Generated ONCE globally by the scheduler (no user, UTC cron) and written into
#   # the shared_kv store; per-user briefings read them via a `shared_block` (or
#   # `kv`) source, so the N-way frontpage fetch + synthesis collapses to one
#   # generation total. Only user-agnostic source kinds are allowed: browse /
#   # markets / email (the shared/unowned pool).
#   #
#   # Omit the section entirely to seed the batteries-included defaults
#   # (world-headlines, markets-summary). An explicit empty list opts out.
#   # Written [[briefing_shared_blocks]] in config.example.toml, which shows the fields.
#   briefing_shared_blocks: []
#
#   # File Access Configuration
#   # Root of the bot's on-disk file tree. Defaults to nextcloud_mount_path.
#   # Required when [nextcloud] url is set: the files are reached through it.
#   # example: "/srv/mount/nextcloud/content"
#   # unset by default; give it a value or leave it out
#   # The container layout: `istota setup` writes "/data/workspace" here (code default ).
#   workspace_path: "/data/workspace"
#
#   # The FUSE mountpoint of the bot's Nextcloud files (mount-nextcloud.service),
#   # when the workspace is one.
#   # example: "/srv/mount/nextcloud/content"
#   # unset by default; give it a value or leave it out
#   nextcloud_mount_path:
#
#   # Path to skills directory (individual skill files loaded selectively)
#   skills_dir: "config/skills"
#
#   # Skills to exclude from selection (instance-wide)
#   # example: ["browse", "whisper"]
#   disabled_skills: []
#
#   # Use config/system-prompt.md instead of Claude Code's default system prompt.
#   # The custom prompt is minimal, focused on tool usage and working practices.
#   # The CLI opens that file from inside the sandbox, so it is bind-mounted there
#   # read-only — the only file in this directory that is (config.toml is not).
#   # example: true
#   custom_system_prompt: false
#
#   # Temporary directory for task execution
#   # The container layout: `istota setup` writes "/data/tmp" here (code default "/tmp/istota").
#   temp_dir: "/data/tmp"
#
#   # Local-disk root for per-user module SQLite DBs (feeds/health/location/money).
#   # These MUST live on local disk, NOT the Nextcloud mount: WAL's mmap'd -shm file
#   # SIGBUSes the process on the rclone FUSE mount, so they'd be stuck on the
#   # slower DELETE journal mode (no reader/writer concurrency). User-facing files
#   # (health uploads, money ledgers, feeds exports) stay on the mount; only the
#   # .db relocates here. A path under nextcloud_mount_path is refused at runtime.
#   # example: "data/modules"
#   # unset by default; give it a value or leave it out
#   module_data_dir:
# --- end istota_config reference ---

# --- Users, through the VM's `istota` wrapper ---------------------------------
# Each entry is the CLI's own flags without the dashes: a list repeats the
# flag, true passes it bare, false or null leaves it out. Until the
# declarative-apply spec lands these loops are how users reach the database.
#
#   istota_users:
#     alice: {display-name: Alice, email: [alice@example.com], managed: true}
#   istota_user_resources:
#     alice: [{type: folder, path: /data/shared/papers, permissions: read}]
#   istota_user_briefings:
#     alice: [{name: morning, cron: "0 7 * * 1-5", output: email}]
#   istota_user_secrets:
#     alice: [{service: karakeep, key: api_key, value: "{{ vault_alice_karakeep }}"}]
#
# A secret's value reaches `istota secret ensure` on stdin, never on a command
# line. An entry whose value is empty is skipped; `istota secret remove` is how
# a stored secret is cleared.
istota_users: {}
istota_user_resources: {}
istota_user_briefings: {}
istota_user_secrets: {}

# --- Behaviour ---------------------------------------------------------------
# provision.sh runs when what it acts on (host.env, rclone.conf, .env's
# COMPOSE_PROFILES, the checkout's commit) differs from what its last
# successful run recorded, and on a VM where istota-stack is missing. true runs
# it on every play.
istota_provision_always: false
# Seconds to wait for the daemon service's healthcheck before the ensure loops.
istota_health_timeout: 900
