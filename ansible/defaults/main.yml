---
# The istota management role: what an operator sets, and nothing else.
#
# Every value here is generic. An estate's real values (hostnames, addresses,
# the release key, every credential) belong in its own host_vars and vault,
# seeded from `istota migrate import-bare-metal --emit-plan` on an imported
# install. tests/test_management_role.py holds the name lists below to the
# code they mirror; change both sides together.

# --- Where things are on the VM ----------------------------------------------
# provision.sh's layout; the role does not move any of it.
istota_stack_dir: /srv/app/istota
istota_stack_command: /usr/local/sbin/istota-stack
# The VM's `istota` wrapper: the CLI in the running container, as uid 10001.
istota_cli_command: /usr/local/bin/istota
istota_uid: 10001

# --- The release -------------------------------------------------------------
# release: run the signed tag in istota_release, verified against
#   istota_release_signing_key.
# latest: follow main. Each play asks `istota-stack latest-tag` what main's tip
#   would install and runs `istota-stack update --unsigned latest` when that
#   differs from the deployed name (main-<12 hex>). Nothing is verified, so no
#   key is needed, and istota_release is ignored.
istota_update_mode: release
# Run the update even when the deployed version already matches, which is what
# typing `istota-stack update` on the VM does: it rebuilds and restarts. For a
# one-off `-e istota_update_force=true`; with `--tags istota_update` the play
# runs only the version update.
istota_update_force: false
# release mode: the signed tag to run. Empty: the role deploys nothing and an install with no
# tag yet stops before the config step. `istota-stack update` runs only when
# this differs from ISTOTA_TAG in .env, so an update is a deliberate change to
# this variable.
istota_release: ""
# One line of an SSH public key. Every tag is verified against it (host.env's
# RELEASE_SIGNING_KEY, written to allowed_signers by provision.sh). Required in
# release mode.
istota_release_signing_key: ""

# --- host.env ----------------------------------------------------------------
# local | nextcloud: where the workspace lives, not whether Nextcloud is used.
# nextcloud is the rclone mount and needs istota_rclone_remote and
# istota_rclone_conf. Talk and the nextcloud skill work in both; for local with
# a Nextcloud URL, leave workspace_mount_path out of istota_config.
istota_storage: local
# local | proxied | direct
istota_ingress: local
# The public name: nginx's server_name and [site] hostname in the config. In
# local ingress its port is the one nginx publishes on the VM's loopback.
istota_domain: "localhost:8080"
# direct: acme | files. proxied: files, or "" for plain HTTP from the upstream.
istota_tls_cert_source: acme
# proxied only: the upstream's address(es) or CIDR(s), comma-separated, and the
# one private address and port to listen on. Never 0.0.0.0.
istota_upstream_proxy: ""
istota_listen_addr: ""
istota_listen_port: 8080
# The Claude Code pin, for the claude_code and tmux_claude brains. Empty builds
# the release's own pin. Whether Claude Code goes in at all follows the config:
# after the apply, an image lacking what the config needs (or at another pin)
# is rebuilt at the same tag.
istota_claude_code_version: ""
# direct with acme only. An empty ACME server is Let's Encrypt.
istota_acme_email: ""
istota_acme_server: ""
# nextcloud only: the remote's name in rclone.conf.
istota_rclone_remote: ""
istota_zram_enabled: true
# Drop container traffic to istota_host_gateway_addr, except its DNS and the
# TCP ports in istota_host_loopback_allow. The local VM's setting (Lima's
# gateway is the Mac's loopback); an estate VM has no such address.
istota_host_loopback_block: false
istota_host_gateway_addr: ""
istota_host_loopback_allow: []

# The keys, as provision.sh documents them. Derived for the ingress mode the
# same way `istota setup` derives them, so a role-managed host.env matches a
# wizard-written one for the same answers.
istota_host_env:
  STORAGE: "{{ istota_storage }}"
  INGRESS: "{{ istota_ingress }}"
  DOMAIN: "{{ istota_domain }}"
  TLS_CERT_SOURCE: "{{ istota_tls_cert_source if istota_ingress == 'direct' else (istota_tls_cert_source if istota_ingress == 'proxied' and istota_tls_cert_source in ['self-signed', 'files'] else '') }}"
  UPSTREAM_PROXY: "{{ istota_upstream_proxy if istota_ingress == 'proxied' else '' }}"
  LISTEN_ADDR: "{{ istota_listen_addr if istota_ingress == 'proxied' else '' }}"
  LISTEN_PORT: "{{ (istota_listen_port or 8080) if istota_ingress == 'proxied' else '' }}"
  RELEASE_SIGNING_KEY: "{{ istota_release_signing_key }}"
  CLAUDE_CODE_VERSION: "{{ istota_claude_code_version }}"
  ACME_EMAIL: "{{ istota_acme_email }}"
  ACME_SERVER: "{{ istota_acme_server }}"
  RCLONE_REMOTE: "{{ istota_rclone_remote }}"
  ZRAM_ENABLED: "{{ '1' if istota_zram_enabled | bool else '0' }}"
  HOST_LOOPBACK_BLOCK: "{{ '1' if istota_host_loopback_block | bool else '0' }}"
  HOST_GATEWAY_ADDR: "{{ istota_host_gateway_addr }}"
  HOST_LOOPBACK_ALLOW: "{{ istota_host_loopback_allow | join(' ') }}"
# Optional keys only a unit reads (ISTOTA_DEVBOX_SUBNET, the browser watchdog's
# ISTOTA_BROWSER_WATCHDOG_*), written beside the ones above.
istota_host_env_extra: {}

# --- The stack's .env --------------------------------------------------------
# browser, signaling, location, whatsapp-baileys
istota_compose_profiles: []
# The keys `istota setup` owns in .env. istota-stack owns ISTOTA_TAG and
# ISTOTA_PREVIOUS_TAG; every other line is left as it is.
istota_stack_env:
  COMPOSE_PROJECT_NAME: istota
  COMPOSE_PROFILES: "{{ istota_compose_profiles | join(',') }}"
  DOMAIN: "{{ istota_domain }}"
  ISTOTA_SECRETS_DIR: ./secrets
  NGINX_PUBLISH: "{{ '80:80' if istota_ingress == 'direct' else (('127.0.0.1::80' if istota_tls_cert_source in ['self-signed', 'files'] else istota_listen_addr ~ ':' ~ (istota_listen_port or 8080) ~ ':80') if istota_ingress == 'proxied' else '127.0.0.1:' ~ (istota_domain.rpartition(':')[2] if istota_domain.rpartition(':')[2].isdigit() else '8080') ~ ':80') }}"
  NGINX_PUBLISH_TLS: "{{ '443:443' if istota_ingress == 'direct' else (istota_listen_addr ~ ':' ~ (istota_listen_port or 8080) ~ ':443' if istota_ingress == 'proxied' and istota_tls_cert_source in ['self-signed', 'files'] else '127.0.0.1::443') }}"
  ISTOTA_WEB_INSECURE_COOKIES: "0"

# --- Deployment secrets ------------------------------------------------------
# One file per name under secrets/, 0400, owned by uid 10001: what compose
# hands the containers. The same list as setup_wizard.SECRET_NAMES. Written by
# `istota-stack put-files` as uid 10001, never by root.
istota_secret_names:
  - anthropic_api_key
  - claude_code_oauth_token
  - istota_brain_native_api_key
  - istota_nextcloud_app_password
  - istota_web_oauth2_client_secret
  - istota_web_session_secret_key
  - istota_email_imap_password
  - istota_caldav_password
  - istota_developer_gitlab_token
  - istota_developer_github_token
  - istota_email_smtp_password
  - istota_sms_telnyx_api_key
  - istota_sms_telnyx_public_key
  - istota_sms_telnyx_messaging_profile_id
  - istota_google_workspace_client_secret
# name: value, from the vault. A name given here is written exactly, "" included.
# A name left out is created empty if missing and otherwise left alone, so a
# file the wizard or the import wrote survives a play that does not manage it.
istota_secrets: {}

# nextcloud storage: the whole rclone.conf, from the vault. Written to
# /srv/app/istota/rclone.conf (0600, uid 10001) when non-empty.
istota_rclone_conf: ""

# --- Admins and config -------------------------------------------------------
# User ids, one per line of /srv/app/istota/config/admins. Empty leaves the
# file alone: an empty allowlist means everyone is an admin.
istota_admins: []
# The whole of config.toml as a nested dict. Applied with `istota-stack apply`
# as the plan's [config]; under --check, with --dry-run. Empty skips the step.
# The reference below names every key it takes.
istota_config: {}
# --- istota_config reference: generated, do not edit by hand ---
# Every key istota_config takes, with its default and what it does. Generated
# from the config dataclasses and config/config.example.toml; regenerate with
# uv run env ISTOTA_UPDATE_CONFIG_REFERENCE=1 pytest tests/test_config_reference.py -n0
#
# Copy what you need into host_vars, uncommented, at the same nesting. A key
# left out takes the default of the release the VM runs, so set only what
# differs. A TOML table is a mapping here and [[x]] a list of mappings.
#
# istota_config:
#   # The name your bot uses in chat, emails, and folder names.
#   # Change this to whatever you want to call your assistant.
#   bot_name: "Istota"
#
#   # Include emissaries.md (constitutional principles) in system prompts (default: true).
#   # `istota setup` writes `false` here for local single-user installs.
#   emissaries_enabled: true
#
#   # Deprecated (ISSUE-418). Set `model` and `effort` under [brain.claude_code] and
#   # [brain.tmux] instead; these still load and are moved there with a warning.
#   # example: "claude-opus-5-5"
#   model: ""
#
#   # example: "high"
#   effort: ""
#
#   # Advisor model for the anthropic-namespace brains: an ID or alias, resolved
#   # like `model` but carrying no effort. Empty = no advisor. It must be a model
#   # that can act as an advisor; a cheap tier fails every task it runs on.
#   advisor_model: ""
#
#   # Cap on the characters of recalled memory in one task prompt; 0 is unlimited.
#   # Lowering it drops the weakest matches first.
#   max_memory_chars: 0
#
#   # `max_knowledge_facts` caps how many knowledge-graph facts a single prompt
#   # carries; 0 is unlimited.
#   max_knowledge_facts: 50
#
#   # Database path (relative to working directory or absolute)
#   # The container layout: `istota setup` writes "/data/db/istota.db" here (code default "data/istota.db").
#   db_path: "/data/db/istota.db"
#
#   nextcloud:
#     # Nextcloud server URL, for Talk, the nextcloud skill, OCS and DAV. Setting it
#     # requires workspace_path.
#     # example: "https://nextcloud.example.com"
#     url: ""
#
#     # Bot's Nextcloud username
#     # example: "istota"
#     username: ""
#
#     # App password (generate in Nextcloud: Settings > Security > Devices & sessions)
#     # Note: CalDAV settings are derived from these values automatically
#     # CalDAV URL = {url}/remote.php/dav, using same username/app_password
#     # example: "xxxxx-xxxxx-xxxxx-xxxxx-xxxxx"
#     # A credential: set it as istota_secrets.istota_nextcloud_app_password, not here.
#     app_password: ""
#
#     # Default expiry applied by `nextcloud share link`. A handed-out link that never
#     # expires is the thing worth avoiding; 0 opts out of a default entirely.
#     share_default_expire_days: 14
#
#     # Where the bot's storage root sits inside its own Nextcloud files, prefixed
#     # onto every DAV and OCS path. Empty when they are the same directory.
#     dav_prefix: ""
#
#     # Share the bot workspace back to the user over OCS at boot. Set false where
#     # something else already puts it in the user's files.
#     auto_share_bot_dir: true
#
#   talk:
#     # Enable Talk polling (requires istota user to be added to conversations)
#     enabled: true
#
#     # Bot's Nextcloud username (to filter its own messages)
#     bot_username: "istota"
#
#     # Largest Talk attachment, in MB, fetched into the room's folder when the
#     # workspace is not the Nextcloud mount. Larger files are skipped.
#     attachment_max_mb: 50
#
#     # Days a fetched attachment is kept before the cleanup pass removes it. 0 keeps
#     # them. Not used when the workspace is the mount.
#     attachment_retention_days: 30
#
#     signaling:
#       # Receive Talk messages over Nextcloud's signaling server (the HPB) instead of
#       # polling. The HPB must be registered with Talk and the `signaling` extra
#       # installed, or the daemon refuses to start.
#       enabled: false
#
#       # HPB base URL. Empty uses whatever Talk advertises; set it only where the
#       # daemon reaches the server by a different route than browsers.
#       url: ""
#
#       # Seconds between room reconciliations, which fetch any room that is behind.
#       # This bounds how long a gap lasts when the event stream is down.
#       room_sync_interval: 300
#
#       # Reconnect backoff ceiling, seconds.
#       reconnect_backoff_max: 60
#
#       # Ingest the relayed message directly instead of refetching the room. Has no
#       # effect before about Talk 21, which sends no message with the event.
#       payload_direct: false
#
#   email:
#     # Enable email functionality (requires himalaya to be installed)
#     # example: true
#     enabled: false
#
#     # IMAP settings (for receiving)
#     # example: "imap.example.com"
#     imap_host: ""
#     imap_port: 993
#
#     # example: "istota@example.com"
#     imap_user: ""
#
#     # example: "app-password-here"
#     # A credential: set it as istota_secrets.istota_email_imap_password, not here.
#     imap_password: ""
#
#     # SMTP settings (for sending) - defaults to IMAP credentials if not set
#     # example: "smtp.example.com"
#     smtp_host: ""
#     smtp_port: 587
#
#     # uses imap_user if empty
#     smtp_user: ""
#
#     # uses imap_password if empty
#     # A credential: set it as istota_secrets.istota_email_smtp_password, not here.
#     smtp_password: ""
#
#     # Polling settings
#     poll_folder: "INBOX"
#
#     # bot's email address (to skip own messages)
#     # example: "istota@example.com"
#     bot_email: ""
#
#     # first signup message may mint one follow-up task; 0 only files mail
#     signup_task_window_minutes: 30
#
#     # blank old filed bodies, retain message rows
#     signup_body_retention_days: 14
#
#     # Who checks that mail from a user's own address really is theirs: "off" (the
#     # receiving MTA enforces DMARC), "verify" (trust a dmarc=pass stamped by
#     # authserv_id, hold the rest) or "gate" (hold every such message).
#     confirm_sender_match: "off"
#
#     # Warn when mail routed on a user's own address arrives without a DMARC pass.
#     # Monitoring only; it never holds mail.
#     dmarc_canary: true
#
#     # Also warn when the MTA's stamp has no DMARC verdict at all. Turn on once you
#     # know your MTA stamps.
#     dmarc_canary_warn_on_missing: false
#
#     # A disclosure line on every mail the bot sends into a multi-person thread:
#     # "Written by <bot>, an AI assistant, for <host>", plus how to stop it replying
#     # there. Off by default, since mail from the bot's address is already from the
#     # bot.
#     thread_disclosure_footer: false
#
#     # Your receiving MTA's authserv-id: the first token of the Authentication-Results
#     # header it stamps, before the semicolon. Set, headers from any other
#     # authserv-id are ignored. Required by confirm_sender_match = "verify".
#     # example: "mx.example.com"
#     authserv_id: ""
#
#     # socket timeout for IMAP connections (fail fast on a dead host)
#     imap_timeout_seconds: 30
#
#     # The weakest outbound approval policy any user may run: "off" (never hold),
#     # "untrusted" (hold mail unless every recipient is trusted) or "all" (hold
#     # unless every recipient is the user's own). An invalid value fails the load.
#     outbound_approval_floor: "untrusted"
#
#   # SMS uses one active provider. A complete inactive provider block remains
#   # available for signed delivery callbacks after a provider switch.
#   sms:
#     enabled: false
#
#     # twilio | telnyx
#     provider: "twilio"
#     service_numbers: []
#     default_sender_number: ""
#     max_segments: 6
#     request_timeout_seconds: 10
#
#     twilio:
#       # A credential with no stack secrets file: set it here, and keep the value in the vault.
#       account_sid: ""
#
#       # A credential with no stack secrets file: set it here, and keep the value in the vault.
#       auth_token: ""
#
#       # A credential with no stack secrets file: set it here, and keep the value in the vault.
#       api_key_sid: ""
#
#       # A credential with no stack secrets file: set it here, and keep the value in the vault.
#       api_key_secret: ""
#
#       # A credential with no stack secrets file: set it here, and keep the value in the vault.
#       messaging_service_sid: ""
#
#     telnyx:
#       # A credential: set it as istota_secrets.istota_sms_telnyx_api_key, not here.
#       api_key: ""
#
#       # A credential: set it as istota_secrets.istota_sms_telnyx_public_key, not here.
#       public_key: ""
#
#       # A credential: set it as istota_secrets.istota_sms_telnyx_messaging_profile_id, not here.
#       messaging_profile_id: ""
#
#   # One WhatsApp business phone number. The Cloud adapter's three credentials
#   # belong in ISTOTA_WHATSAPP_ACCESS_TOKEN / _APP_SECRET / _VERIFY_TOKEN, not here.
#   whatsapp:
#     enabled: false
#
#     # Which adapter sends and receives: "baileys" (a WhatsApp Web session paired by
#     # QR scan, no Meta account, free) or "whatsapp_cloud" (Meta's metered Cloud
#     # API, configured in [whatsapp.cloud]).
#     provider: "baileys"
#
#     # exact E.164, with the leading +
#     business_phone_number: ""
#
#     # In a group, a member's photo or GIF with no caption waits this long for the
#     # same member's next message, which is then read as its caption so the two get
#     # one answer. 0 answers the file at once.
#     group_bare_file_hold_seconds: 30
#
#     # Meta's Cloud API adapter, read only under provider = "whatsapp_cloud". The
#     # same keys written flat under [whatsapp] are DEPRECATED but still load.
#     cloud:
#       # decimal WhatsApp Business Account id
#       waba_id: ""
#
#       # decimal business phone number id, not the number
#       phone_number_id: ""
#
#       # A credential with no stack secrets file: set it here, and keep the value in the vault.
#       access_token: ""
#
#       # A credential with no stack secrets file: set it here, and keep the value in the vault.
#       app_secret: ""
#
#       # A credential with no stack secrets file: set it here, and keep the value in the vault.
#       verify_token: ""
#
#       # "" follows the version PyWa pins
#       graph_api_version: ""
#
#       # IANA zone the monthly quota month is computed in
#       business_timezone: "UTC"
#       request_timeout_seconds: 10
#
#       # "free_guard" sends no templates and caps attempts at the limit below (1-1000);
#       # "allow_paid" may cost money, and a limit of 0 there means no local cap.
#       # free_guard | allow_paid
#       billing_policy: "free_guard"
#       monthly_service_attempt_limit: 900
#
#       # One approved Meta utility template, sent when the 24-hour service window has
#       # closed. Paid; valid only with billing_policy = "allow_paid".
#       proactive_template:
#         enabled: false
#         name: ""
#         language: "en_US"
#
#     # The Baileys adapter. The paired session on disk is its credential.
#     baileys:
#       # "" = beside the database
#       session_dir: ""
#
#       # "" = what the shipped sidecar pins
#       library_version: ""
#
#       # Command the daemon runs for the Node sidecar. Empty spawns nothing, for a
#       # sidecar run as its own unit or compose service.
#       sidecar_command: ""
#
#       # Allow re-pairing from Admin, Connections. `istota whatsapp pair` works either way.
#       pairing_enabled: true
#
#       # How long a pairing window stays open. The code is a full-account credential,
#       # so shorter is safer.
#       pairing_window_seconds: 300
#
#       # Where the pairing code passes to the web process. Empty is a 0600 file beside
#       # the database.
#       pairing_relay_path: ""
#
#       # Roughly how long the supervisor waits before restarting the sidecar; it only
#       # sizes how long a re-pair waits. 0 = undeclared (Docker); under systemd use RestartSec.
#       restart_interval_seconds: 0
#
#   conversation:
#     # Enable conversation context (uses Sonnet to select relevant previous messages)
#     enabled: true
#
#     # Number of recent messages to consider
#     lookback_count: 25
#
#     # Model for selecting relevant context. Accepts canonical IDs ("claude-haiku-4-5"),
#     # shortcuts ("haiku"), or role tiers ("fast" — default; resolves to Haiku via
#     # brain.claude_code.DEFAULT_ALIASES, operator-overridable via [models.aliases] below).
#     selection_model: "fast"
#
#     # Timeout for context selection
#     selection_timeout: 30.0
#
#     # Include all messages without selection if history <= this threshold (faster for short threads)
#     skip_selection_threshold: 3
#
#     # Set to false to include all lookback messages without LLM selection (useful for testing)
#     use_selection: true
#
#     # Always include this many recent messages without selection (rest triaged by model)
#     always_include_recent: 5
#
#     # Max chars per bot response in conversation context (0 to disable truncation)
#     context_truncation: 0
#
#     # Include older messages only if they fall within this many hours (0 = no window)
#     context_recency_hours: 0
#
#     # Always include at least this many recent messages, whatever their age
#     context_min_messages: 10
#
#     # Number of recent unfiltered tasks to inject into context (ensures scheduled/briefing
#     # messages aren't orphaned when the user replies to them)
#     previous_tasks_count: 3
#
#     # Messages to fetch from Talk API for context (max 200, default 100)
#     # Talk API-based context shows all participants' messages, not just bot interactions
#     talk_context_limit: 100
#
#   speech_gate:
#     # Whether the bot replies to an unaddressed turn in a room with more than one
#     # human: "mention" (only when mentioned), "classifier" (a cheap model decides)
#     # or "off" (reply to every turn).
#     mode: "classifier"
#
#     # How wide the classifier reads "for the bot". "reserved" answers requests and
#     # answers to its questions; "friendly" also answers thanks and reactions to
#     # its last answer, in one short line.
#     disposition: "friendly"
#
#     # Under "friendly", the reaction a mere acknowledgement gets on Talk and in
#     # WhatsApp groups instead of a reply, when the table below has none for it.
#     # Empty turns reactions off everywhere.
#     ack_reaction: "👍"
#
#     # Reactions per kind of acknowledgement (thanks, agreement, funny, celebration,
#     # default). A missing kind falls back to default, then ack_reaction. A table
#     # here replaces the shipped lists whole.
#     # Example entries:
#     #   thanks: ["👍", "🐙"]
#     #   agreement: ["👌"]
#     #   funny: ["😄", "🐙"]
#     #   celebration: ["🎉"]
#     ack_reactions: {thanks: ["👍", "🐙"], agreement: ["👌"], funny: ["😄", "🐙"], celebration: ["🎉"]}
#
#     # Classifier model. A role alias ("fast"), resolved per brain namespace.
#     model: "fast"
#
#     # Transcript turns the classifier sees, and the per-turn character cap
#     window_messages: 8
#     max_message_chars: 400
#
#     # Seconds the classifier may take. A timeout means no reply, and on the
#     # claude_code brain each call starts the CLI from scratch.
#     timeout_seconds: 20.0
#
#     # Days to keep the speech_gate_decisions audit rows (0 keeps them forever)
#     decision_retention_days: 30
#
#   scheduler:
#     # Seconds between checking for new tasks in the queue
#     poll_interval: 5
#
#     # Seconds between pending-task scans within one poll tick, so a new task is
#     # picked up quickly. 0 or >= poll_interval scans once per tick.
#     dispatch_interval: 0.5
#
#     # Seconds between polling for new emails
#     email_poll_interval: 60
#
#     # Messages one email poll walks. The rest wait for the next tick and drain in order.
#     email_poll_batch_size: 50
#
#     # Inbound email tasks per user per window. Over-budget mail is filed, not
#     # dropped, and the user is told once per window. 0 disables.
#     # email tasks per user per window
#     email_rate_limit_messages: 60
#
#     # …and per sender, so one loud correspondent throttles alone
#     email_sender_rate_limit_messages: 20
#     email_rate_limit_window_seconds: 3600
#
#     # Which worker queue inbound mail lands on. "background" keeps a flood from
#     # taking the slots a live Talk or web-chat turn needs, at the cost of slower
#     # mail turnaround; "foreground" restores the previous behaviour.
#     email_task_queue: "background"
#
#     # Untrusted-sender confirmation prompts per user and sender per window before
#     # they collapse into one summary notice. 0 = never collapse.
#     email_confirmation_prompts_per_window: 3
#
