#
#     # model that writes the shared channel memories;
#     # a role alias, resolved through [models.aliases]
#     extraction_model: "general"
#
#   developer:
#     enabled: false
#
#     # base dir for clones + worktrees
#     # example: "/srv/repos"
#     repos_dir: ""
#
#     # # GitLab settings
#     # GitLab instance URL (one instance only — see above)
#     gitlab_url: "https://gitlab.com"
#
#     # API token (api + write_repository)
#     # example: "glpat-xxxxxxxxxxxxxxxxxxxx"
#     # A credential: set it as istota_secrets.istota_developer_gitlab_token, not here.
#     gitlab_token: ""
#
#     # GitLab username for HTTPS auth
#     # example: "botuser"
#     gitlab_username: ""
#
#     # default namespace for short repo names
#     # example: "example"
#     gitlab_default_namespace: ""
#
#     # GitLab username to assign as MR reviewer
#     # example: "reviewer-user"
#     gitlab_reviewer: ""
#
#     # that user's numeric id — recorded, read by nothing
#     # example: "1234567"
#     gitlab_reviewer_id: ""
#
#     # # GitHub settings
#     # GitHub instance URL, or GitHub Enterprise (one instance only)
#     github_url: "https://github.com"
#
#     # Personal access token (repo scope)
#     # example: "ghp_xxxxxxxxxxxxxxxxxxxx"
#     # A credential: set it as istota_secrets.istota_developer_github_token, not here.
#     github_token: ""
#
#     # GitHub username (defaults to x-access-token)
#     github_username: ""
#
#     # default org/user for short repo names
#     # example: "myorg"
#     github_default_owner: ""
#
#     # GitHub username to request as PR reviewer
#     # example: "reviewer-user"
#     github_reviewer: ""
#
#     # # Author credit appended to every commit message the bot writes. This is the
#     # # only trailer the `commit` skill permits; nothing else is ever appended.
#     # example: "Co-Authored-By: Bot <bot@example.invalid>"
#     author_credit: ""
#
#     # # Forge CLI policy. The baseline deny list lives in code, not here — it is a
#     # # safety default rather than a preference. These two knobs extend and
#     # # puncture it. Write an entry as you would type it; one with no binary name
#     # # applies to both CLIs. A `forge_cli_permit` entry that matches no baseline
#     # # rule is warned about at startup, because a hatch that silently stopped
#     # # matching reads exactly like one that is still open.
#     # refuse these too
#     # example: ["gh pr merge"]
#     forge_cli_extra_denied: []
#
#     # turn a baseline guard off
#     # example: ["gh repo delete"]
#     forge_cli_permit: []
#
#     # # Where the real binaries live. The Ansible role renders these from what it
#     # # installed; set them by hand if gh or glab is somewhere else.
#     gh_bin_path: "/usr/local/bin/gh"
#     glab_bin_path: "/usr/local/bin/glab"
#
#     # Where project code builds and runs
#     # **There is no key for this.** It is derived from `[devbox] enabled` together
#     # with `[developer] enabled` and a non-empty `repos_dir`. A deploy-time choice,
#     # not a runtime one: within a deployment there is exactly one place a build
#     # happens, which is what keeps the property a per-command fallback would cost —
#     # nothing on the host ever consumes an environment the container built, so no
#     # parity rule has to hold.
#     #
#     # Without a devbox, npm, uv, cargo and the rest run on the host inside the
#     # task's bwrap sandbox, where they cannot reach a registry that is not on the
#     # CONNECT allowlist and cannot install a system package. With one, they run in
#     # that user's devbox over a Unix-socket exec transport.
#     #
#     # A `backend` key used to sit in the block below and say which. It is retired,
#     # and a file still carrying it gets a warning at load and a WARN from `doctor`.
#     # Retiring it removed two states rather than a knob: the devbox on with the
#     # backend off offered the model a devbox skill whose every verb but `reset`
#     # refused, and the backend on with the devbox off asked the developer skill to
#     # reach a container nothing had built. If you set it to "none" to keep builds on
#     # the host, turn `[devbox] enabled` off instead — that is now the one switch.
#     #
#     # The devbox image has to be built with the daemon's own uid; the Ansible role
#     # does that from a `getent` lookup. A mismatched uid is the one failure with no
#     # error message anywhere that names it: the container cannot write into a
#     # worktree the daemon made, and once that is worked around the daemon cannot
#     # unlink a tree the container made, so every worktree that ever ran a build
#     # becomes permanently unreapable.
#     #
#     # Check it with `istota doctor --only developer.container`, which answers four
#     # questions that each fail silently: does this file derive what the running
#     # daemon believes, does the transport answer, do the two sides agree on uid and
#     # repos root, and is the uv cache mounted.
#     #
#     # Note `repos_dir` above is a *per-user root* **on every backend, including
#     # "none"**: the daemon derives `{repos_dir}/{user_id}` and hands that to the
#     # sandbox bind, `DEVELOPER_REPOS_DIR` and the credential scrub. That is what
#     # closes cross-user worktree access, and it has nothing to do with containers —
#     # so an upgraded host must move its existing clones down a level before the
#     # developer skill can see them again. The Ansible role does it; with more than
#     # one configured user it needs `istota_developer_repos_migrate_to` and fails the
#     # play until it gets one, because a green play there is followed by a daemon
#     # restart into a state where the bind names an empty directory.
#     #
#     # The devbox credential proxy: one socket per user under this directory, which
#     # lets the forge CLIs and pushes in a devbox authenticate without holding a token.
#     devbox_proxy_enabled: true
#     devbox_proxy_socket_dir: "/var/run/istota"
#
#     # empty = journal only; a path adds a file
#     devbox_proxy_audit_log: ""
#
#     # # Worktree reaping. Nothing used to remove a task's worktree, so `repos_dir`
#     # # grew gigabyte checkouts with no owner. A scheduler job (see
#     # # `[scheduler] worktree_reap_interval`) removes only a worktree that is clean
#     # # (untracked and gitignored files included), unlocked, idle for the window
#     # # below, and carrying no commit that is not already upstream — squash- and
#     # # rebase-merged branches included. Everything else is kept and counted.
#     # # The window is what protects a task running *right now*: the sweep is
#     # # periodic and knows nothing about the worker pool, so recent activity is the
#     # # only evidence available that a checkout is in use. It is clamped to a
#     # # one-hour floor, because a worktree seconds old is clean and carries nothing
#     # # that is not upstream — the reapable state — so a shorter window would take
#     # # the checkout of a task still setting it up. To pin one indefinitely, use
#     # # `git worktree lock` rather than turning the sweep off.
#     worktree_reap_enabled: true
#     worktree_retention_hours: 24.0
#
#     review:
#       # false disables the CLI; the workflow then
#       # reports "review unavailable" and lands anyway
#       enabled: true
#
#       # role alias; a ":effort" modifier is honoured.
#       # Was bughunt_model, still read when model is unset
#       model: "smart:high"
#
#       # files the reviewer may read beyond the changed
#       # ones; 0 or less reads as 8
#       file_budget: 8
#
#       # the reviewed commit's tree, written for the
#       snapshot_max_bytes: 104857600
#
#       # reviewer to read: total and per-file caps,
#       # changed files first; 0 or less keeps the default
#       snapshot_max_file_bytes: 2097152
#
#       # the diff in the prompt; the full patch is in
#       # the snapshot either way
#       max_diff_chars: 200000
#
#       # the reviewer's budget, a reformat of an unusable
#       # answer included. It runs a high-effort model and
#       # reads files, and 240 was measured too short on
#       # real diffs. --timeout on `run` overrides it for
#       # one run
#       timeout_seconds: 480
#
#       # review runs per task that reached the model. A
#       # run charges 1: the review, plus one text-only
#       # reformat call if the first answer was unusable.
#       # 0 or less permits none — use enabled = false to
#       # switch the feature off. At the cap the review
#       # degrades to skipped rather than erroring
#       max_calls_per_task: 8
#
#     container:
#       # the parent; the socket is {dir}/{user}/exec.sock
#       exec_socket_dir: "/run/istota-exec"
#
#       # the client's connect budget
#       connect_timeout_seconds: 5.0
#
#       # server-side backstop reap for an idle connection
#       idle_timeout_seconds: 3600
#
#       # # The commands fronted by a shim. Two absences are deliberate and one of them
#       # # is not negotiable. `python3` is refused whatever you write here: the sandbox
#       # # starts its own network bridge with it, so a shim would route that into the
#       # # container and break egress for every developer-enabled task. `make` is
#       # # merely omitted — shimming a *driver* inverts routing for everything beneath
#       # # it, so a Makefile calling git, gh or python3 would get the container's
#       # # copies. Add it if you know your Makefiles; the cost of leaving it out is a
#       # # Makefile that calls ./node_modules/.bin/foo by path.
#       shim_commands: ["npm", "npx", "pnpm", "yarn", "node", "uv", "uvx", "pip", "pip3", "cargo", "rustc", "rustup", "go", "bundle", "gem"]
#
#   security:
#     credential_history_days: 180
#     credential_audit_days: 365
#     credential_exports_per_day: 3
#     credential_backup_retention: 30
#
#     credential_broker:
#       # opt-in header substitution for snapshotted bound hosts
#       enabled: false
#
#       # audit public value reads; true refuses non-revealable values (needs enabled)
