#     # Set 0 to disable task-requested writes;
#     # unlike the fetch limit, 0 is not unlimited.
#     vault_writes_per_task: 3
#
#     # purchase requests, including refusals
#     wallet_requests_per_task: 3
#
#     # card fills within one authorization
