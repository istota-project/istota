# Map Nextcloud usernames to their settings
# Only messages from configured users will be processed
# email_addresses maps email addresses to users for email input channel

[users.alice]
display_name = "Alice"
email_addresses = ["alice@example.com", "alice.work@company.com"]
timezone = "America/New_York"  # IANA timezone for briefing scheduling
# alerts_channel = "alertsroom456"  # Talk room for confirmations and security alerts
# trusted_email_senders = ["*@company.com"]  # trusted senders bypass email confirmation gate
# briefing_email_html = false  # briefing email as plain text only. Default (true) sends
                               # multipart/alternative — HTML with clickable article links
                               # plus a plain-text fallback part. Also settable per user via
                               # `istota user ensure --no-briefing-email-html` or the web UI
                               # (Briefings → settings → Email delivery).

# Alice's resources — only `folder` (an out-of-workspace sandbox mount)
# is declarable after the Resources sunset. todo/reminders/notes are
# briefing-source properties (set the source `path`), and calendars are
# CalDAV-discovered.
# [[users.alice.resources]]
# type = "folder"
# path = "/shared/Projects"
# name = "Projects"
# permissions = "write"

# Alice's briefings. Content is config-authored blocks (the sole content model);
# schedule + delivery come from name/cron/conversation_token/output. When a
# briefing declares `blocks`, they are seeded ONCE into the user's briefings
# module DB as an editable baseline. After the first materialisation the briefing
# is an ordinary editable per-user briefing; the user reorders/edits it in the
# web editor and operator re-runs never re-clobber it (seed-once). `blocks` are
# never stored in the framework DB — they live only in this config and are
# consumed by the module-DB seeder. See the per-kind config reference below.
[[users.alice.briefings]]
name = "morning"
cron = "0 6 * * *"  # 6am in user's timezone
conversation_token = "room123"  # Talk room to post to
output = "talk,email"  # talk / email / ntfy, or a comma list (default: "talk")

  [[users.alice.briefings.blocks]]
  title = "Today"
  render_mode = "structured"

    [[users.alice.briefings.blocks.sources]]
    kind = "calendar"
    config = {}

    [[users.alice.briefings.blocks.sources]]
    kind = "todos"
    config = {}

  [[users.alice.briefings.blocks]]
  title = "Markets"
  render_mode = "structured"

    [[users.alice.briefings.blocks.sources]]
    kind = "markets"
    config = {}

[[users.alice.briefings]]
name = "world"
cron = "0 7 * * *"
output = "email"

  [[users.alice.briefings.blocks]]
  title = "World News"
  directive = "3–5 stories, neutral tone, no markets."
  render_mode = "synthesis"          # synthesis | structured (omit to infer)
  options = { story_count = 5 }

    [[users.alice.briefings.blocks.sources]]
    kind = "rss"                     # a Feeds subscription or category
    config = { feed_ref = { kind = "category", value = 4 }, lookback_hours = 24, limit = 10 }

    [[users.alice.briefings.blocks.sources]]
    kind = "browse"                  # a bundled preset or arbitrary URL frontpage
    config = { preset = "ap" }

  [[users.alice.briefings.blocks]]
  title = "Markets"
  render_mode = "structured"

    [[users.alice.briefings.blocks.sources]]
    kind = "markets"
    config = {}


