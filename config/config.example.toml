# Istota configuration

# The name your bot uses in chat, emails, and folder names.
# Change this to whatever you want to call your assistant.
bot_name = "Istota"

# Include emissaries.md (constitutional principles) in system prompts (default: true).
# `istota setup` writes `false` here for local single-user installs.
# emissaries_enabled = true

# =============================================================================
# Model selection — three knobs that interact
# =============================================================================
# `model` + `effort` set the *default* for every task (cron, briefings, talk,
# email, ...). Both fields are read independently.
# `[models.aliases]` (further down) is the operator-visible registry overlaying
# the shipped tier/shortcut defaults.
#
# Resolution chain:
#   1. Per-task overrides — `!model <alias> <prompt>` from Talk wins, both
#      model and effort stored on the task row.
#   2. Otherwise — top-level `model` + `effort` here.
#   3. Otherwise — brain default.
#
# Effort is an ORTHOGONAL :effort modifier on any reference (opus:high,
# smart:low, opus:xhigh) — it is no longer baked into an alias name.
# So `model = "opus:high"` here sets BOTH the model and the effort in one token
# (no need to also set `effort =`); the modifier's effort wins.
# =============================================================================

# Deprecated (ISSUE-418). Set `model` and `effort` under [brain.claude_code] and
# [brain.tmux] instead; these still load and are moved there with a warning.
# model = "claude-opus-5-5"
# effort = "high"

# Advisor model for the anthropic-namespace brains: an ID or alias, resolved
# like `model` but carrying no effort. Empty = no advisor. It must be a model
# that can act as an advisor; a cheap tier fails every task it runs on.
# advisor_model = ""

# Use config/system-prompt.md instead of Claude Code's default system prompt.
# That one file is bind-mounted read-only into the sandbox.
# custom_system_prompt = true

# Database path (relative to working directory or absolute)
db_path = "data/istota.db"

# Local-disk root for the per-user module databases (feeds, health, location,
# money). It must not be on the Nextcloud mount; a path under
# workspace_mount_path is refused.
module_data_dir = "data/modules"

# =============================================================================
# File Access Configuration
# =============================================================================
# Root of the bot's on-disk file tree. Defaults to workspace_mount_path.
# Required when [nextcloud] url is set, whether or not it is the mount.
workspace_path = "/srv/mount/nextcloud/content"

# The mountpoint the workspace lives on, if any: the rclone mount of the bot's
# Nextcloud files, or a host folder shared into a VM. Doctor and the backup
# guard check it is mounted. Old name: nextcloud_mount_path.
# workspace_mount_path = "/srv/mount/nextcloud/content"

# Path to skills directory (individual skill files loaded selectively)
skills_dir = "config/skills"

# Skills to exclude from selection (instance-wide)
# disabled_skills = ["browse", "whisper"]

# Temporary directory for task execution
temp_dir = "/tmp/istota"

# Cap on the characters of recalled memory in one task prompt; 0 is unlimited.
# Lowering it drops the weakest matches first.
# max_memory_chars = 0
# `max_knowledge_facts` caps how many knowledge-graph facts a single prompt
# carries; 0 is unlimited.
# max_knowledge_facts = 50

# Operator opt-in flags for rough features that ship off by default.
# `istota experimental list` shows what this build can gate.
[experimental]
# features = ["money_tax", "money_wash_sales"]
features = []

# Which backend runs tasks: "claude_code" (the headless `claude -p` CLI, the
# default), "native" (istota's own agent loop against an OpenAI-compatible
# endpoint) or "tmux_claude" (the interactive `claude` TUI in tmux).
# [brain]
# kind = "claude_code"
#
# Availability failover: rerun a task on this brain when the primary is
# unavailable (usage limit, missing binary, tmux launch failure). "" is no
# fallback. A pinned room or job never fails over.
# fallback = ""                       # "" | "claude_code" | "native" | "tmux_claude"
# fallback_on_transient = true        # also reroute a persistent transient_api_error
#                                     # (429 / 5xx / 529 / network) after the primary's
#                                     # own retries are exhausted. Set false to opt out.
# fallback_cooldown_seconds = 900     # skip an unavailable primary this long; 0 disables stickiness
#
# Brain kinds a room or a CRON.md job may pin. Empty (the default) means none
# may; setting a pin is admin-only.
# room_selectable = []                # e.g. ["claude_code", "native"]
#
# Native-brain settings (only used when kind = "native", or via a routing
# override below). The API key stays out of this file — set it via the
# ISTOTA_BRAIN_NATIVE_API_KEY env override.
# [brain.native]
# provider = "openai_compat"                 # only provider currently
# model = "claude-sonnet-4-6"                # explicit id for openai_compat
# effort = ""                                # default effort: low/medium/high/xhigh/max.
#                                            #   Sent as `reasoning_effort` only to a
#                                            #   thinking-capable model; xhigh/max fold
#                                            #   to high over the compat endpoint. Empty
#                                            #   = no reasoning_effort field. Per-task
#                                            #   effort (e.g. !model opus:high) overrides.
# base_url = "https://api.anthropic.com/v1"  # any OpenAI-compatible endpoint
# context_window = 0                         # 0 = resolve from the live-fetched
#                                            #   OpenRouter catalog (below) or the
#                                            #   conservative 200k default. A NON-
#                                            #   OpenRouter native endpoint (local
#                                            #   vLLM/Ollama) SHOULD set its real
#                                            #   window here (or a model_overrides
#                                            #   entry) — nothing fetches it.
# max_turns = 100                            # hard cap on assistant turns/task
# max_tokens = 16384                         # per-completion output cap
# compaction_reserve_tokens = 0              # headroom compaction leaves free below the context
#                                            #   window. 0 derives it from the window, which is
#                                            #   what a small-window local model wants — the
#                                            #   fixed constants are sized for an Anthropic
#                                            #   window and would compact it constantly.
# compaction_keep_recent_tokens = 0          # how much of the tail compaction keeps verbatim
#                                            #   rather than summarising. 0 derives it the same
#                                            #   way. The two are read independently — setting
#                                            #   one and leaving the other at 0 derives only
#                                            #   the one left unset.
# model_catalog_fetch = true                 # when base_url is OpenRouter, fetch its
#                                            #   public model list once/process for real
#                                            #   window / capabilities / prices (self-
#                                            #   updating; disk-cached). No effect for a
#                                            #   non-OpenRouter endpoint. Fetch failure is
#                                            #   never fatal (stale cache → 200k default).
# model_catalog_cache_ttl_hours = 24         # disk-cache freshness for the fetch above
# turn_budget_nudge = true                   # pace the model as it nears max_turns: inject an
#                                            #   environment notice so a long tool-bearing run
#                                            #   delivers a partial answer instead of getting
#                                            #   capped mid-plan. Off for models that mishandle
#                                            #   meta-instructions.
# turn_budget_nudge_early_percent = 50       # first (~halfway) reminder fires at this % of the cap
# turn_budget_nudge_remaining = [15, 5]      # escalating late fires at these absolute steps-remaining
#                                            #   Both ladders also run against the wall clock: the
#                                            #   loop estimates the turns the remaining time has
#                                            #   room for and uses whichever budget is scarcer, so
#                                            #   the notices stay reachable on a slow brain.
# soft_deadline_percent = 90                 # stop the loop at this % of scheduler.task_timeout_
#                                            #   minutes, keeping the model's partial work.
#                                            #   0 or >= 100 disables.
# prompt_caching = true                      # cache_control breakpoints. Omit to use the
#                                            #   default: ON for api.anthropic.com,
#                                            #   OFF for any other endpoint. Set explicitly
#                                            #   to force either way (a plain-OpenAI / local
#                                            #   endpoint that rejects cache_control needs
#                                            #   `false`).
# bash_spill_full_output = true              # write Bash output past the per-tool cap to a
#                                            #   temp file the model can Read, rather than
#                                            #   dropping the tail.
# api_key = ""                               # prefer the ISTOTA_BRAIN_NATIVE_API_KEY override
#
# The native brain's WebFetch tool, available to every user. It runs in the
# daemon's network namespace, outside the sandbox allowlist, so the fields
# below are its egress policy: credential-free, SSRF-checked, GET and text only.
# [brain.native.web_fetch]
# enabled = true
# admin_only = false              # true withholds the tool from non-admins. It
#                                 #   decides whether the tool exists, not where
#                                 #   a fetch may go.
# timeout_seconds = 20.0          # total wall clock per fetch
# max_bytes = 5000000             # response body cap, enforced while streaming
# max_content_chars = 100000      # extracted text handed to the model
# max_redirects = 5               # hops before giving up; each one is re-validated
# allow_http = false              # true permits cleartext http://, whose content
#                                 #   anyone on the path can change
# allowed_ports = [80, 443]       # a port not listed is refused before any connect
# user_agent = "IstotaBot/1.0"
# allow_hosts = []                # non-empty makes this an allowlist (suffix match):
#                                 #   nothing else is fetchable at all
# block_hosts = []                # always refused (suffix match), allowlist or not
# extra_blocked_cidrs = []        # operator additions to the private/reserved
#                                 #   blocklist — a metadata endpoint or an internal
#                                 #   range the shipped list does not know about
# require_url_provenance = false  # true limits fetches to URLs that appeared in the
#                                 #   task itself, so a model cannot compose one from
#                                 #   data it read. For a deployment ingesting content
#                                 #   it does not trust.
#
# DOCKER: with the db_path `istota setup` writes, transcripts land in
# /data/db/logs on the istota_data volume.

# Per-attempt JSONL transcript of a native-brain run: the prompt, every turn,
# tool call and result. Written 0600 on local disk and bound into no sandbox.
# [brain.native.session_log]
# enabled = true                  # false = no new files; retention still sweeps existing ones
# dir = ""                        # "" is {db_path.parent}/logs. Write an absolute path;
#                                 #   the retention sweep deletes *.jsonl files under it.
# retention_days = 14             # age rule. 0 = keep for ever by age; the size ceiling
#                                 #   below still applies.
# max_total_gb = 2.0              # size ceiling across every user summed; the largest
#                                 #   user's oldest files go first. Clamped to a 0.5 floor.
#                                 #   0 = no ceiling.
# max_content_chars = 32768       # per text/thinking block; over the cap it keeps head and
#                                 #   tail. 0 means no cap.
# max_args_chars = 8192           # per tool-call arguments object; over the cap it becomes a
#                                 #   marker. 0 = no cap.
# include_thinking = true         # reasoning traces in the written log; the bulkiest part.
#
# The tmux_claude brain. Every field defaults in code. The marker lists are
# pane-text heuristics pinned to a claude CLI version; override one if a CLI
# reword breaks readiness detection.
# [brain.tmux]
# model = "claude-opus-5-5"         # this brain's own default model (ISSUE-418);
# effort = "high"                   #   same values as [brain.claude_code] above,
#                                   #   same anthropic namespace, same binary.
#                                   #   "" = the CLI's own default
# fallback_trip_threshold = 5       # consecutive launch failures before the circuit opens
# fallback_cooldown_seconds = 300   # how long the circuit stays open (routes to the
#                                   # configured [brain] fallback, if any)
# ready_timeout_seconds = 30        # REPL-ready deadline
# tmux_command_timeout = 10         # per-tmux-subprocess timeout
# cli_version_pin = "2.1.168"       # supported claude CLI; mismatch logs a WARNING
# ready_markers = ["bypass permissions on", "? for shortcuts", "for shortcuts"]
# trust_markers = ["trust this folder", "Is this a project you"]
# theme_markers = ["Choose the text style", "run /theme"]   # first-run theme picker
# bypass_warning_marker = "Bypass Permissions mode"
# bypass_accept_marker = "Yes, I accept"
# error_markers = ["API Error", "session limit reached", "Context low"]
# usage_limit_markers = ["session limit reached", "usage limit reached", "Claude usage limit"]
#                                   # pane substrings → stop_reason=usage_limit → the
#                                   # configured [brain] fallback, if any
#
# The headless `claude -p` brain: its default model and effort, and the
# subscription usage poll. Read whatever `kind` is set to, since a fallback or
# a routing override can reach it.
# [brain.claude_code]
# This brain's default model and effort when the task pins none. A canonical
# id, a shortcut ("opus"), a role tier ("smart"), optionally with ":high".
# Empty = the CLI's own default.
# model = "claude-opus-5-5"
# effort = "high"
#
# Poll the Claude plan's utilization for /admin and `istota doctor`. The
# credential is only read. Off = no admin card and the doctor check skips.
# subscription_usage = true
# subscription_usage_cache_ttl_seconds = 1800    # one deployment-wide fetch per this window,
#                                                #   and the minimum wait after a failure.
#                                                #   Floored at 1.
# subscription_usage_timeout_seconds = 10        # matches doctor.PROBE_TIMEOUT; floored at 1
# subscription_usage_warn_percent = 80.0         # doctor WARNs, the tile turns amber
# subscription_usage_high_percent = 95.0         # the tile turns red; still a WARN, never a FAIL
#                                                #   both clamp to [0, 100]; warn above high is
#                                                #   lowered to high (logged) — an inverted pair
#                                                #   leaves no amber band
# subscription_usage_stale_after_seconds = 3600  # a stale-cache reading older than this is
#                                                #   reported SKIP, not as a current number
#
# Route tasks by source_type to a brain kind, overriding `kind` for them (say,
# cron on native while chat stays on claude_code). Unknown kinds are logged and
# ignored.
# [brain.source_type_overrides]
# scheduled = "native"
# heartbeat = "native"

# ============================================================================
# Security Hardening
# ============================================================================
# Claude subprocess runs with a clean minimal environment and --allowedTools
# whitelist. Credentials are injected per-task and optionally routed through
# the skill proxy (enabled by default) for credential isolation.
# Secrets can be provided via env vars (e.g. from systemd EnvironmentFile=).
# Naming convention: ISTOTA_<SECTION>_<FIELD>, matching the config dataclass path.
#   ISTOTA_NEXTCLOUD_APP_PASSWORD, ISTOTA_EMAIL_IMAP_PASSWORD, ISTOTA_EMAIL_SMTP_PASSWORD,
#   ISTOTA_DEVELOPER_GITLAB_TOKEN, ISTOTA_DEVELOPER_GITHUB_TOKEN

# [security]
# credential_history_days = 180
# credential_audit_days = 365
# credential_backup_retention = 30
# credential_exports_per_day = 3
# wallet_requests_per_task = 3    # purchase requests, including refusals
# wallet_fills_per_purchase = 3   # card fills within one authorization
# wallet_authorization_minutes = 30 # clamped to 5..240 minutes
# sandbox_enabled = true           # bwrap filesystem isolation per user (Linux only)
# skill_proxy_enabled = true       # proxy skill CLI calls via Unix socket (credential isolation).
#                                  # Required wherever sandbox_enabled is true: off, credentials
#                                  # sit in the task environment and skill CLIs refuse to run.
# skill_proxy_timeout = 300        # timeout for proxied skill commands (seconds).
#                                  # Capped at skill_client_wait_seconds minus 30;
#                                  # see [security.skill_proxy_timeouts] below to give
#                                  # one skill a different budget.
# skill_client_wait_seconds = 600  # how long the sandboxed istota-skill client waits
#                                  # on the proxy socket. Every skill timeout is capped
#                                  # at this minus 30s.
# vault_fetch_limit_per_task = 10  # shared-credential fetches one task attempt may
#                                  # make. 0 is unlimited. A fetch of a name that does
#                                  # not exist still counts; listing names does not.
# On deployments with several configured users, vaults require a working sandbox.
# Accept same-uid cross-task credential exposure only as an operator decision.
# allow_unsandboxed_multi_user_vaults = false
# vault_writes_per_task = 3        # how many create requests one task attempt may
#                                  # make against the user's KDBX. Refusals count.
#                                  # Set 0 to disable task-requested writes;
#                                  # unlike the fetch limit, 0 is not unlimited.
# passthrough_env_vars = ["LANG", "LC_ALL", "LC_CTYPE", "TZ"]
# sandbox_ro_paths = []            # extra RO bind-mounts in sandbox, for co-located services the
#                                  # agent needs to read. Keep entries narrow.
# sandbox_cache_dir = ""           # disk root for the package managers' caches, one
#                                  # {root}/{user_id} each, used only without the developer
#                                  # skill. Empty keeps them in RAM for one task. Must be an
#                                  # existing, writable absolute path.
# sandbox_cache_sweep_enabled = true  # prune the per-user package caches to the ceiling
#                                  # below, on [scheduler] sandbox_cache_sweep_interval.
# sandbox_cache_max_gb = 10.0      # the cache ceiling per user. Clamped to a 1 GiB floor.

# Per-skill overrides of skill_proxy_timeout, in seconds, each capped at
# skill_client_wait_seconds minus 30. code_review has its own 540s ceiling
# unless named here.
# [security.skill_proxy_timeouts]
# browse = 90

# [security.credential_broker]
# enabled = false                 # opt-in header substitution for snapshotted bound hosts
# enforce_reveal = false          # audit public value reads; true refuses non-revealable values (needs enabled)
# scan_max_bytes = 1048576         # request scan and response scrub limit
# leaf_validity_hours = 24         # positive lifetime for per-host TLS certificates
# Enable enforcement after a week with no would_refuse credential_reveal events.
# Manifest env reads (including forge tokens) are refused too; skills still get their env.
# The CA stays in daemon state. Only sandbox commands receive its trust bundle.
# Network proxy and effective sandboxing are required for credential containment.

# [security.network]
# enabled = true                   # --unshare-net + CONNECT proxy (requires sandbox)
# allow_pypi = true                # add pypi.org + files.pythonhosted.org to allowlist
# extra_hosts = []                 # operator-specific additions (e.g. ["registry.example.com:443"])
#
# The public npm and crates.io registries are already added for a task that is
# authorized for the `developer` skill, so an install inside a worktree needs
# nothing here. `extra_hosts` is for what those defaults cannot cover: a
# private registry, a company mirror, or an ecosystem that is not npm, PyPI or
# cargo. Note it applies to *every* task rather than only developer ones —
# there is no per-skill operator list. Matching is exact `host:port` with no
# wildcards, so a missing entry fails at the boundary and reads as a broken
# install. See docs/deployment/security.md for what is deliberately uncovered.

[nextcloud]
# Nextcloud server URL, for Talk, the nextcloud skill, OCS and DAV. Setting it
# requires workspace_path.
url = "https://nextcloud.example.com"
# Bot's Nextcloud username
username = "istota"
# App password (generate in Nextcloud: Settings > Security > Devices & sessions)
# Note: CalDAV settings are derived from these values automatically
# CalDAV URL = {url}/remote.php/dav, using same username/app_password
app_password = "xxxxx-xxxxx-xxxxx-xxxxx-xxxxx"
# Default expiry applied by `nextcloud share link`. A handed-out link that never
# expires is the thing worth avoiding; 0 opts out of a default entirely.
share_default_expire_days = 14
# Where the bot's storage root sits inside its own Nextcloud files, prefixed
# onto every DAV and OCS path. Empty when they are the same directory.
dav_prefix = ""
# Share the bot workspace back to the user over OCS at boot. Set false where
# something else already puts it in the user's files.
auto_share_bot_dir = true

# ============================================================================
# CalDAV (only when the calendar is not the Nextcloud above)
# ============================================================================
# A calendar server other than the Nextcloud above (Radicale, Fastmail,
# Google). Set all three fields or none: each blank one falls back to the
# [nextcloud] value on its own.
# [caldav]
# url = "https://dav.example.com"
# username = "you@example.com"
# password = ""                  # prefer ISTOTA_CALDAV_PASSWORD in the env file

[talk]
# Enable Talk polling (requires istota user to be added to conversations)
enabled = true
# Bot's Nextcloud username (to filter its own messages)
bot_username = "istota"
# Largest Talk attachment, in MB, fetched into the room's folder when the
# workspace is not the Nextcloud mount. Larger files are skipped.
attachment_max_mb = 50
# Days a fetched attachment is kept before the cleanup pass removes it. 0 keeps
# them. Not used when the workspace is the mount.
attachment_retention_days = 30

[talk.signaling]
# Receive Talk messages over Nextcloud's signaling server (the HPB) instead of
# polling. The HPB must be registered with Talk and the `signaling` extra
# installed, or the daemon refuses to start.
enabled = false
# HPB base URL. Empty uses whatever Talk advertises; set it only where the
# daemon reaches the server by a different route than browsers.
url = ""
# Seconds between room reconciliations, which fetch any room that is behind.
# This bounds how long a gap lasts when the event stream is down.
room_sync_interval = 300
# Reconnect backoff ceiling, seconds.
reconnect_backoff_max = 60
# Ingest the relayed message directly instead of refetching the room. Has no
# effect before about Talk 21, which sends no message with the event.
payload_direct = false

[email]
# Enable email functionality (requires himalaya to be installed)
enabled = true
# IMAP settings (for receiving)
imap_host = "imap.example.com"
imap_port = 993
imap_user = "istota@example.com"
imap_password = "app-password-here"
# SMTP settings (for sending) - defaults to IMAP credentials if not set
smtp_host = "smtp.example.com"
smtp_port = 587
# smtp_user = ""  # uses imap_user if empty
# smtp_password = ""  # uses imap_password if empty
# Polling settings
poll_folder = "INBOX"
bot_email = "istota@example.com"  # bot's email address (to skip own messages)
# signup_task_window_minutes = 30  # first signup message may mint one follow-up task; 0 only files mail
# signup_body_retention_days = 14  # blank old filed bodies, retain message rows
# imap_timeout_seconds = 30  # socket timeout for IMAP connections (fail fast on a dead host)
# Who checks that mail from a user's own address really is theirs: "off" (the
# receiving MTA enforces DMARC), "verify" (trust a dmarc=pass stamped by
# authserv_id, hold the rest) or "gate" (hold every such message).
# confirm_sender_match = "off"
# Warn when mail routed on a user's own address arrives without a DMARC pass.
# Monitoring only; it never holds mail.
# dmarc_canary = true
# Also warn when the MTA's stamp has no DMARC verdict at all. Turn on once you
# know your MTA stamps.
# dmarc_canary_warn_on_missing = false
# A disclosure line on every mail the bot sends into a multi-person thread:
# "Written by <bot>, an AI assistant, for <host>", plus how to stop it replying
# there. Off by default, since mail from the bot's address is already from the
# bot.
# thread_disclosure_footer = false
# Your receiving MTA's authserv-id: the first token of the Authentication-Results
# header it stamps, before the semicolon. Set, headers from any other
# authserv-id are ignored. Required by confirm_sender_match = "verify".
# authserv_id = "mx.example.com"
#
# The weakest outbound approval policy any user may run: "off" (never hold),
# "untrusted" (hold mail unless every recipient is trusted) or "all" (hold
# unless every recipient is the user's own). An invalid value fails the load.
# outbound_approval_floor = "untrusted"

# SMS uses one active provider. A complete inactive provider block remains
# available for signed delivery callbacks after a provider switch.
[sms]
enabled = false
provider = "twilio"  # twilio | telnyx
service_numbers = []
default_sender_number = ""
max_segments = 6
request_timeout_seconds = 10

[sms.twilio]
account_sid = ""
auth_token = ""
api_key_sid = ""
api_key_secret = ""
messaging_service_sid = ""

[sms.telnyx]
api_key = ""
public_key = ""
messaging_profile_id = ""

# One WhatsApp business phone number. The Cloud adapter's three credentials
# belong in ISTOTA_WHATSAPP_ACCESS_TOKEN / _APP_SECRET / _VERIFY_TOKEN, not here.
[whatsapp]
enabled = false
# Which adapter sends and receives: "baileys" (a WhatsApp Web session paired by
# QR scan, no Meta account, free) or "whatsapp_cloud" (Meta's metered Cloud
# API, configured in [whatsapp.cloud]).
provider = "baileys"
business_phone_number = ""      # exact E.164, with the leading +
# In a group, a member's photo or GIF with no caption waits this long for the
# same member's next message, which is then read as its caption so the two get
# one answer. 0 answers the file at once.
group_bare_file_hold_seconds = 30

# Meta's Cloud API adapter, read only under provider = "whatsapp_cloud". The
# same keys written flat under [whatsapp] are DEPRECATED but still load.
[whatsapp.cloud]
waba_id = ""                    # decimal WhatsApp Business Account id
phone_number_id = ""            # decimal business phone number id, not the number
access_token = ""
app_secret = ""
verify_token = ""
graph_api_version = ""          # "" follows the version PyWa pins
business_timezone = "UTC"       # IANA zone the monthly quota month is computed in
request_timeout_seconds = 10
# "free_guard" sends no templates and caps attempts at the limit below (1-1000);
# "allow_paid" may cost money, and a limit of 0 there means no local cap.
billing_policy = "free_guard"   # free_guard | allow_paid
monthly_service_attempt_limit = 900

# One approved Meta utility template, sent when the 24-hour service window has
# closed. Paid; valid only with billing_policy = "allow_paid".
[whatsapp.cloud.proactive_template]
enabled = false
name = ""
language = "en_US"

# The Baileys adapter. The paired session on disk is its credential.
[whatsapp.baileys]
session_dir = ""                # "" = beside the database
library_version = ""            # "" = what the shipped sidecar pins
# Command the daemon runs for the Node sidecar. Empty spawns nothing, for a
# sidecar run as its own unit or compose service.
sidecar_command = ""
# Allow re-pairing from Admin, Connections. `istota whatsapp pair` works either way.
pairing_enabled = true
# How long a pairing window stays open. The code is a full-account credential,
# so shorter is safer.
pairing_window_seconds = 300
# Where the pairing code passes to the web process. Empty is a 0600 file beside
# the database.
pairing_relay_path = ""
# Roughly how long the supervisor waits before restarting the sidecar; it only
# sizes how long a re-pair waits. 0 = undeclared (Docker); under systemd use RestartSec.
restart_interval_seconds = 0

[conversation]
# Enable conversation context (uses Sonnet to select relevant previous messages)
enabled = true
# Number of recent messages to consider
lookback_count = 25
# Include all messages without selection if history <= this threshold (faster for short threads)
skip_selection_threshold = 3
# Model for selecting relevant context. Accepts canonical IDs ("claude-haiku-4-5"),
# shortcuts ("haiku"), or role tiers ("fast" — default; resolves to Haiku via
# brain.claude_code.DEFAULT_ALIASES, operator-overridable via [models.aliases] below).
selection_model = "fast"
# Timeout for context selection
selection_timeout = 30.0
# Set to false to include all lookback messages without LLM selection (useful for testing)
use_selection = true
# Always include this many recent messages without selection (rest triaged by model)
always_include_recent = 5
# Max chars per bot response in conversation context (0 to disable truncation)
context_truncation = 0
# Number of recent unfiltered tasks to inject into context (ensures scheduled/briefing
# messages aren't orphaned when the user replies to them)
previous_tasks_count = 3
# Include older messages only if they fall within this many hours (0 = no window)
# context_recency_hours = 0
# Always include at least this many recent messages, whatever their age
# context_min_messages = 10
# Messages to fetch from Talk API for context (max 200, default 100)
# Talk API-based context shows all participants' messages, not just bot interactions
talk_context_limit = 100

[speech_gate]
# Whether the bot replies to an unaddressed turn in a room with more than one
# human: "mention" (only when mentioned), "classifier" (a cheap model decides)
# or "off" (reply to every turn).
mode = "classifier"
# How wide the classifier reads "for the bot". "reserved" answers requests and
# answers to its questions; "friendly" also answers thanks and reactions to
# its last answer, in one short line.
disposition = "friendly"
# Under "friendly", the reaction a mere acknowledgement gets on Talk and in
# WhatsApp groups instead of a reply, when the table below has none for it.
# Empty turns reactions off everywhere.
ack_reaction = "👍"
# Classifier model. A role alias ("fast"), resolved per brain namespace.
model = "fast"
# Transcript turns the classifier sees, and the per-turn character cap
window_messages = 8
max_message_chars = 400
# Seconds the classifier may take. A timeout means no reply, and on the
# claude_code brain each call starts the CLI from scratch.
timeout_seconds = 20.0
# Days to keep the speech_gate_decisions audit rows (0 keeps them forever)
decision_retention_days = 30

# Reactions per kind of acknowledgement (thanks, agreement, funny, celebration,
# default). A missing kind falls back to default, then ack_reaction. A table
# here replaces the shipped lists whole.
[speech_gate.ack_reactions]
thanks = ["👍", "🐙"]
agreement = ["👌"]
funny = ["😄", "🐙"]
celebration = ["🎉"]

[money]
# Let the portfolio module look up a new ticker's metadata from a third-party
# quote API, which sees the symbol. Off uses offline heuristics.
# autoclass_lookup = true

[logging]
# Log level: INFO (default) or DEBUG (verbose)
level = "INFO"
# Output destination: console, file, or both
output = "console"
# Log file path (when output includes "file")
# file = "/var/log/istota/istota.log"
# rotate = true
# max_size_mb = 10
# backup_count = 5

[scheduler]
credential_backup_interval = 86400 # 0 disables scheduled credential backups
# Seconds between checking for new tasks in the queue
poll_interval = 5
# Seconds between pending-task scans within one poll tick, so a new task is
# picked up quickly. 0 or >= poll_interval scans once per tick.
dispatch_interval = 0.5
# Seconds between polling Talk conversations
talk_poll_interval = 10
# Long-poll timeout for Talk API (server-side wait)
talk_poll_timeout = 30
# Max seconds to wait for all rooms before processing available results
# Rooms that respond faster (with new messages) are processed immediately;
# quiet rooms still long-polling are cancelled and re-polled next cycle
talk_poll_wait = 2.0
# Seconds between long-polls of every room. In between, only rooms the room
# list says have a newer message are polled. 0 polls every room every cycle.
talk_poll_full_sweep_interval = 300
# Seconds between polling for new emails
email_poll_interval = 60
# Messages one email poll walks. The rest wait for the next tick and drain in order.
email_poll_batch_size = 50
# Inbound email tasks per user per window. Over-budget mail is filed, not
# dropped, and the user is told once per window. 0 disables.
email_rate_limit_messages = 60          # email tasks per user per window
email_sender_rate_limit_messages = 20   # …and per sender, so one loud correspondent throttles alone
email_rate_limit_window_seconds = 3600
# Untrusted-sender confirmation prompts per user and sender per window before
# they collapse into one summary notice. 0 = never collapse.
email_confirmation_prompts_per_window = 3
# Which worker queue inbound mail lands on. "background" keeps a flood from
# taking the slots a live Talk or web-chat turn needs, at the cost of slower
# mail turnaround; "foreground" restores the previous behaviour.
email_task_queue = "background"
# The body goes into the prompt whole, so one large message is its own
# amplification. Truncated with a marker past this; the full mail stays in the
# mailbox.
email_max_body_chars = 32000
# Attachment bytes saved per message, and per poll below. An attachment that
# would cross the budget is skipped whole. 0 = unlimited.
email_max_attachment_bytes = 26214400
email_max_attachment_bytes_per_poll = 104857600
# Seconds between checking for briefings to run
briefing_check_interval = 60
# Seconds between polling TASKS.md files for new tasks
tasks_file_poll_interval = 30
# Seconds between scheduler_stats log lines (threads, fds, rss, running tasks),
# for catching resource leaks. 0 disables.
scheduler_stats_interval = 60

# Seconds between Nextcloud profile-picture imports (0 disables). Also gated by
# [web] avatar_import_from_nextcloud.
avatar_import_interval = 21600

# Seconds between memory-search reindexes of the per-skill user overlays
# (0 disables).
skill_overlay_reindex_interval = 21600

# Alert an operator once if the main dispatch loop stops ticking for this many
# seconds. 0 disables it.
loop_stall_alert_seconds = 180

# Progress / event streaming.
# Every task produces a typed, persisted event stream (the task_events table)
# consumed by all output surfaces: web chat SSE, Talk, push, log channel, admin.
# When enabled, Talk shows real-time tool progress as Claude works.
progress_updates = true
# Emit tool_start / tool_end events (the Talk ack edit + log channel use these).
progress_show_tool_use = true
# Emit intermediate assistant text events (can be noisy, off by default).
progress_show_text = false
# Write events to the task_events table. Operational kill-switch — when false,
# in-process consumers (Talk/log/push) still work but SSE/admin have nothing to read.
event_log_enabled = true
# Streamed answer text on web chat and the REPL waits until a run passes this
# many characters, so a short lead-in before a tool call is dropped. 0 disables.
stream_text_gate_chars = 280
# A push notification fires only when a task ran longer than this (short tasks
# don't need a ping — the user is likely still watching).
push_notification_threshold_seconds = 30
# Task source_types that send a push notification on completion, e.g.
# ["talk"]. Empty by default.
push_notification_sources = []

# Kill task execution after N minutes (default: 30)
task_timeout_minutes = 30
# Include selected skills in log channel messages (default: true)
log_channel_show_skills = true
# Robustness settings
# Auto-cancel tasks awaiting confirmation after N minutes (default: 120 = 2 hours)
confirmation_timeout_minutes = 120
# Log warnings for tasks pending longer than N minutes (default: 30)
stale_pending_warn_minutes = 30
# Auto-fail tasks pending longer than N hours (default: 24 = 1 day)
stale_pending_fail_hours = 24
# How often a running worker pings liveness, in seconds (default: 60; 0 disables).
# Reclaim uses this heartbeat to tell a slow-but-alive worker from a dead one.
worker_heartbeat_seconds = 60
# Reclaim a worker's task after this many minutes of heartbeat silence
# (default: 10). Independent of task_timeout_minutes.
worker_stuck_minutes = 10
# Delete completed/failed/cancelled tasks older than N days (default: 7)
task_retention_days = 7
# Prune token/cost rows after N days (default: 180, 0 to disable). They
# outlive the tasks they came from.
usage_retention_days = 180
# Delete emails older than N days from IMAP inbox (default: 7, 0 to disable).
email_retention_days = 7
# Prune the processed-email dedup ledger after N days (default: 90, 0 to
# disable). Never below email_retention_days + 1, and off when that is 0.
processed_email_retention_days = 90
# Max cached talk messages per conversation (default: 200)
talk_cache_max_per_conversation = 200

# Deferred subtask creation limits (defense against prompt-injection-driven fan-out).

# Max subtasks created per parent task (default: 10)
max_subtasks_per_task = 10
# Max chain depth — a task at depth N cannot spawn further subtasks when N >= max
# (default: 3, set to 0 to disable). With max=3 a chain like talk → subtask → subtask
# → subtask is allowed but no deeper.
max_subtask_depth = 3
# Skip deferred subtasks whose prompt exceeds this size in chars (default: 8000, 0 = unlimited)
max_subtask_prompt_chars = 8000

# Per-user worker pool settings
# Maximum concurrent foreground (interactive) worker threads
max_foreground_workers = 5
# Maximum concurrent background (scheduled/briefing) worker threads
max_background_workers = 3
# Global per-user worker defaults (individual users can override in their config)
# user_max_foreground_workers = 2
# user_max_background_workers = 1
# Seconds an idle worker lingers, re-checking for new work, before exiting.
worker_idle_timeout = 10
# How often a lingering worker re-checks for a new task, in seconds. 0 or
# >= worker_idle_timeout waits once and re-checks once.
worker_idle_poll_interval = 0.5
# Busy-timeout (ms) for the main loop's read-only scans; a longer lock skips
# the tick. 0 uses SQLite's 30s default.
main_loop_read_timeout_ms = 2000
# Snapshot local DBs (framework + per-user modules) for off-host durability.
# Uses SQLite's online backup API (consistent live copy).
db_backup_enabled = true
db_backup_interval = 86400          # seconds between snapshots (daily)
# db_backup_dir = ""                # empty = {workspace_path}/Backups/db/snapshots
# A destination under workspace_mount_path is skipped while the mount is down.

# Runtime self-check re-run. The auto-update cron changes what is installed
# under a config the daemon already loaded, so a boot-only check is blind to it.
# doctor_check_interval = 3600      # seconds between `istota doctor` re-runs (0 = disabled)

# Host memory sampling: a periodic log line, an admission gate that starts no
# new work below the floor, and snapshots.
# host_pressure_enabled = true                 # master switch for all three
# host_pressure_breadcrumb_interval_seconds = 300  # breadcrumb cadence (0 = disabled)
# host_pressure_sample_interval_seconds = 30   # gate/snapshot sample cadence (0 = disabled)
# min_available_memory_mb = 768                # admission floor in MB (0 = disable this half)
# host_pressure_psi_threshold = 40.0           # `memory some avg10` above this counts as pressure (0 = disable this half)
# host_pressure_alert_cooldown_seconds = 900   # min gap between snapshots + admin notifications
# host_pressure_shmem_unaccounted_alert_mb = 1024  # third snapshot trigger; NOT wired into the gate (0 = disabled)
# host_pressure_docker_socket = "/var/run/docker.sock"  # read-only, resolves a container's pid for a snapshot; "" disables

# Per-task cgroups, so a runaway task is killed inside its own limits. Needs a
# delegated cgroup subtree; without one the daemon logs that it is unprotected.
# task_cgroup_enabled = true        # place each task's tree in its own cgroup
# task_memory_max_mb = 2048         # memory.max per task (0 = unbounded)
# task_pids_max = 512               # pids.max per task — bounds a fork storm
# task_cpu_max_percent = 200        # cpu.max as % of one core (200 = two cores; 0 = unset)

# Background sweeps and retention. Every interval is in seconds; 0 turns it off.
# shared_file_check_interval = 120             # shared-file organization checks
# heartbeat_check_interval = 60                # HEARTBEAT.md checks
# db_health_check_interval = 86400             # SQLite quick_check over per-user DBs
# worktree_reap_interval = 21600               # removes developer worktrees whose work has landed
# sandbox_cache_sweep_interval = 21600         # bounds the per-user package caches
# db_backup_retention = 7                      # newest dated snapshot dirs kept (0 = keep all)
# max_retry_age_minutes = 60                   # don't retry stuck tasks older than this
# temp_file_retention_days = 7                 # delete temp files older than this (0 = never)
# location_ping_retention_days = 365           # delete location pings older than this (0 = never)
# scheduled_job_max_consecutive_failures = 5   # auto-disable a job after this many failures (0 = never)
# cron_max_staleness_minutes = 60              # skip a job whose missed run is older than this after an outage (0 = run them all)

# Long tasks. A foreground task running past the threshold stops counting
# against its user's interactive workers, up to the two caps below.
# long_task_threshold_minutes = 10             # 0 disables
# user_max_long_workers = 1                    # per-user cap on discounted long tasks
# max_long_workers = 2                         # instance-wide cap, inside max_foreground_workers

# ============================================================================
# Default briefings (shared canonical set)
# ============================================================================
# Briefings seeded once into each user with `default_briefings` on (the
# default), shaped like a per-user briefing. Later edits by the user win.
#
# [[default_briefings]]
# name = "Daily"
# cron = "0 7 * * *"
# output = "talk"
#
#   [[default_briefings.blocks]]
#   title = "World News"
#   render_mode = "synthesis"
#
#     [[default_briefings.blocks.sources]]
#     kind = "browse"
#     config = { preset = "ap" }

# ============================================================================
# Shared briefing blocks (module-owned curated content)
# ============================================================================
# Blocks generated once for everyone and read by user briefings through a
# `shared_block` source. Sources may be browse, markets or email. Omit for the
# shipped defaults; an empty list opts out.
#
# [[briefing_shared_blocks]]
# name = "world-headlines"          # → shared_kv key in namespace "briefing_shared_blocks"
# cron = "45 5,17 * * *"            # twice daily, ~15 min before the briefing windows; UTC (global)
# title = "🌍 Headlines"
# directive = "Synthesize the frontpages into ~8 top world stories."
# render_mode = "synthesis"
# enabled = true
#
#   [[briefing_shared_blocks.sources]]
#   kind = "browse"
#   config = { preset = "ap" }
#
#   [[briefing_shared_blocks.sources]]
#   kind = "browse"
#   config = { preset = "reuters" }
#
# A consuming briefing then reads it:
#   [[users.alice.briefings.blocks.sources]]
#   kind = "shared_block"
#   config = { name = "world-headlines", max_age_hours = 12 }

# ============================================================================
# Skills (routing)
# ============================================================================
# Skill routing is single-axis and has no configuration. A skill is either
# eager — selected deterministically (always_include / source_types / file_types
# / sticky / companions), full body in the prompt — or in the on-demand menu, a
# one-line entry the model loads in full via `istota-skill skills show <name>`.
# The menu is the full eligible catalogue minus the eager set, so the model
# self-selects any tool on demand while the prompt stays small. The former
# `[skills]` block (progressive_disclosure / auto_lazy_threshold_chars /
# always_eager) was removed; a stale block is ignored with a load-time warning.

# ============================================================================
# Memory search
# ============================================================================
# BM25 search over conversations and memory files, behind `!search` and the
# memory-recall path. On by default and cheap: the index is SQLite FTS, and
# nothing here needs the `memory-search` extra — that extra buys semantic
# (embedding) search on top, and its absence degrades to BM25 rather than
# switching the block off.
#
# `auto_recall` is the one to think about. Off, memory is recalled when the
# model asks for it; on, the task prompt itself is used as a query and the top
# hits are injected into every task. That costs prompt budget on every task
# including the ones that want no memory at all, which is why it is off.

# [memory_search]
# enabled = true
# auto_index_conversations = true
# auto_index_memory_files = true
# auto_recall = false                  # inject BM25 hits for the task prompt into every task
# auto_recall_limit = 5                # max results when auto_recall is on
# recency_half_life_days = 180.0       # decay applied to recall scores so a dense old
#                                      #   cluster cannot win on mass alone. 0 = no decay

# [playbooks]                          # Learned playbooks (procedural memory) — off by default
# enabled = false                      # master gate
# recall_limit = 3                     # top-K playbooks injected per task
# min_tool_calls = 4                   # a task must use >= this many tools to qualify
# retention_days = 90                  # 0 = keep forever; >0 = age-prune by last-use (recall refreshes it)
# max_chars = 0                        # 0 = share the global max_memory_chars budget

# ============================================================================
# Model alias registry [models.aliases] (operator override) — optional
# ============================================================================
# Shipped defaults:
#   fast    → claude-haiku-5-5    (used by: context triage, skill classification)
#   general → claude-sonnet-5-5   (used by: sleep cycle extraction + USER.md curation)
#   smart   → claude-opus-5-5     (exists for `!model smart` from Talk + any code
#                                  path that wants "the best model")
#   opus / sonnet / haiku         (shortcuts → the current latest of each)
# docs/configuration/reference.md describes both forms below in full.

# Rebind a model alias, or add one for `!model <name>`. A target may carry
# effort as a modifier ("opus:high"). The flat form applies to every brain.
#      [models.aliases]
#      smart = "claude-opus-4-7:high"   # rebind "smart" to Opus 4.7, effort high
#      deep  = "opus:max"               # a custom alias for deep-thinking tasks
#
# Per-namespace form: one value for the CLI brains (anthropic) and one for the
# native endpoint (openai_compat), so a fallback across them stays correct.
#      [models.aliases.smart]
#      anthropic     = "opus:high"                                   # CLI brains (claude_code / tmux_claude)
#      openai_compat = { model = "anthropic/claude-opus-4.8", effort = "high" }  # native
#      [models.aliases.general]
#      anthropic     = "claude-sonnet-5"
#      openai_compat = "anthropic/claude-sonnet-4.6"                 # bare string = no effort
#      [models.aliases.deep]
#      anthropic     = "opus:max"
#      openai_compat = "anthropic/claude-opus-4.8"
#      portable      = true                                          # a cross-brain custom tier
#
# An alias uses one form, not both. The old [models.roles] key is no longer read.

# ============================================================================
# Sleep Cycle (nightly memory extraction)
# ============================================================================
# Extracts long-term memories from completed tasks for each user nightly.
# Cron evaluated in each user's timezone (e.g., "0 2 * * *" = 2am local).
# Memories written to /Users/{user_id}/memories/YYYY-MM-DD.md.

# [sleep_cycle]
# enabled = true                       # enabled by default
# cron = "0 2 * * *"                  # 2am in user's timezone
# extraction_model = "general"         # model that reads the day's conversations and writes memories
# curation_model = "general"           # model that runs the nightly USER.md curation pass
#                                      # Both are role aliases resolving through [models.aliases];
#                                      # a canonical id or an :effort modifier works here too.
# memory_retention_days = 0            # 0 = unlimited; >0 nightly deletes both dated memory FILES and
#                                      # ephemeral memory_chunks (conversation, memory_file, channel_memory)
#                                      # older than N days. Durable user_memory chunks are not swept.
# lookback_hours = 24                  # how far back to look for interactions
# auto_load_dated_days = 3             # auto-load N days of dated memories into prompts (0 = disabled)
# curate_user_memory = false           # nightly USER.md curation (op-based: append/add_heading/remove)
# curation_log_summary = true          # post one-line "USER.md curated: +N appended, ..." to user log_channel
# knowledge_graph_audit_retention_days = 365  # prune knowledge_facts_audit older than N days
#                                              # (independent of memory_retention_days so default
#                                              # deployments still prune; 0 = unlimited)

# ============================================================================
# Channel Sleep Cycle (shared channel memory extraction)
# ============================================================================
# Extracts shared memories from channel conversations nightly.
# Auto-discovers active channels — no explicit channel list needed.
# Cron evaluated in UTC since channels span users in different timezones.

# [channel_sleep_cycle]
# enabled = true                    # enabled by default
# cron = "0 3 * * *"               # 3am UTC (after user sleep cycles at 2am)
# extraction_model = "general"      # model that writes the shared channel memories;
#                                   # a role alias, resolved through [models.aliases]
# lookback_hours = 24               # how far back to look for interactions
# memory_retention_days = 0           # 0 = unlimited; >0 nightly deletes dated channel memory files
#                                     # and channel_memory chunks older than N days

# ============================================================================
# Developer Skill (Git + GitLab/GitHub Workflows)
# ============================================================================
# Enables Claude Code to work in git repositories, create GitLab merge requests,
# and GitHub pull requests. Uses bare clones + git worktrees for branch isolation.
# Recommended: use dedicated bot accounts with minimal required permissions.

# The bot drives the real `gh` and `glab`, not a REST client of our own. Both
# run behind the wrapper in `src/istota/sandbox/forge_cli.py`: it checks the argv
# against a deny policy first, and only then fetches the token and puts it in
# the CLI's own environment — a denied command contacts nothing and fetches no
# credential. With `[security] skill_proxy_enabled` on, the token comes from
# the proxy socket per call; with it off, from the task environment. The token
# needs the scopes those CLIs use, which is more than the old REST allowlist
# needed:
# GitLab `api` + `write_repository`, GitHub `repo` (plus `read:org` for an org
# repo, and `workflow` only if the bot must touch Actions workflow files).
# Reissue a narrower token before enabling this.
#
# One instance per forge. `gitlab_url` and `github_url` are single strings, and
# everything downstream derives from them: the CONNECT allowlist gets one host
# per configured URL, the git credential helpers install under a per-host
# `credential.{host}.helper` key, and the wrapper points `GITLAB_HOST` /
# `GH_HOST` at that one host. A repository on a *second* GitLab or GitHub
# instance is therefore unreachable — the CONNECT proxy refuses it before
# anything authenticates, which is safe but opaque. Adding the second host to
# `[security.network] extra_hosts` buys reachability and no credential, so the
# clone still fails. There is no supported way to configure two of either.
#
# Neither URL may carry userinfo (`https://user:secret@host`): both reach the
# task's sandbox as written, so the config fails to load rather than hand the
# credential to every developer task. The token goes in `gitlab_token` /
# `github_token`.
#
# `git` itself is not wrapped and knows nothing about either forge: public
# reads work against any allowlisted host, authenticated pushes only against
# the two configured ones, and no policy gates git at all. Force-push
# protection belongs to the forge's branch rules, for the same reason
# `pr merge` is left un-denied here.

# [developer]
# enabled = false
# repos_dir = "/srv/repos"                          # base dir for clones + worktrees
#
# # GitLab settings
# gitlab_url = "https://gitlab.com"                 # GitLab instance URL (one instance only — see above)
# gitlab_token = "glpat-xxxxxxxxxxxxxxxxxxxx"        # API token (api + write_repository)
# gitlab_username = "botuser"                        # GitLab username for HTTPS auth
# gitlab_default_namespace = "example"                # default namespace for short repo names
# gitlab_reviewer = "reviewer-user"                  # GitLab username to assign as MR reviewer
# gitlab_reviewer_id = "1234567"                     # that user's numeric id — recorded, read by nothing
#
# # GitHub settings
# github_url = "https://github.com"                 # GitHub instance URL, or GitHub Enterprise (one instance only)
# github_token = "ghp_xxxxxxxxxxxxxxxxxxxx"          # Personal access token (repo scope)
# github_username = ""                               # GitHub username (defaults to x-access-token)
# github_default_owner = "myorg"                     # default org/user for short repo names
# github_reviewer = "reviewer-user"                  # GitHub username to request as PR reviewer
#
# # Extend or puncture the forge CLI deny list, which lives in code. Write an
# # entry as you would type it; one with no binary name applies to both CLIs.
# forge_cli_extra_denied = ["gh pr merge"]           # refuse these too
# forge_cli_permit = ["gh repo delete"]              # turn a baseline guard off
#
# # Where the real binaries live. The Ansible role renders these from what it
# # installed; set them by hand if gh or glab is somewhere else.
# gh_bin_path = "/usr/local/bin/gh"
# glab_bin_path = "/usr/local/bin/glab"
#
# # Author credit appended to every commit message the bot writes. This is the
# # only trailer the `commit` skill permits; nothing else is ever appended.
# author_credit = "Co-Authored-By: Bot <bot@example.invalid>"
#
# # Remove a task worktree once it is clean, unlocked, idle for the retention
# # window and has nothing that is not upstream. `git worktree lock` keeps one.
# worktree_reap_enabled = true
# worktree_retention_hours = 24.0

# ----------------------------------------------------------------------------
# Where project code builds and runs
# ----------------------------------------------------------------------------
# There is no key for this. Builds run in the user's devbox when [devbox]
# enabled, [developer] enabled and repos_dir are all set, and otherwise on the
# host inside the task's sandbox. docs/configuration/reference.md has the rest.

# The devbox credential proxy: one socket per user under this directory, which
# lets the forge CLIs and pushes in a devbox authenticate without holding a token.
# devbox_proxy_enabled = true
# devbox_proxy_socket_dir = "/var/run/istota"
# devbox_proxy_audit_log = ""                       # empty = journal only; a path adds a file

# [developer.container]
# exec_socket_dir = "/run/istota-exec" # the parent; the socket is {dir}/{user}/exec.sock
# connect_timeout_seconds = 5.0        # the client's connect budget
# idle_timeout_seconds = 3600          # server-side backstop reap for an idle connection
#
# # Commands routed into the devbox. `python3` is refused whatever you write;
# # `make` is left out on purpose.
# shim_commands = [
#     "npm", "npx", "pnpm", "yarn", "node",
#     "uv", "uvx", "pip", "pip3",
#     "cargo", "rustc", "rustup",
#     "go", "bundle", "gem",
# ]

# ----------------------------------------------------------------------------
# The devbox container
# ----------------------------------------------------------------------------
# A persistent per-user Linux workbench, one container per user, provisioned by
# Ansible (image, network, volume). Only the bare-metal role builds one — the
# shipped Docker stack ships no devbox service and cannot run the skill; see
# docs/deployment/docker.md.
#
# `enabled` is ONE SWITCH DOING TWO JOBS, deliberately. It offers the devbox
# skill, and it is also what the developer skill derives its execution target
# from — with it on (plus [developer] enabled and a repos_dir) project code
# builds and runs in the user's container instead of on the host. They used to
# be separate keys and the separation only produced states nobody wanted.
#
# What this does NOT bound is what the model may do inside the container: `dev`
# has passwordless sudo there, so a task with access is already root in it. The
# boundary is the container, not anything in this block.

# [devbox]
# enabled = false
# container_prefix = "devbox-"         # container name = f"{prefix}{user_id}"
# max_output_bytes = 102400            # stdout/stderr cap per stream in the JSON envelope
#
# The rest sizes the per-user devbox services `istota devbox compose-file`
# renders for the stack.
# users = []                           # e.g. ["sam"]; one devbox each
# mem_limit = "4g"
# cpus = 2.0
# pids_limit = 512
# log_max_size = "10m"
# log_max_file = 3
# network_subnet = "172.30.0.0/24"     # must match the VM's egress rules
#
# The socket directory is [developer.container] exec_socket_dir above, not a key
# here: one spelling of /run/istota-exec in the tree, read by the skill CLI, the
# sandbox bind and doctor alike.

# ----------------------------------------------------------------------------
# Code review (`istota-skill code_review run`)
# ----------------------------------------------------------------------------
# One reviewer over a branch diff, run daemon-side through the configured
# brain. Gated by `developer.enabled` and an admin check as well as the flag
# below, so there is no separate feature switch. The defaults give a working
# review on any repository you have already enabled [developer] for.
#
# The reviewer reads the code itself with Read, Grep and Glob, over a copy of
# the reviewed commit written out of git into {temp_dir}/.review/ (never the
# worktree, which the model can write). On a sandboxed deployment it runs in a
# namespace that binds that copy read-only and withholds every scope, so the
# user's workspace, memory and repositories are not visible to it; on
# claude_code the CLI is given those three tools and no MCP server. Where the
# copy or the namespace cannot be built, it reviews the diff text-only and the
# envelope says so. The copy is removed after the run and swept after an hour.
#
# Two ceilings sit above `timeout_seconds`, and the lower one bites first. The
# skill proxy kills the command at this skill's own ceiling — 540s, and *not*
# the global `security.skill_proxy_timeout`; override it with a `code_review`
# entry under `[security.skill_proxy_timeouts]`. Below that, the sandboxed model calls
# the CLI through its own Bash tool, whose limit is 120s — so the model must
# invoke the command with an explicit extended timeout, which
# `code_review/skill.md` tells it to do.
#
# A `timeout_seconds` that does not fit under the proxy ceiling is clamped down
# rather than honoured, since the alternative is a review killed half-finished
# having already paid for its model call. The fit reserves 30s: 20 for the diff,
# the snapshot and the prompt, and 10 for a brain that overruns its own timeout.
# The clamp warns into the daemon log and reports itself in the envelope as
# `agent_timeout_clamped`, alongside the `agent_timeout_seconds` the reviewer
# actually got.
#
# `overhead_seconds` in the envelope is what everything outside the model calls
# cost on that run, snapshot included, which is the evidence the 20s reserve is
# sized from.

# [developer.review]
# enabled = true                      # false disables the CLI; the workflow then
#                                     # reports "review unavailable" and lands anyway
# model = "smart:high"                # role alias; a ":effort" modifier is honoured.
#                                     # Was bughunt_model, still read when model is unset
# file_budget = 8                     # files the reviewer may read beyond the changed
#                                     # ones; 0 or less reads as 8
# snapshot_max_bytes = 104857600      # the reviewed commit's tree, written for the
# snapshot_max_file_bytes = 2097152   # reviewer to read: total and per-file caps,
#                                     # changed files first; 0 or less keeps the default
# max_diff_chars = 200000             # the diff in the prompt; the full patch is in
#                                     # the snapshot either way
# timeout_seconds = 480               # the reviewer's budget, a reformat of an unusable
#                                     # answer included. It runs a high-effort model and
#                                     # reads files, and 240 was measured too short on
#                                     # real diffs. --timeout on `run` overrides it for
#                                     # one run
# max_calls_per_task = 8              # review runs per task that reached the model.
#                                     # 0 or less permits none. At the cap the review
#                                     # is skipped rather than failing

# ============================================================================
# Browser container (the `browse` skill)
# ============================================================================
# A Chrome instance in its own container with bot-detection countermeasures,
# talked to over HTTP. Without it the `browse` skill has nowhere to go; the
# rest of the deployment is unaffected. Requires an x86-64 host — Chrome has no
# ARM packages — and Docker, so it is off by default and provisioned by the
# Ansible role or the Docker stack's `browser` compose profile.
#
# `api_url` is read from inside whatever process runs the skill, so on the
# Docker stack it is the service name (`http://istota-browser:9223`) and on
# bare metal a loopback port. Getting it wrong fails at connect with nothing
# to say why, so `istota doctor` checks it.

# [browser]
# enabled = false
# api_url = "http://localhost:9223"
# vnc_url = ""                    # external noVNC URL, if you expose the live view.
#                                 #   The console no longer binds all interfaces;
#                                 #   put it behind the reverse proxy, not on 0.0.0.0.

# ============================================================================
# WordPress skill (docs/features/wordpress.md)
# ============================================================================
# Each site is a vault entry named wordpress_<name> in the user's vault.
# [wordpress]
# private_hosts = []              # exact host names allowed to resolve to a
#                                 #   private or loopback address, e.g. a local
#                                 #   ddev site. Every other site must be public.
# max_upload_mb = 25              # largest file one media upload may send

# ============================================================================
# ntfy Push Notifications
# ============================================================================
# ntfy is a per-user connected service, configured by each user via the web
# settings UI (`/istota/settings`) or `istota secret ensure -s ntfy ...`.
# There is no operator-shared block — each user supplies their own server,
# topic, and (optional) auth.

# ============================================================================
# Money (accounting)
# ============================================================================
# The money skill runs in-process — there is no instance-level [money]
# block. Per-user access is on by default; opt out via the user's
# `disabled_modules` profile field. Ledger files are auto-discovered from
# `{workspace}/money/ledgers/*.beancount`.

# ============================================================================
# Public Hostname
# ============================================================================
# The deployment's public DNS name. Used by the web UI (OAuth2 redirect +
# origin/CSRF checks) and the location webhook URL — set it whenever the web
# or location features are enabled.
#
# The bot's static web root (`enabled` + `base_path`) was removed: a
# publicly-served directory the agent could write to was an outbound egress
# channel with no confirmation gate. Serve static assets outside istota, from
# a directory the agent cannot reach.

# [site]
# hostname = "istota.example.com"

# ============================================================================
# Authenticated web interface (Nextcloud or native email login)
# ============================================================================
# Login-protected web UI backed by Nextcloud's built-in OAuth2 provider
# (no extra NC apps required). Register an OAuth 2.0 client in
# Nextcloud: Settings > Administration > Security > OAuth 2.0 clients,
# redirect URI https://{hostname}/istota/callback. Auth-only flow:
# code exchange → identity check via OCS → token discarded.

# [web]
# enabled = false
# port = 8766
#
# Login methods: "nextcloud", "email", or both. ["none"] turns login off and
# works only with `istota serve` on loopback.
# auth = ["nextcloud"]
# auth_enrol_ttl_hours = 168
# auth_reset_ttl_hours = 1
# auth_step_up_ttl_minutes = 10
# auth_sign_in_code_ttl_minutes = 10  # an emailed code works only in the browser that asked for it
# auth_min_password_length = 12
# auth_throttle_window_seconds = 900
# auth_throttle_max_email = 10
# auth_throttle_max_ip = 30
# auth_mail_link_max_email = 3  # mails per address per hour, reset links and sign-in codes together
# trusted_proxy_hops = 0  # Set only when the backend is restricted to trusted proxies.
# oauth2_provider = "https://cloud.example.com"   # public NC URL the browser hits
# oauth2_client_id = "istota-web"
# oauth2_client_secret = ""                        # or ISTOTA_WEB_OAUTH2_CLIENT_SECRET env var
# session_secret_key = ""                          # or ISTOTA_WEB_SESSION_SECRET_KEY env var
#
# Optional overrides (defaults derive from oauth2_provider):
# oauth2_token_endpoint = ""                       # server-to-server token URL
# oauth2_userinfo_endpoint = ""                    # server-to-server identity URL
# oauth2_redirect_uri = ""                         # explicit override; otherwise derived from request
#
# "ephemeral" discards each user's Nextcloud OAuth token after login;
# "encrypted" keeps it, under ISTOTA_WEB_TOKEN_KEY, for posting to Talk as the
# user and read-state sync.
# token_storage = "ephemeral"                      # "ephemeral" | "encrypted"
#
# Largest profile-picture upload, in KB. 0 switches uploads off; a stored
# picture is still served.
# max_avatar_kb = 4096
#
# Import users' custom Nextcloud profile pictures, on [scheduler]
# avatar_import_interval.
# avatar_import_from_nextcloud = true

# Background tiles for the maps. The default, openfreemap, needs no key;
# carto needs a free API key, osm is light-only, and custom takes your own
# MapLibre style URLs.
# [web.map]
# provider = "openfreemap"                         # openfreemap | carto | osm | custom
# api_key = ""                                     # carto only; public
# dark_style = ""                                  # custom only: MapLibre style URL
# light_style = ""                                 # custom only
# attribution = ""                                 # custom only

# [web.workspace]
# max_upload_mb = 100           # Maximum size of a Workspace upload.

# In-app web chat surface (always-on companion to Talk; reachable from the
# "Chat" tab). All knobs have sensible defaults — this block is only for tuning.
# [web.chat]
# max_prompt_chars = 32000
# max_attachment_mb = 25
# attachment_extensions = ["pdf", "png", "jpg", "jpeg", "heic", "webp", "gif", "txt", "md", "csv", "wav", "mp3", "m4a", "ogg", "webm", "docx", "xlsx"]
# rate_limit_messages = 30                          # per window, per user
# rate_limit_window_seconds = 300
# sse_poll_interval_ms = 200                        # server-side SSE generator cadence
# client_poll_interval_ms = 1500                    # client polling fallback cadence
#
# Live room-event stream: one connection per open tab carries every room.
# room_stream_poll_interval_ms = 1000               # server-side tail cadence
# room_stream_keepalive_seconds = 20                # SSE comment frame, keeps proxies from dropping an idle stream
# room_stream_max_batch = 500                       # rows before a `gap` frame tells the client to reload
# room_stream_max_bytes = 2000000                   # serialized-byte budget, same purpose
# room_stream_room_check_seconds = 10               # per-connection room-metadata diff (0 disables)
# talk_read_sync_interval = 60                      # Talk→web read pull cadence (s); 0 disables; needs token_storage = "encrypted"

# ============================================================================
# Google Workspace Integration
# ============================================================================
# Enables the gws CLI skill with OAuth-based authentication.
# Users connect their Google account through the web UI.
# Requires a Google Cloud project with OAuth 2.0 credentials:
# https://console.cloud.google.com/apis/credentials
# Authorized redirect URI: https://{hostname}/istota/google/callback

# [google_workspace]
# enabled = false
# client_id = ""
# client_secret = ""    # or ISTOTA_GOOGLE_WORKSPACE_CLIENT_SECRET env var
# scopes = [
#     "https://www.googleapis.com/auth/drive.readonly",
#     "https://www.googleapis.com/auth/gmail.readonly",
#     "https://www.googleapis.com/auth/calendar.readonly",
#     "https://www.googleapis.com/auth/spreadsheets.readonly",
#     "https://www.googleapis.com/auth/documents.readonly",
# ]

# Briefings module (per-user content store + archive). All fields defaulted —
# an absent block is the shipped behaviour.
# [briefings]
# archive_retention_days = 90     # prune archived results older than this (0 = keep forever)
# default_lookback_hours = 12     # seeds the email/rss source window when a source omits it
# max_source_chars = 5000         # cap on a single source's gathered text
# max_browse_chars = 20000        # same cap for a browse source, which gathers markdown
                                  # rather than flattened text (the URLs it keeps cost
                                  # characters, and a frontpage opens with masthead chrome)
# newsletter_max_links_per_source = 20  # inline links kept per newsletter body, after
                                  # unsubscribe and social links are dropped. 0 = unlimited
# shared_block_timezone = "UTC"   # timezone shared (global) blocks evaluate their cron in;
                                  # typically the operator's own zone so the morning/evening
                                  # regeneration windows line up with their day

# Location / GPS. `enabled` starts the webhook receiver that Overland (and the
# Garmin ingest) post pings to; without it the Location tab has nothing to
# show, so this is off by default. The receiver is a separate process —
# `istota-webhooks` under systemd, the `location` compose profile on Docker —
# and it needs the public hostname under [site] to build the ingest URL.
#
# The reconcile settings below re-derive closed visits from the raw pings on a
# schedule, which is what turns a noisy GPS trace into places and visits. The
# defaults are tuned and rarely worth changing; the two that are are
# `accuracy_threshold_m` for a phone that reports poor fixes indoors, and
# `visit_exit_minutes` for how long "away" has to last before a visit ends.

# [location]
# enabled = false
# webhooks_port = 8765            # unused: the web app serves the webhook routes
# accuracy_threshold_m = 100.0    # drop pings worse than this from place matching
# visit_exit_minutes = 5.0        # continuous time away before a visit is closed
# reconcile_enabled = true        # periodically re-derive closed visits from pings
# reconcile_lookback_hours = 6.0  # window of pings each reconcile pass considers
# reconcile_buffer_minutes = 10.0 # leave pings newer than this alone (they are still arriving)
# reconcile_grace_minutes = 10.0  # time away before an unassigned ping closes a visit
# reconcile_min_pings = 3         # at-place pings needed to count as a visit
# reconcile_min_dwell_sec = 60    # duration needed to count as a visit

# Health module. Only knob is the per-document size cap for paperwork
# attached to an encounter / condition / immunization (scans, discharge
# summaries, vaccination cards).
# [health]
# max_document_bytes = 26214400   # 25 MiB. 0 = unlimited, for a scanner that
                                  # produces genuinely large files

# User configuration
# Map Nextcloud usernames to their settings
# Only messages from configured users will be processed
# email_addresses maps email addresses to users for email input channel

[users.alice]
display_name = "Alice"
email_addresses = ["alice@example.com", "alice.work@company.com"]
timezone = "America/New_York"  # IANA timezone for briefing scheduling
# alerts_channel = "alertsroom456"  # Talk room for confirmations and security alerts
# trusted_email_senders = ["*@company.com"]  # trusted in both directions: their mail
                               # skips the inbound confirmation gate, and mail to them
                               # is sent without waiting for approval
# outbound_approval = "all"    # this user's outbound approval policy: off |
                               # untrusted | all. Omit to follow the [email] floor.
                               # Read only before the user has a profile row.
# external_turn_display = "full"  # how much of a turn that arrived from outside the
                               # room (an external contact's email) shows inline in
                               # web chat: full | collapsed (default) | hidden. The
                               # turn itself is always shown. Editable by the user
                               # on the web settings page.
# briefing_email_html = false  # briefing email as plain text only. The default (true)
                               # sends HTML with a plain-text part.
# Alice's resources — only `folder` (an out-of-workspace sandbox mount)
# is declarable after the Resources sunset. todo/reminders/notes are
# briefing-source properties (set the source `path`), and calendars are
# CalDAV-discovered.
# [[users.alice.resources]]
# type = "folder"
# path = "/shared/Projects"
# name = "Projects"
# permissions = "write"

# Alice's briefings: a schedule, a delivery target and content blocks. The
# blocks are seeded once; after that the user's own edits win.
[[users.alice.briefings]]
name = "morning"
cron = "0 6 * * *"  # 6am in user's timezone
conversation_token = "room123"  # Talk room to post to
output = "talk,email"  # talk / email / ntfy, or a comma list (default: "talk")

  [[users.alice.briefings.blocks]]
  title = "Today"
  render_mode = "structured"

    [[users.alice.briefings.blocks.sources]]
    kind = "calendar"
    config = {}

    [[users.alice.briefings.blocks.sources]]
    kind = "todos"
    config = {}

  [[users.alice.briefings.blocks]]
  title = "Markets"
  render_mode = "structured"

    [[users.alice.briefings.blocks.sources]]
    kind = "markets"
    config = {}

[[users.alice.briefings]]
name = "world"
cron = "0 7 * * *"
output = "email"

  [[users.alice.briefings.blocks]]
  title = "World News"
  directive = "3–5 stories, neutral tone, no markets."
  render_mode = "synthesis"          # synthesis | structured (omit to infer)
  options = { story_count = 5 }

    [[users.alice.briefings.blocks.sources]]
    kind = "rss"                     # a Feeds subscription or category
    config = { feed_ref = { kind = "category", value = 4 }, lookback_hours = 24, limit = 10 }

    [[users.alice.briefings.blocks.sources]]
    kind = "browse"                  # a bundled preset or arbitrary URL frontpage
    config = { preset = "ap" }

  [[users.alice.briefings.blocks]]
  title = "Markets"
  render_mode = "structured"

    [[users.alice.briefings.blocks.sources]]
    kind = "markets"
    config = {}


[users.bob]
display_name = "Bob"
email_addresses = ["bob@example.com"]
timezone = "America/Los_Angeles"

# Bob has no briefings or sleep cycle configured


