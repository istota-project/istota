---
# Istota deployment defaults

# Namespace - sets all downstream defaults (user, group, paths, services, etc.)
# Override individual variables below to diverge from namespace where needed
istota_namespace: "istota"

# Python package name (module imports). Always "istota" regardless of namespace.
# Env vars use the literal ISTOTA_ prefix, not derived from this.
istota_package: "istota"

# Update mode - skip full installation, just pull code and update config
# Usage: ansible-playbook playbook.yml -e "istota_update_only=true"
istota_update_only: false

# Web-only mode - just pull code, rebuild web UI, restart web service
# Usage: ansible-playbook playbook.yml -e "istota_web_only=true"
istota_web_only: false

# Application paths
istota_home: "/srv/app/{{ istota_namespace }}"
istota_user: "{{ istota_namespace }}"
istota_group: "{{ istota_namespace }}"

# User-facing bot identity name (display only; defaults to namespace capitalized)
istota_bot_name: ""
# Include emissaries.md (constitutional principles) in system prompts
istota_emissaries_enabled: true

# Model selection. Per-task model+effort precedence: !model override (Talk) >
# istota_model/istota_effort > role tier (resolved by the active brain) > brain
# default. See .claude/rules/config.md, docs/configuration/native-brain.md. A
# per-task model pin (from any of the above) also suppresses istota_advisor_model
# for that task — see the comment below.

# Global default model + effort ("" = brain default). Each accepts a canonical
# id, a shortcut (opus/sonnet/haiku), or a role tier (smart/general/fast), plus an
# optional orthogonal :effort modifier (opus:high). istota_effort still works too.
istota_model: ""
istota_effort: ""

# Advisor model ("" = no advisor). Anthropic-namespace brains only
# (claude_code / tmux_claude); the advisor tool has no wire over the native
# brain's openai_compat endpoint. Resolves through the same alias table as
# istota_model but carries no effort. Must resolve to a model capable of
# *being* an advisor (a weak/cheap tier fails every task the advisor would
# run on — the CLI rejects it outright, not a downgrade). A per-task model
# pin (!model, !room model, a [[jobs]] model) drops the advisor for that
# task: the CLI's fatal advisor-gate check is "does the *main* model support
# the advisor tool at all," which is pin-dependent, so turning this on must
# never break a task that was already pinned.
istota_advisor_model: ""

# Model alias registry ([models.aliases]) — one operator-visible table overlaying
# the code-shipped defaults (tiers fast/general/smart + shortcuts opus/sonnet/haiku).
# Aliases are per model namespace so one definition works on every brain:
# `anthropic` = the CLI brains (claude_code / tmux_claude), `openai_compat` = native.
# Each entry is a {model, effort} pair; empty effort ("") means model default.
# openai_compat defaults to istota_brain_native_model. Custom aliases stay a pin
# unless flagged `portable: true`. An entry may also be a bare string (legacy flat,
# namespace-agnostic). Effort is the orthogonal :effort modifier, never a name.
istota_models_aliases:
  fast:
    anthropic:
      model: "claude-haiku-4-5"
      effort: ""
    openai_compat:
      model: "{{ istota_brain_native_model }}"
      effort: "low"
  general:
    anthropic:
      model: "claude-sonnet-5"
      effort: ""
    openai_compat:
      model: "{{ istota_brain_native_model }}"
      effort: "medium"
  smart:
    anthropic:
      model: "claude-opus-5"
      effort: "high"
    openai_compat:
      model: "{{ istota_brain_native_model }}"
      effort: "high"

# Use config/system-prompt.md instead of Claude Code's default system prompt.
# The CLI reads that file from inside the sandbox, so build_bwrap_cmd binds it
# read-only — it needs no entry in istota_security_sandbox_ro_paths below.
istota_custom_system_prompt: true

# Brain — selects the model-invocation backend:
#   "claude_code" (default) wraps the headless `claude -p` CLI subprocess.
#   "native"      runs istota's in-process agent loop against an OpenAI-compatible provider.
#   "tmux_claude" drives the interactive `claude` TUI in a detached tmux session (needs tmux).
# All coexist behind the Brain protocol (src/istota/brain/). Runbook: docs/configuration/native-brain.md.
istota_brain_kind: "claude_code"

# Brain fallback ([brain] fallback_*). When the primary brain is unavailable
# (usage limit, missing binary, tmux launch failure) run the task on the fallback
# brain with its own settings. Portable role tiers cross the provider boundary; a
# provider-specific pin drops to the fallback's default (with a visible note).
# "" = no fallback (tmux_claude still falls back to claude_code). Single level only.
istota_brain_fallback: ""                       # "" | "claude_code" | "native" | "tmux_claude"
istota_brain_fallback_on_transient: true        # also reroute a persistent transient_api_error
istota_brain_fallback_cooldown_seconds: 3600    # skip an unavailable primary this long; 0 disables

# Native brain ([brain.native]). Emitted to config.toml only when native is the
# kind, the fallback, or a source_type_overrides target. Defaults match the code;
# most operators set model + base_url + the API key. Pin istota_brain_native_model
# whenever native is primary OR fallback (an empty model id 400s on failover).
istota_brain_native_provider: "openai_compat"     # only provider currently
istota_brain_native_model: "z-ai/glm-5.2"         # explicit id (no aliasing)
istota_brain_native_effort: "medium"              # low/medium/high/xhigh/max ("" = none); sent only to thinking-capable models
istota_brain_native_base_url: "https://openrouter.ai/api/v1"
istota_brain_native_extra_headers: {}             # extra HTTP headers (openai_compat)
istota_brain_native_context_window: 0             # 0 = resolve from OpenRouter catalog / 200k default; set real window for non-OpenRouter
istota_brain_native_max_turns: 100                # hard cap on assistant turns per task
istota_brain_native_max_tokens: 32000             # per-completion output cap
istota_brain_native_model_catalog_fetch: true     # fetch OpenRouter model list for real window/capabilities/prices (no-op off OpenRouter)
istota_brain_native_model_catalog_cache_ttl_hours: 24  # disk-cache freshness for the fetch above
istota_brain_native_bash_spill_full_output: true  # spill over-cap Bash output to a temp file named in the result
istota_brain_native_turn_budget_nudge: true       # nudge the model to pace itself as it nears max_turns
istota_brain_native_turn_budget_nudge_early_percent: 50   # first (~halfway) reminder fires at this % of the cap
istota_brain_native_turn_budget_nudge_remaining: [15, 5]  # escalating late fires at these absolute steps-remaining
istota_brain_native_prompt_caching: ""            # "" = derive from base_url (ON for api.anthropic.com); set true/false to force

# Native-brain WebFetch tool ([brain.native.web_fetch]). Runs in the daemon
# (host netns), credential-free and SSRF-hardened, not gated by the bwrap CONNECT
# allowlist. Safe defaults; only enabled/allow_http commonly change.
istota_brain_native_web_fetch_enabled: true       # master switch; false omits the tool
istota_brain_native_web_fetch_allow_http: false   # permit cleartext http:// (off = HTTPS only)
istota_brain_native_web_fetch_timeout_seconds: 20 # total wall-clock per fetch
istota_brain_native_web_fetch_max_bytes: 5000000  # response body byte cap (streamed)
istota_brain_native_web_fetch_max_content_chars: 100000  # extracted-text cap returned to the model
istota_brain_native_web_fetch_max_redirects: 5    # redirect hops before giving up
istota_brain_native_web_fetch_require_url_provenance: false  # only fetch URLs seen in the task (sensitive deployments)
istota_brain_native_web_fetch_allow_hosts: []     # if non-empty, a host allowlist (suffix match)
istota_brain_native_web_fetch_block_hosts: []     # always-denied hosts (suffix match)
istota_brain_native_web_fetch_extra_blocked_cidrs: []  # operator additions to the private/reserved IP blocklist

# Per-tier native model overrides live in each tier's openai_compat key in
# istota_models_aliases (above), defaulting to istota_brain_native_model.
# Instance-wide provider API key — never written to config.toml; rendered into
# the EnvironmentFile as ISTOTA_BRAIN_NATIVE_API_KEY. Vault this. Per-user keys
# go through istota_user_secrets (service: native_brain, key: api_key).
istota_brain_native_api_key: ""

# Per-source-type brain routing ([brain.source_type_overrides]). Map a task
# source_type to a brain kind, overriding istota_brain_kind for matching tasks
# (e.g. cron/heartbeat on native while talk/email stays on claude_code). Example:
#   istota_brain_source_type_overrides:
#     scheduled: native
#     heartbeat: native
istota_brain_source_type_overrides: {}

# Tmux-driven interactive-TUI brain ([brain.tmux]). Emitted to config.toml only
# when tmux_claude is the kind, the fallback, or a source_type_overrides target.
# Drives the interactive `claude` TUI in a detached tmux session to keep traffic
# on subscription billing; claude_code stays the automatic fallback. Needs tmux
# on the host. Runbook: .claude/rules/brain.md "TmuxClaudeBrain". All fields
# default in code to the prototype's pinned values; the marker lists are pane-text
# heuristics pinned to a CLI version (override on a CLI reword, no code release).
istota_brain_tmux_fallback_trip_threshold: 5       # launch failures before the circuit opens
istota_brain_tmux_fallback_cooldown_seconds: 300   # seconds the circuit stays open
istota_brain_tmux_ready_timeout_seconds: 30        # REPL-ready deadline
istota_brain_tmux_command_timeout: 10              # per-tmux-subprocess timeout
istota_brain_tmux_cli_version_pin: "2.1.168"       # supported claude CLI version
istota_brain_tmux_ready_markers: []                # [] → code defaults
istota_brain_tmux_trust_markers: []                # [] → code defaults
istota_brain_tmux_theme_markers: []                # [] → code defaults (first-run theme picker)
istota_brain_tmux_error_markers: []                # [] → code defaults
istota_brain_tmux_usage_limit_markers: []          # [] → code defaults (pane substrings → stop_reason=usage_limit → fallback)
istota_brain_tmux_bypass_warning_marker: ""        # "" → code default
istota_brain_tmux_bypass_accept_marker: ""         # "" → code default

# Claude CLI authentication
# Preferred: generate a token locally with `claude setup-token`, store in vault
# Fallback: authenticate manually with `sudo -u <namespace> claude login`
istota_claude_code_oauth_token: ""

# Git repository
istota_repo_url: "https://github.com/istota-project/istota.git"
istota_repo_branch: main
istota_repo_tag: "latest"  # "latest" = highest semver tag, "v0.2.0" = specific tag, "" = use branch
istota_repo_dir: "{{ istota_home }}/istota"

# GitLab access token used to clone the istota repo itself (for private repos).
# Generate at: GitLab > Settings > Access Tokens (read_repository scope).
# NOT the same as istota_developer_gitlab_token — that one feeds the
# developer skill's API access.
istota_repo_clone_token: ""

# Scheduler settings
istota_scheduler_poll_interval: 5
istota_scheduler_dispatch_interval: 0.5       # Sub-tick pending-task dispatch cadence (0 or >= poll_interval = legacy)
istota_scheduler_talk_poll_interval: 10       # Talk conversation polling interval
istota_scheduler_talk_poll_timeout: 30        # Talk long-poll timeout
istota_scheduler_talk_poll_wait: 2.0         # Max seconds to wait before processing fast rooms
istota_scheduler_email_poll_interval: 60
istota_scheduler_email_poll_batch_size: 50
istota_scheduler_email_rate_limit_messages: 60          # Inbound email tasks per user per window (0 = unlimited)
istota_scheduler_email_sender_rate_limit_messages: 20   # …and per sender, under the per-user budget (0 = unlimited)
istota_scheduler_email_rate_limit_window_seconds: 3600
istota_scheduler_email_confirmation_prompts_per_window: 3  # Gate prompts per (user, sender) per window before they collapse (0 = never collapse)
istota_scheduler_email_task_queue: background            # "foreground" puts inbound mail back on the interactive queue
istota_scheduler_email_max_body_chars: 32000
istota_scheduler_email_max_attachment_bytes: 26214400          # 25 MiB per message
istota_scheduler_email_max_attachment_bytes_per_poll: 104857600  # 100 MiB per poll tick
istota_scheduler_briefing_check_interval: 60
istota_scheduler_tasks_file_poll_interval: 30
istota_scheduler_shared_file_check_interval: 120  # Shared file organization check interval
istota_scheduler_heartbeat_check_interval: 60    # Heartbeat monitoring check interval
istota_scheduler_db_health_check_interval: 86400 # SQLite quick_check + REINDEX sweep (default daily)
istota_scheduler_main_loop_read_timeout_ms: 2000 # Busy-timeout for the dispatch loop's read scans; a lock past this skips the tick instead of blocking 30s (0 = 30s default)
istota_scheduler_db_backup_enabled: true         # Snapshot local DBs (framework + modules) to the mount for off-host durability
istota_scheduler_db_backup_interval: 86400       # Seconds between DB backup snapshots (default daily)
istota_scheduler_db_backup_dir: ""               # Snapshot destination; empty = {nextcloud_mount}/istota-db-backups
istota_scheduler_db_backup_retention: 7          # Newest dated snapshot dirs to keep (0 = keep all); dirs holding the newest good copy of a DB are never pruned
istota_scheduler_stats_interval: 60              # scheduler_stats health line interval (0 = disabled)
# Host memory breadcrumb: one host_pressure line per interval carrying
# MemAvailable / Shmem / SwapFree / PSI / per-tmpfs usage / shmem_unaccounted,
# written whether or not the box is under pressure. The 2026-08-20 outage
# accumulated unreclaimable shmem for five days without crossing any threshold,
# so a threshold-gated record could not have caught it. 288 lines/day at 300s.
istota_scheduler_host_pressure_enabled: true     # Master switch for host-pressure sampling
istota_scheduler_host_pressure_breadcrumb_interval: 300  # Breadcrumb cadence in seconds (0 = disabled)

# Memory admission gate + threshold snapshot (Track B alerting, Track C2).
# Below the floor, dispatch spawns no new worker and pending tasks wait for a
# later tick; nothing running is ever stopped, preempted or failed.
istota_scheduler_host_pressure_sample_interval: 30   # Gate/snapshot sample cadence in seconds (0 = disabled)
istota_scheduler_host_pressure_psi_threshold: 40.0   # `memory some avg10` above this counts as pressure
istota_scheduler_host_pressure_alert_cooldown: 900   # Min seconds between snapshots + admin notifications
istota_scheduler_min_available_memory_mb: 768        # Admission floor
# Third snapshot trigger, from the production series rather than from theory.
# A production host took 1.52 GB of shmem in under five minutes with PSI
# peaking at 0.07 and 2.9 GB still available — zram absorbed it, so the two
# thresholds above were right not to fire, but that burst is the one event in
# 24 hours whose attribution anyone would want. Not wired into the gate: a
# residue is a reason to collect evidence, not a reason to refuse work.
# Baseline residue on that host is ~80 MB. 0 disables.
istota_scheduler_host_pressure_shmem_alert_mb: 1024
# Read-only GET handle, used only to ask Docker which pid a container has so
# its tmpfs can be read through /proc/<pid>/root — container mounts are
# invisible in the host mount table. Empty string disables container lookup.
istota_scheduler_host_pressure_docker_socket: /var/run/docker.sock

# ---------------------------------------------------------------------------
# Host memory headroom (host-and-scheduler-robustness spec, Track A)
# ---------------------------------------------------------------------------
# The production host ran with Total swap = 0, and that is what turned a memory
# shortfall into a thrash-to-death. Two things follow from having no swap and
# both bit: anonymous pages can never be evicted, so the page cache absorbs the
# entire shortfall (it was squeezed to 1.5 MB, after which every process
# faulted its own executable text back from disk continuously); and
# tmpfs/shmem pages, which are swap-backed by design, become permanently
# unevictable. Swap makes cold shmem reclaimable *without anyone knowing what
# created it*, which is why this does not wait on attribution.
#
# zram rather than a disk swapfile because the disk was already the saturated
# resource — roughly 1.7 GB/s of forced re-reads. zram compresses cold pages in
# RAM (zstd, around 3:1 on this kind of content) and adds no disk traffic.
#
# Sizing, stated carefully because the spec got it wrong: zram-size sets the
# device's *uncompressed* logical capacity, and compression happens beneath it.
# `ram / 2` on a 7.9 GB box is therefore a ~4 GB swap device that costs ~1.3 GB
# of real RAM at 3:1 — NOT the "~10-12 GB effective" the spec claims, which
# would need `ram * 1.5`. 4 GB is kept deliberately: it comfortably covers the
# 4.6 GB of cold shmem that killed the host, while the worst case (incompressible
# pages) commits only 4 GB of the 7.9. Over-provisioning to 12 GB would make
# that worst case fatal on its own.
#
# Treat this as a mitigation with an expiry date, not a fix: something reaching
# 4.2 GB in five days reaches 8 GB in ten, with or without swap. The Stage 1
# breadcrumb is what names the source.
istota_zram_enabled: true                # Install systemd-zram-generator and enable a zram swap device
istota_zram_size: "ram / 2"              # The device's UNCOMPRESSED capacity, not its RAM cost: ~4 GB of swap for ~1.3 GB of real RAM at 3:1
istota_zram_algorithm: "zstd"            # Compression algorithm
istota_zram_priority: 100                # Swap priority. Linux prefers the HIGHER number, so this must stay above the swapfile

# Setting istota_zram_enabled: false makes every zram task a no-op, so a host
# where the operator arranged swap another way is left exactly as it is. Note
# the asymmetry: false means "this role does not manage swap", NOT "tear down
# the swap this role previously set up". Flipping true -> false on a host that
# already has the device leaves it running; remove it by hand with
# `systemctl disable --now systemd-zram-setup@zram0` and deleting
# /etc/systemd/zram-generator.conf.

# Optional second tier: a disk swapfile at a LOWER priority than zram, for
# pages cold enough that even compression is wasted. Off by default — it is
# listed so the shape is decided here rather than invented ad hoc later, and
# because on this host the disk is the resource to protect. Assumes ext4;
# fallocate-backed swap needs different handling on btrfs.
istota_swapfile_enabled: false           # Second-tier disk swapfile
istota_swapfile_size_mb: 2048            # Its size
istota_swapfile_path: /swapfile          # Where it lives
istota_swapfile_priority: 10             # Below istota_zram_priority, so zram is filled first

# Soft throttling on the istota units. MemoryHigh, NOT MemoryMax: past the
# limit the kernel puts the cgroup under heavy reclaim pressure and slows it,
# where a hard cap would kill it — and killing the daemon takes everything
# down. Nothing in the incident showed istota exceeding a sane budget (its
# whole footprint was around 1.2 GB), so this is a guard against a future
# regression rather than a fix for the observed failure. Empty string omits the
# directive entirely.
istota_scheduler_memory_high: "5G"       # MemoryHigh= on the scheduler unit ("" = no throttle). Covers the daemon PLUS every claude subprocess and its children — see the unit template for the arithmetic; the spec's 3G was sized against the daemon alone
istota_web_memory_high: "1G"             # MemoryHigh= on the web and webhooks units ("" = no throttle)

# Below the systemd default of 100, so every other unit wins under contention.
# A hard CPUQuota is deliberately NOT set: PSI recorded `cpu full avg10=0`
# against `memory full avg10=60`, so the cores were idle-waiting on memory, not
# oversubscribed, and a quota would have slowed the work without preventing the
# outage. CPUWeight is kept because it is free and helps under real contention.
istota_scheduler_cpu_weight: 50          # CPUWeight= on the scheduler unit ("" = systemd default of 100)

# Local-disk root for per-user module DBs (feeds/health/location/money). MUST be
# local disk, NOT the Nextcloud mount (WAL -shm SIGBUSes on FUSE). Only the .db
# relocates here; user-facing module files stay in the workspace on the mount.
istota_module_data_dir: "{{ istota_home }}/data/modules"

# Scheduler progress / event streaming
istota_scheduler_progress_updates: true                # Show real-time progress in Talk during execution
istota_scheduler_progress_show_tool_use: true          # Emit tool_start / tool_end events
istota_scheduler_progress_show_text: false             # Emit intermediate assistant text events (noisy)
istota_scheduler_event_log_enabled: true               # Write events to the task_events table (kill-switch)
istota_scheduler_stream_text_gate_chars: 280           # Narration gate: hold streamed answer text until it crosses N chars w/o a tool call (web/REPL); 0 disables. Watch `stream_gate:` logs to tune
istota_scheduler_push_notification_threshold_seconds: 30  # Min task duration before a push notification fires
istota_scheduler_push_notification_sources: []   # source_types that trigger a completion push; empty = ntfy opt-in only
istota_scheduler_task_timeout_minutes: 60             # Kill task execution after N minutes
istota_scheduler_log_channel_show_skills: true        # Include selected skills in log channel messages

# Scheduler robustness settings
istota_scheduler_confirmation_timeout_minutes: 120  # Auto-cancel pending confirmations
istota_scheduler_stale_pending_warn_minutes: 30     # Log warnings for stale tasks
istota_scheduler_stale_pending_fail_hours: 2        # Auto-fail ancient pending tasks
istota_scheduler_max_retry_age_minutes: 60           # Don't retry stuck tasks older than this
istota_scheduler_worker_heartbeat_seconds: 60        # Running worker pings liveness this often (0 disables)
istota_scheduler_worker_stuck_minutes: 10            # Reclaim a heartbeating worker's task after this much heartbeat silence (higher = fewer false-dead reclaims)
istota_scheduler_task_retention_days: 7             # Delete old completed tasks
istota_scheduler_email_retention_days: 7            # Delete old emails from IMAP (0 to disable)
istota_scheduler_processed_email_retention_days: 90 # Prune the processed_emails dedup ledger (0 to disable; floored at email_retention_days + 1)
istota_scheduler_worker_idle_timeout: 10           # Cumulative-idle seconds a worker lingers (re-checking) before exiting
istota_scheduler_worker_idle_poll_interval: 0.5    # Idle re-check cadence (0 or >= worker_idle_timeout = legacy single wait)
istota_scheduler_max_foreground_workers: 5         # Instance-level foreground (interactive) worker cap
istota_scheduler_max_background_workers: 3         # Instance-level background (scheduled/briefing) worker cap
istota_scheduler_user_max_foreground_workers: 2    # Global per-user fg worker default
istota_scheduler_user_max_background_workers: 1    # Global per-user bg worker default
# Elapsed-time slot reclassification: a running foreground task older than the
# threshold stops counting against its user's interactive cap. Both allowances
# bound discounts, not long tasks. Per-user additive (thread ceiling 2+1=3),
# instance-wide partitioned inside max_foreground_workers, which stays the hard
# ceiling. 0 on either of the first two restores the pre-change behaviour.
istota_scheduler_long_task_threshold_minutes: 10   # A running fg task older than this stops counting as interactive
istota_scheduler_user_max_long_workers: 1          # Per-user discount allowance (additive)
istota_scheduler_max_long_workers: 2               # Instance-wide discount budget (inside max_foreground_workers)
# Per-task cgroups (A6). Each task's process tree gets its own cgroup v2 group
# under the scheduler unit, so a tree that overruns is OOM-killed inside it
# rather than taking the host with it. Depends on Delegate= + DelegateSubgroup=
# on the unit; where those are absent the daemon logs the reason once at
# startup and every task runs exactly as it did before.
istota_scheduler_task_cgroup_enabled: true         # Place each task's tree in its own cgroup
istota_scheduler_task_memory_max_mb: 2048          # memory.max per task (0 = unbounded)
istota_scheduler_task_pids_max: 512                # pids.max per task — bounds a fork storm
istota_scheduler_task_cpu_max_percent: 200         # cpu.max as % of one core (200 = two cores; 0 = unset)
istota_scheduler_scheduled_job_max_consecutive_failures: 5  # Auto-disable after N failures (0=never)
istota_scheduler_cron_max_staleness_minutes: 60             # Skip cron-driven catch-up fires older than this (jobs + briefings); 0 = legacy unconditional catch-up
istota_scheduler_max_subtasks_per_task: 10                  # Cap deferred subtasks created per task
istota_scheduler_max_subtask_depth: 3                       # Max subtask chain depth (0=unlimited)
istota_scheduler_max_subtask_prompt_chars: 8000             # Skip deferred subtasks with prompts over this size (0=unlimited)
istota_scheduler_talk_cache_max_per_conversation: 200      # Max cached talk messages per conversation
istota_scheduler_temp_file_retention_days: 7               # Delete temp files older than N days (0=disable)
istota_scheduler_location_ping_retention_days: 365         # Delete location pings older than N days (0=unlimited)

# Logging settings
istota_logging_level: "INFO"                        # INFO or DEBUG
istota_logging_output: "both"                       # console, file, or both
istota_logging_file: "/var/log/{{ istota_namespace }}/{{ istota_namespace }}.log"
istota_logging_rotate: true                         # Let Python handle rotation (logrotate also configured)
istota_logging_max_size_mb: 10
istota_logging_backup_count: 5

# Host log retention. These bound the two system logs the role does not own but
# does have to live on the same disk as: neither ships with a working cap on
# Debian, and together they had reached 4.3G on a 40G root.
#
# journald's [Journal] section is empty out of the box, which means the cap
# falls back to 10% of the filesystem. The drop-in makes it explicit.
istota_journald_manage: true
istota_journald_max_use: "500M"        # total journal size across all files
istota_journald_max_file_size: "50M"   # per-file cap, so rotation stays granular
#
# auditd ships max_log_file_action = keep_logs, which overrides num_logs and
# never deletes: it rotates forever and every 6MB file stays. ROTATE is what
# turns num_logs into an actual bound. Set istota_auditd_manage to false if the
# host's audit policy is owned by something else.
istota_auditd_manage: true
istota_auditd_num_logs: 5
istota_auditd_max_log_file: 6          # MB per file, so the cap is num_logs * this
istota_auditd_max_log_file_action: "ROTATE"

# The claude CLI self-updates and leaves each previous build behind at ~320MB.
# Nothing reaps them, so the directory grows by a release every day or two.
# Keep at least 2: one live, one to roll back to after a bad release.
istota_claude_versions_keep: 2

# Nextcloud settings (required)
istota_nextcloud_url: ""
istota_nextcloud_username: "{{ istota_namespace }}"
istota_nextcloud_app_password: ""
# Default expiry applied by `nextcloud share link`. 0 = no default expiry.
istota_nextcloud_share_default_expire_days: 14

# Create each user's default Talk rooms (#general / #logs / #alerts) and seed
# the log/alerts channel tokens into their profile, matching what the Docker
# entrypoint does (ISSUE-115). Without this a bare-metal install starts with an
# empty `log_channel`, so the execution log is off and the web "Send execution
# log to" control reads `(off)`.
#
# Idempotent, and it cannot overrule a human. A channel whose column is already
# set (pinned below, or chosen in the web UI) gets no room created for it at
# all, and a token is written only for a room this run itself made usable — so
# clearing "Send execution log to" in the web UI stays cleared across deploys
# rather than being refilled, the way an inventory timezone used to clobber a
# web-set one (ISSUE-102). Re-pointing a channel on purpose is
# `istota nextcloud provision-rooms --user U --reseed`, by hand.
#
# Also gated on istota_talk_enabled and on a non-empty app password. Set to
# false to manage the rooms yourself.
istota_provision_talk_rooms: true

# Talk settings (polling-based, no webhook needed)
istota_talk_enabled: true
istota_talk_bot_username: "{{ istota_namespace }}"  # Nextcloud username (to filter own messages)

# Email settings (optional)
istota_email_enabled: false
istota_email_imap_host: ""
istota_email_imap_port: 993
istota_email_imap_user: ""
istota_email_imap_password: ""
istota_email_smtp_host: ""
istota_email_smtp_port: 587
istota_email_poll_folder: "INBOX"
istota_email_bot_address: ""
istota_email_imap_timeout_seconds: 30  # socket timeout for IMAP connections
# What an own-address claim buys. Three states, weakest first:
#
#   "off"     the claim is proof. Sound only because something upstream —
#             normally DMARC enforcement at the receiving MTA — rejects a forged
#             From: before it reaches poll_folder. The default, and what every
#             deployment ran before "verify" existed.
#   "verify"  the claim is proof when the receiving MTA's stamp says so. Needs
#             istota_email_authserv_id; the daemon refuses to load without it.
#   "gate"    the claim is never proof. Every self-sent email is held for a
#             yes/no. Noisy by construction — nothing in a plain SMTP message
#             separates the user from someone claiming to be them, which is
#             what "verify" fixes.
#
# The legacy booleans still work: false is "off", true is "gate". Quote the
# value — off, on, yes and no are YAML booleans.
istota_email_confirm_sender_match: "off"
# Canary for the assumption the setting above encodes. Reads the DMARC verdict
# the receiving MTA stamped and warns when mail routed on a user's own address
# arrives without a pass, so the protection lapsing gets noticed. On by default;
# monitoring only, it never blocks a message. Set warn_on_missing once you know
# your MTA stamps Authentication-Results — that is what catches a move to a
# provider that does not evaluate DMARC.
istota_email_dmarc_canary: true
istota_email_dmarc_canary_warn_on_missing: false
# Your receiving MTA's authserv-id — the first field of the
# Authentication-Results header it stamps. Blank reads the topmost header and
# trusts that "topmost" means "ours", which stops holding the moment the MTA
# stops stamping: the sender's own header is then the top one. Set it and any
# header from another authserv-id is discarded. Setting it also says your MTA
# stamps, so mail arriving without your stamp warns on its own.
istota_email_authserv_id: ""
# The weakest outbound approval policy any user on this instance may run. An
# outgoing email whose recipients are not explicitly authorized is held as an
# editable draft instead of being sent; the user approves, edits or discards it
# from web chat or with `!drafts`. One of:
#   off        no holds — every send goes out immediately (pre-feature behaviour)
#   untrusted  hold unless EVERY recipient (To, Cc, Bcc) is trusted: one of the
#              user's own addresses, a `trusted_email_senders` pattern, or an
#              address trusted at runtime via `!trust` / "yes trust"
#   all        hold unless every recipient is one of the user's own addresses
# A floor, not a default: a user may tighten past it but never loosen below it,
# and a user who never set their own follows this value. An invalid value FAILS
# the config load rather than falling back — there is no safe value to guess.
# Note `trusted_email_senders` now authorizes both directions (inbound gate
# skip + outbound send without approval), so a catch-all pattern there turns
# `untrusted` off entirely.
# QUOTE THE VALUE. `off` unquoted is a YAML boolean, and would render
# `outbound_approval_floor = "False"` into config.toml, which the daemon
# refuses to load. The play asserts this before templating.
istota_email_outbound_approval_floor: "untrusted"

# Conversation context settings
istota_conversation_enabled: true               # false = no conversation context at all
istota_conversation_lookback_count: 25           # max messages to fetch from DB/cache
istota_conversation_selection_model: "fast"      # role alias (resolves to Haiku by default); operator-overridable via istota_models_aliases
istota_conversation_selection_timeout: 30.0      # timeout for triage model call
istota_conversation_skip_selection_threshold: 3  # skip triage if history <= this count
istota_conversation_use_selection: true           # false = include all fetched messages, no LLM triage
istota_conversation_always_include_recent: 10    # guaranteed recent messages before triage (only when use_selection=true)
istota_conversation_context_truncation: 0        # max chars per bot response in context (0 = unlimited)
istota_conversation_context_recency_hours: 0     # only include older messages within this time window (0 = disabled)
istota_conversation_context_min_messages: 10     # always include at least this many recent messages regardless of age
istota_conversation_previous_tasks_count: 3      # inject N recent scheduled/briefing tasks into context
istota_conversation_talk_context_limit: 100      # max messages to fetch from Talk message cache

# Admin users - users with full system access (DB, all mount paths, admin-only skills)
# Asymmetric semantics when this list is empty:
#   - Sandbox / skills / commands (Config.is_admin): all users are admin (legacy back-compat)
#   - Web admin dashboard (_user_is_web_admin): no users are admin (fails closed)
# To grant web admin access, list at least one user_id.
# Deployed as /etc/<namespace>/admins (root-owned, not editable by service user or Claude)
istota_admin_users: []

# Instance-wide disabled skills — skill names excluded from prompt selection.
# Orthogonal to feature flags (browser_enabled, developer_enabled): a flag
# deploys the backend, disabled_skills keeps the skill doc out of prompts.
# Example: ["browse", "whisper"]
istota_disabled_skills: []

# Experimental feature flags — operator opt-in for rough features that
# ship in the tree but are off by default. Not exposed in the web UI,
# not toggleable per user. Run `uv run istota experimental list` on the
# host to see the current registry. See docs/EXPERIMENTAL.md.
# Example: ["money_tax", "money_wash_sales"]
istota_experimental_features: []

# Users configuration (dict of user_id -> user config). The data model is split:
#   * Profile fields   → user_profiles table (`istota user ensure`)
#   * Folder mounts    → user_resources table (`istota resource ensure`)
#   * Briefings        → briefing_configs table (`istota briefings schedule ensure`)
#   * Tier-2 creds     → encrypted secrets table (`istota secret ensure`, see istota_user_secrets)
#   * Module opt-outs  → `disabled_modules:` list
# `folder` is the only declarable resource type (an out-of-workspace sandbox mount).
#
# Example:
# istota_users:
#   alice:
#     display_name: "Alice"
#     email_addresses:
#       - "alice@example.com"
#     # timezone is NOT set here — it's a user preference owned by the web UI /
#     # Nextcloud (seeded on first login). Setting it in inventory would clobber
#     # the user's web-set value on every deploy (ISSUE-102).
#     log_channel: ""               # Legacy Talk-room shorthand for the verbose
#                                   # execution log. For non-Talk destinations
#                                   # (email / ntfy / comma lists) set routing.log
#                                   # below instead — it wins over this field.
#                                   # Leave empty to let istota_provision_talk_rooms
#                                   # create #logs and fill this in; a value set
#                                   # here is never overwritten by provisioning.
#     alerts_channel: ""            # Talk room token for confirmations and security alerts
#                                   # Same: empty means auto-provision #alerts.
#     trusted_email_senders:        # patterns for trusted email senders (plus-address gate)
#       - "*@example.com"           # domain wildcard
#       - "bob@other.com"           # exact match
#     quiet_email_senders:          # patterns whose mail is filed silently — no task, no session
#       - "*@stratechery.com"       # read back on demand via `email from-senders`
#     max_foreground_workers: 2    # per-user override (0 or omit = use global default)
#     max_background_workers: 1    # per-user override (0 or omit = use global default)
#     disabled_skills: []          # per-user skill exclusion list
#     disabled_modules: []         # per-user module opt-outs; one of: feeds, money, location
#     # Purpose-keyed delivery routing (routes notifications by purpose). Each
#     # purpose maps to an output_target descriptor (talk / email / ntfy /
#     # all / talk:<room> / comma lists). Purposes: reply, alert, log, briefing,
#     # notification. When `routing:` is set, the listed purposes REPLACE the
#     # stored table on each deploy; omit `routing:` entirely to leave a web-set
#     # table untouched (same non-clobber rule as timezone, ISSUE-102).
#     routing:
#       alert: "ntfy"               # send alerts to the user's ntfy instead of Talk
#       log: "talk:room123"         # verbose execution log → any user-routable
#                                   # surface (talk / email / ntfy / comma list).
#                                   # Off unless set here or via log_channel above;
#                                   # Talk streams live, email/ntfy get one summary.
#     default_destination: "talk"   # fallback descriptor when no purpose matches;
#                                   # omit to leave the stored value (default "talk")
#     email_reply_routing: "origin+thread"  # where a reply to a sent email goes:
#                                   # origin+thread (default) | origin | thread
#     outbound_approval: "all"      # this user's own outbound approval policy:
#                                   # off | untrusted | all — QUOTED, since off
#                                   # is a YAML boolean. Omit to follow
#                                   # istota_email_outbound_approval_floor above;
#                                   # "" clears a previously set value back to
#                                   # following it, and a bare key with no value
#                                   # is treated as omitted rather than as "".
#                                   # The floor is a minimum, so a value weaker
#                                   # than it has no effect.
#     external_turn_display: "collapsed"  # how much of a turn that arrived from
#                                   # outside the room (an external contact's
#                                   # email) shows inline in web chat:
#                                   # full | collapsed (default) | hidden. The
#                                   # turn itself is always shown. A user
#                                   # preference — set it in the web UI unless
#                                   # you mean to hold every deploy to it.
#     resources:
#       # Only `folder` is declarable after the Resources sunset — an
#       # out-of-workspace path mounted into the sandbox. In-workspace paths
#       # are already covered by the wholesale user-dir bind.
#       - type: "folder"
#         path: "/shared/Projects"
#         name: "Projects"
#         permissions: "write"
#     # Opt this user out of the shared [[default_briefings]] set (default on).
#     default_briefings: false
#     # Briefing email as multipart/alternative — HTML (clickable article links)
#     # plus a plain-text fallback part. Default on; false = plain text only.
#     briefing_email_html: false
#     # Set this user's timezone from their GPS position once they have settled
#     # in a new one (default off). Needs the location module; the user is
#     # notified on every change.
#     timezone_follow_location: true
#     briefings:
#       # Content is blocks-only (legacy `components:` authoring is retired).
#       # A briefing declaring `blocks:` seeds them ONCE into the user's module
#       # DB as an editable baseline; the user then edits them in the web editor
#       # and operator re-runs never re-clobber. Schedule/delivery come from
#       # name/cron/output via the CLI/DB path. Source `kind` is one of
#       # rss / email / browse / markets / calendar / todos / reminders / notes;
#       # `render_mode` is synthesis | structured (omit to infer). Loop over
#       # `istota_users` in the playbook to apply one definition to many users.
#       - name: "world"
#         cron: "0 7 * * *"
#         conversation_token: "room123"
#         output: "talk,email"   # talk / email / ntfy, or a comma list
#         blocks:
#           - title: "World News"
#             directive: "3-5 stories, neutral tone, no markets."
#             render_mode: "synthesis"
#             options: { story_count: 5 }
#             sources:
#               - kind: "rss"
#                 config: { feed_ref: { kind: "category", value: 4 }, lookback_hours: 24 }
#               - kind: "browse"
#                 config: { preset: "ap" }
#           - title: "Markets"
#             render_mode: "structured"
#             sources:
#               - kind: "markets"
#                 config: {}
istota_users: {}

# Per-user encrypted secrets (Karakeep, Monarch, Tumblr API key, Overland
# ingest token, ...). Each row is upserted via `istota secret ensure` and
# stored in the encrypted `secrets` table — never in plaintext on disk.
# `istota_secret_key` (above) must be set; the role exports it through the
# secrets.env file consumed by the systemd units.
#
# Schema is validated server-side; a typo in `service` or `key` fails the
# play. Known services / keys (as of the current refactor):
#
#   karakeep         base_url, api_key
#   monarch          email, password, session_token
#   feeds            tumblr_api_key
#   overland         ingest_token
#   google_workspace (OAuth-only, not provisionable from Ansible)
#
# Example:
# istota_user_secrets:
#   alice:
#     - { service: karakeep, key: base_url,     value: "https://kk.example.com" }
#     - { service: karakeep, key: api_key,      value: "{{ vault_alice_kk_token }}" }
#     - { service: monarch,  key: email,        value: "alice@example.com" }
#     - { service: monarch,  key: password,     value: "{{ vault_alice_monarch_password }}" }
#     - { service: overland, key: ingest_token, value: "{{ vault_alice_overland_token }}" }
#     - { service: feeds,    key: tumblr_api_key, value: "{{ vault_alice_tumblr_api_key }}" }
istota_user_secrets: {}

# Canonical shared briefing set, seeded once into each opted-in user (per-user
# `default_briefings: true`, the default). Rendered into [[default_briefings]];
# blocks-only, same name/cron/output/blocks shape as a per-user briefing. Users'
# later web edits win and re-runs never clobber them.
#
# The default set is a weekday morning + evening briefing. Headlines and Markets
# read the module-owned shared blocks (world-headlines / markets-summary, see
# istota_briefing_shared_blocks) via `shared_block` sources, so the browse/markets
# fetch + synthesis happens once globally per window rather than per user. A
# `shared_block` block is `structured` (spliced verbatim); `max_age_hours` gates
# freshness so a stale block never leaks across windows. Headlines (needs the
# headless browser) and Calendar (needs CalDAV) soft-degrade to omitted when
# unavailable. Set to [] to seed nothing.
istota_default_briefings:
  - name: "morning"
    # Display title — the email subject and the archive entry. The run date is
    # appended automatically ("Morning Briefing — Monday, 27 July"). Omit to
    # derive it from `name`.
    title: "Morning Briefing"
    cron: "0 6 * * 1-5"
    output: "email"
    blocks:
      - title: "🌍 Headlines"
        render_mode: "structured"
        sources:
          - kind: "shared_block"
            config: { name: "world-headlines", max_age_hours: 6 }
      - title: "📈 Markets"
        render_mode: "structured"
        sources:
          - kind: "shared_block"
            config: { name: "markets-summary", max_age_hours: 6 }
      - title: "📅 Calendar"
        render_mode: "structured"
        sources:
          - kind: "calendar"
            config: {}
  - name: "evening"
    title: "Evening Briefing"
    cron: "0 18 * * 1-5"
    output: "email"
    blocks:
      - title: "🌍 Headlines"
        render_mode: "structured"
        sources:
          - kind: "shared_block"
            config: { name: "world-headlines", max_age_hours: 6 }
      - title: "📈 Markets"
        render_mode: "structured"
        sources:
          - kind: "shared_block"
            config: { name: "markets-summary", max_age_hours: 6 }
      - title: "📅 Calendar"
        render_mode: "structured"
        sources:
          - kind: "calendar"
            config: {}

# Module-owned shared briefing blocks (shared-kv-curated-content). Generated
# globally by the scheduler (no user, UTC cron) into the shared_kv store; per-user
# briefings read them via a `shared_block` source, collapsing the N-way fetch +
# synthesis to one generation. Mirrors DEFAULT_SHARED_BLOCKS in config.py; [] to
# disable. Allowed source kinds are user-agnostic: browse / markets / email.
# Crons fire twice daily ~15 min before the default briefing windows (06:00 /
# 18:00); consuming sources gate on max_age_hours (6h) so each window reads its
# own fresh copy. Crons are UTC while briefing crons are per-user TZ — align these
# to your users' timezone if your windows differ.
istota_briefing_shared_blocks:
  - name: "world-headlines"
    cron: "45 5,17 * * *"
    title: "🌍 Headlines"
    directive: "Synthesize the frontpages into ~8 top world stories, lead with what's new. Neutral wire-service tone."
    render_mode: "synthesis"
    enabled: true
    sources:
      - kind: "browse"
        config: { preset: "ap" }
      - kind: "browse"
        config: { preset: "reuters" }
  - name: "markets-summary"
    cron: "50 5,17 * * *"
    title: "📈 Markets"
    # Structured/verbatim: the markets source already emits a formatted quote
    # table — stored as-is with zero LLM passes (no directive). Trusted (pure
    # numbers, no injection surface) so it renders un-wrapped.
    render_mode: "structured"
    enabled: true
    trusted: true
    sources:
      - kind: "markets"
        config: {}

# Timezone shared briefing block crons evaluate in (single operator-chosen zone,
# since blocks are generated globally). Set to the operator's local zone so the
# regeneration windows line up. Maps to [briefings] shared_block_timezone.
istota_briefing_shared_tz: "UTC"

# Inline [anchor](url) links preserved per newsletter body in a briefing source.
# Newsletters are link soup, so the converter filters unsubscribe / social /
# web-version chrome and this caps what survives; an over-cap anchor keeps its
# text and loses only the destination. 0 = unlimited. Maps to [briefings]
# newsletter_max_links_per_source.
istota_briefing_newsletter_max_links: 20

# Cap on a single health document (a scan, discharge summary, vaccination
# card) attached to an encounter / condition / immunization. 0 = unlimited,
# for a user whose scanner produces genuinely large files. Maps to
# [health] max_document_bytes.
istota_health_max_document_bytes: 26214400 # 25 MiB

# Whether the portfolio module may look up ticker metadata from a third-party
# quote API when classifying newly imported symbols. The request carries the
# symbol (private financial data) and runs outside the sandbox's CONNECT
# allowlist. Off falls back to offline description heuristics, which need no
# network. Maps to [money] autoclass_lookup.
istota_money_autoclass_lookup: true

# rclone remote name for Nextcloud
istota_rclone_remote: "nextcloud"

# rclone password (must be pre-obscured with: rclone obscure <password>)
# Generate with: rclone obscure "your-app-password"
istota_rclone_password_obscured: ""

# Nextcloud mount (alternative to rclone CLI)
# When enabled, Nextcloud is mounted at istota_nextcloud_mount_path and istota uses
# direct filesystem access instead of rclone subprocess calls
istota_use_nextcloud_mount: true
istota_nextcloud_mount_path: "/srv/mount/nextcloud/content"

# Money integration is in-process (no separate service). Per-user Monarch
# credentials live in the encrypted secrets table (see istota_user_secrets).
# Workspace layout is auto-derived (data_dir = {workspace}/money, ledgers at
# {data_dir}/ledgers/main.beancount).

# Browser container settings (for web browsing skill)
istota_browser_enabled: false
istota_browser_api_port: 9223
istota_browser_vnc_port: 6080
istota_browser_vnc_password: ""
istota_browser_vnc_external_url: ""  # e.g. https://vnc.example.com:6080
istota_browser_max_sessions: 3
istota_browser_shm_size: "2gb"
istota_browser_cpu_limit: "{{ ansible_facts['processor_vcpus'] }}"
istota_browser_memory_limit: "3G"

# Browser auto-heal watchdog. A cron.d job restarts the container after
# `debounce` consecutive unhealthy reads, and stops flapping (paging once) after
# `crashloop_max` restarts within `crashloop_window` seconds. A second cron line
# does the daily restart and clears crash-loop state. Debounce counts reads, not
# seconds, so it's independent of the cron cadence.
istota_browser_watchdog_cron: "* * * * *"     # cron schedule for the health check (1-min floor)
istota_browser_watchdog_debounce: 2           # consecutive unhealthy reads before restart
istota_browser_watchdog_crashloop_max: 5      # restarts allowed within the window
istota_browser_watchdog_crashloop_window: 1800  # crash-loop window, seconds (30 min)
istota_browser_watchdog_state_dir: "/var/lib/{{ istota_namespace }}/browser-watchdog"
istota_browser_watchdog_ntfy_url: ""          # optional: full ntfy topic URL for restart/crash-loop alerts
istota_browser_watchdog_alert_email: ""       # optional: email address (requires `mail`) for alerts
istota_browser_daily_restart_cron: "0 5 * * *"  # cron schedule for the proactive daily restart

# Devbox container (per-user persistent dev / network-diagnostics environment).
# When enabled, one container per entry in istota_devbox_users is brought up
# via docker-compose. The skill CLI shells in over the host docker socket; the
# bwrap sandbox in executor.py bind-mounts the socket only when the [devbox]
# block is rendered into config.toml.
istota_devbox_enabled: false
istota_devbox_image: "istota-devbox:latest"
istota_devbox_container_prefix: "devbox-"
istota_devbox_docker_cli: "/usr/bin/docker"
istota_devbox_docker_socket: "/var/run/docker.sock"
istota_devbox_exec_timeout_seconds: 300
istota_devbox_max_output_bytes: 102400
istota_devbox_mem_limit: "2g"
istota_devbox_cpus: 2
istota_devbox_pids_limit: 512
istota_devbox_workspace_tmpfs_size: "1g"
istota_devbox_network_name: "{{ istota_namespace }}-devbox-net"
istota_devbox_network_subnet: "172.30.0.0/24"
# Cloud metadata endpoint blocked by default — link-local + DigitalOcean/GCP/
# AWS/Azure all rendezvous at 169.254.169.254.
istota_devbox_block_metadata: true
# RFC1918 blocking: drops outbound traffic from the devbox network targeting
# private ranges so a compromised devbox can't pivot to the host's LAN.
# Disable when you want the devbox to reach a colocated service intentionally.
istota_devbox_block_rfc1918: true
# Users whose containers should be created. Each entry is a user_id; the
# container is named "{{ istota_devbox_container_prefix }}{{ user_id }}".
istota_devbox_users: []

# Devbox credential proxy. One systemd unit per devbox user listens on a per-user
# Unix socket, bind-mounted into the container at /run/istota-cred. It answers two
# things: a git credential for git-credential-istota, injected server-side, and the
# forge token for the container's gh/glab wrapper, which needs it in the real CLI's
# own environment. The per-user forge URL rides along with that token, since one
# image serves every user and cannot bake one in. Defaults on when devbox is on.
istota_devbox_proxy_enabled: true
istota_devbox_proxy_socket_dir: "/var/run/{{ istota_namespace }}"
# Empty string → audit lines go to the journal only. Set to an absolute
# path to also tail audit lines into a file.
istota_devbox_proxy_audit_log: ""

# Docker-API allowlist proxy. One systemd unit per devbox user forwards only
# exec/cp/inspect/restart on the user's own container, refusing
# create/run/build/privileged/host-mount. The executor binds this socket into the
# sandbox at /var/run/docker.sock instead of the raw socket. Defaults on when
# devbox is on. Maps to [devbox] api_proxy_* in config.toml.
istota_devbox_api_proxy_enabled: true
istota_docker_proxy_socket_dir: "/var/run/{{ istota_namespace }}-docker"
istota_devbox_api_proxy_exec_ttl_seconds: 300
# Empty string → audit lines go to the journal only. Absolute path → also a file.
istota_devbox_api_proxy_audit_log: ""

# ntfy push notifications are configured per-user via the encrypted secrets
# table (`istota secret ensure -s ntfy ...` or web settings). There is no
# operator-shared ntfy config — each user supplies their own server/topic/auth.

# Location tracking (Overland GPS receiver)
istota_location_enabled: false
istota_webhooks_port: 8765
istota_location_accuracy_threshold_m: 100.0
istota_location_visit_exit_minutes: 5.0
istota_location_reconcile_enabled: true
istota_location_reconcile_lookback_hours: 6.0
istota_location_reconcile_buffer_minutes: 10.0
istota_location_reconcile_grace_minutes: 10.0
istota_location_reconcile_min_pings: 3
istota_location_reconcile_min_dwell_sec: 60

# Authenticated web interface (Nextcloud built-in OAuth2). Set up the client in
# NC Settings → Security → OAuth 2.0 clients, then put the client_id/secret below
# (vault the secret). Redirect URI must match istota_web_oauth2_redirect_uri or
# the derived default https://{istota_hostname}/istota/callback.
istota_web_enabled: true
istota_web_port: 8766

# Restart behaviour. The room-event SSE stream never completes on its own, so
# uvicorn's default "wait forever for open connections" turned every restart
# with a browser tab open into a 90s SIGKILL. The graceful window is how long
# uvicorn drains before cancelling stragglers; the stop timeout is the systemd
# cap behind it (a SIGKILL at that point means wedged, not draining).
istota_web_graceful_shutdown_seconds: 5
istota_web_stop_timeout_seconds: 20

istota_web_oauth2_provider: ""           # Public NC URL (what the browser hits), no trailing slash
istota_web_oauth2_client_id: ""
istota_web_oauth2_client_secret: ""
istota_web_oauth2_token_endpoint: ""     # Optional override; defaults derive from oauth2_provider
istota_web_oauth2_userinfo_endpoint: ""  # Optional override
istota_web_oauth2_redirect_uri: ""       # Optional override; defaults to https://{site_hostname}/istota/callback
istota_web_secret_key: ""                # Session signing key (vault); generate with `python3 -c 'import secrets;print(secrets.token_hex(32))'`

# User-scoped Nextcloud OAuth token retention (post-as-user Talk mirroring +
# read-state sync). "ephemeral" (default) discards the OAuth pair at login;
# "encrypted" retains it in web_user_tokens, encrypted with the web-only key
# below. NC OAuth2 tokens grant full account access — a deliberate opt-in.
istota_web_token_storage: "ephemeral"
# Web-only Fernet key (vault); >=32 chars. Rendered into web-secrets.env and
# loaded only by the web unit, never the scheduler or webhooks units.
istota_web_token_key: ""
# Talk→web read-state pull cadence in seconds (0 disables the pull;
# web→Talk push is unaffected). Only active with token storage "encrypted".
istota_web_chat_talk_read_sync_interval: 60
# Live room-event stream (GET /chat/stream): one user-scoped SSE connection per
# open tab carrying every room the user is a member of. Server-side poll cadence
# in ms — deliberately slower than the task stream's 200ms, since these are
# message-level events.
istota_web_chat_room_stream_poll_interval_ms: 1000
# SSE comment-frame cadence, seconds. The vhost allows 3600s reads, but a
# corporate proxy or mobile network drops a silent connection far sooner.
istota_web_chat_room_stream_keepalive_seconds: 20
# Resource guard for a far-behind cursor (a tab resumed from suspend). Tripping
# either cap emits a `gap` frame and the client reloads instead of replaying.
istota_web_chat_room_stream_max_batch: 500
istota_web_chat_room_stream_max_bytes: 2000000
# Per-connection room-metadata diff cadence (rename / model / effort / room
# added or removed elsewhere), seconds. 0 disables it.
istota_web_chat_room_stream_room_check_seconds: 10
# Largest chat attachment, in MB. One number for two consumers: the app rejects
# a larger upload with a 413 the client can read, and the vhost sets
# client_max_body_size from it. Left to drift, the smaller of the two wins and
# nginx answers with its own HTML error page instead — which the web client
# cannot parse, so the user gets "upload failed (413)" and no reason. nginx's
# own default is 1m, so this must be rendered rather than omitted.
#
# Higher than the application default of 25, which is what a base64 round trip
# through the WebView could survive. The iOS shell posts a picked file straight
# from disk (IstotaUploader, 0.5.0), and reads it in windows where it cannot, so
# nothing on either side scales with the file any more. What is left is upload
# time on a phone connection, which is why this is not simply unlimited.
istota_web_chat_max_attachment_mb: 100

# Master key for the encrypted `secrets` table, rendered into secrets.env as
# ISTOTA_SECRET_KEY. Generate with `python3 -c "import secrets; print(secrets.token_hex(32))"`
# and vault it. Empty disables the secrets store (tier-2 creds fall back to TOML extras).
istota_secret_key: ""

# Google Workspace CLI integration (OAuth-based)
istota_google_workspace_enabled: false
istota_google_workspace_client_id: ""
istota_google_workspace_client_secret: ""
# This list is a CEILING, not a request: each user picks their own subset of it
# at Settings -> Google Workspace, and the connect redirect asks Google only for
# what that user chose. So it is the maximum any user may grant, and there is no
# cost to listing a service here that most users leave switched off.
#
# It is a maximum rather than advice because the OAuth client belongs to a
# Google Cloud project whose enabled APIs you control: a scope for an API the
# project has not enabled fails at Google's end with an error the user can do
# nothing about. List a service only once its API is enabled in the project.
#
# Read-only by default. To offer read/write, swap the .readonly variant for its
# full counterpart — the pair per service is:
#   drive.readonly        -> drive
#   gmail.readonly        -> gmail.modify
#   calendar.readonly     -> calendar
#   spreadsheets.readonly -> spreadsheets
#   documents.readonly    -> documents
#   chat.spaces.readonly + chat.messages.readonly -> chat.spaces + chat.messages
# Listing the full scope does not force it on anyone: it adds a "Read and write"
# option to that service's picker. Chat is offered by no default scope, so the
# skill's documented `chat spaces` verbs need it added here first.
#
# A scope outside those pairs (a narrow one like drive.file / gmail.send, or
# openid) gets no picker row, so no user can decline it — which is why it is
# requested unconditionally on top of whatever they did choose, and named on the
# card as something this instance always asks for.
#
# Changing this list never rewrites an existing grant — nothing revalidates one
# at startup. A user keeps whatever they consented to until they reconnect, and
# the settings card shows the difference.
istota_google_workspace_scopes:
  - "https://www.googleapis.com/auth/drive.readonly"
  - "https://www.googleapis.com/auth/gmail.readonly"
  - "https://www.googleapis.com/auth/calendar.readonly"
  - "https://www.googleapis.com/auth/spreadsheets.readonly"
  - "https://www.googleapis.com/auth/documents.readonly"

# Install all optional Python dependencies (--extra all)
# Set to false to use per-feature flags for fine-grained control
istota_install_all_extras: true

# Whisper audio transcription (faster-whisper CPU, int8)
istota_whisper_enabled: false
istota_whisper_model: "small"              # Model to pre-download (tiny/base/small/medium/large-v3)
istota_whisper_max_model: "small"          # Max model for auto-selection at runtime (WHISPER_MAX_MODEL)

# Memory search settings (hybrid BM25 + vector search)
istota_memory_search_enabled: true
istota_memory_search_auto_index_conversations: true
istota_memory_search_auto_index_memory_files: true
istota_memory_search_auto_recall: false           # BM25 search using task prompt as query
istota_memory_search_auto_recall_limit: 5          # max results for auto-recall
istota_memory_search_recency_half_life_days: 180   # recency decay half-life for recall (0 = off)

# Skills routing is single-axis and has no operator knobs: a skill is either
# eager (selected deterministically, full body in the prompt) or in the on-demand
# menu (a one-line entry the model loads via `istota-skill skills show <name>`).
# The former `[skills]` block (progressive_disclosure / auto_lazy_threshold_chars)
# was removed; a stale block is ignored with a load-time warning.

# Learned playbooks (procedural memory) — per-user markdown task procedures the
# sleep cycle distills from successful multi-step tasks, recalled by relevance.
# Off by default.
istota_playbooks_enabled: false
istota_playbooks_recall_limit: 3      # top-K playbooks injected per task
istota_playbooks_min_tool_calls: 4    # a task must use >= this many tools to qualify
istota_playbooks_retention_days: 90   # 0 = keep forever; >0 = age-prune by last-use

# Sleep cycle settings (nightly memory extraction, cron evaluated per-user timezone)
istota_sleep_cycle_enabled: true
istota_sleep_cycle_cron: "0 2 * * *"
istota_sleep_cycle_lookback_hours: 24
istota_sleep_cycle_memory_retention_days: 0  # 0 = unlimited
istota_sleep_cycle_auto_load_dated_days: 3   # auto-load N days of dated memories (0 = disabled)
istota_sleep_cycle_curate_user_memory: false  # nightly USER.md curation (op-based: append/add_heading/remove)
istota_sleep_cycle_curation_log_summary: true  # post one-line summary to user log_channel after applied ops
# KG audit retention is independent of memory_retention_days so default
# deployments still prune the audit table. 0 = unlimited.
istota_sleep_cycle_kg_audit_retention_days: 365

# Channel sleep cycle settings (shared channel memory extraction)
istota_channel_sleep_cycle_enabled: true
istota_channel_sleep_cycle_cron: "0 11 * * *"
istota_channel_sleep_cycle_lookback_hours: 24
istota_channel_sleep_cycle_memory_retention_days: 0  # 0 = unlimited

# Node.js (for developer skill Node.js projects)
istota_nodejs_enabled: false

# Developer skill settings (git + GitLab/GitHub workflows)
# Recommended: dedicated bot accounts with minimal required permissions
istota_developer_enabled: false
istota_developer_repos_dir: ""                    # Base directory for repo clones/worktrees
istota_developer_author_credit: ""                # Appended to every commit (e.g., "Co-Authored-By: Name <email>")
# Minimum forge CLI versions the skill's documented verbs need. Asserted after
# install rather than assumed: below these, a command fails mid-task instead of
# at deploy time. Debian 13 ships gh 2.46 and glab 1.53, both clear.
#   gh 2.40  — `pr checks`, `run view --log-failed`
#   glab 1.36 — `ci trace`
# Raise these if the skill document starts depending on a newer verb.
#   gitleaks 8.19 — `gitleaks git --staged`, which replaced `detect`/`protect`
istota_developer_cli_floors:
  gh: "2.40.0"
  glab: "1.36.0"
  gitleaks: "8.19.0"
# gitleaks is the credential half of this repository's pre-commit hook, and the
# hook refuses an unattended agent commit when it cannot run — so on a host that
# makes agent commits this install is load-bearing, not optional.
#
# Pinned and fetched from the upstream release rather than taken from apt like
# gh and glab: trixie ships 8.16, below the floor above. The digests are
# literals here rather than a checksums file fetched from the same host, so that
# a changed artifact shows up as a diff in this repository.
istota_developer_gitleaks_version: "8.30.1"
istota_developer_gitleaks_checksums:
  amd64: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  arm64: "e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"
# The release tarballs name amd64 "x64".
istota_developer_gitleaks_release_arch:
  amd64: "x64"
  arm64: "arm64"
# GitLab settings
istota_developer_gitlab_url: "https://gitlab.com"
istota_developer_gitlab_token: ""                 # API token (api + write_repository scope — glab needs api, not read_api)
istota_developer_gitlab_username: ""              # GitLab username for HTTPS auth
istota_developer_gitlab_default_namespace: ""     # Default namespace for short repo names
# `glab mr create --reviewer` resolves by username, so this is the username.
istota_developer_gitlab_reviewer: ""              # GitLab username to assign as MR reviewer
# The same person's numeric user id. Nothing reads it (ISSUE-289) — kept so a
# recorded value is not discarded on the next run, and because the name only
# ever described this one.
istota_developer_gitlab_reviewer_id: ""           # GitLab numeric user id, recorded not consumed
# GitHub settings
istota_developer_github_url: "https://github.com"
istota_developer_github_token: ""                 # Personal access token (repo scope)
istota_developer_github_username: ""              # GitHub username for HTTPS auth (defaults to x-access-token)
istota_developer_github_default_owner: ""         # Default org/user for short repo names
istota_developer_github_reviewer: ""              # GitHub username to request as PR reviewer

# Forge CLI wrapper policy. The real `gh` and `glab` run behind
# src/istota/forge_cli.py, which checks the argv against a baseline policy the
# code owns. These two knobs extend and puncture it. Entries are written as
# they would be typed — "gh repo delete" — and an entry with no binary name
# applies to both CLIs.
istota_developer_forge_cli_extra_denied: []       # Additional verbs to refuse
istota_developer_forge_cli_permit: []             # Baseline entries to turn off — each one removes a guard

# Where the wrapper execs the real binaries. The Debian archive installs both
# under /usr/bin, which is what the apt task above produces; the code default
# is /usr/local/bin, for the non-Ansible install shapes. Repoint these if you
# install gh or glab from the vendors' own repos or by hand.
istota_developer_gh_bin_path: "/usr/bin/gh"
istota_developer_glab_bin_path: "/usr/bin/glab"

# Wall-clock budget for one code-review agent. Both agents run concurrently, so
# this is the whole review's clock and not half of it, and it covers the entire
# round: a `need_files` re-invocation and a malformed-output retry come out of
# this budget rather than out of a fresh one. The code default of 120s fits one
# reviewer call on a `smart` model and leaves too little for a second, so the
# round trip gets charged and then times out.
#
# The skill clamps this down to istota_security_skill_proxy_timeout minus 60s
# of assembly allowance, because the proxy kills the whole command at the
# ceiling. At the default 300s ceiling that puts the largest unclamped value at
# 240. Raise the ceiling first if you want more than that here.
istota_developer_review_timeout_seconds: 240

# Public hostname for nginx (web UI, webhooks)
istota_hostname: "{{ istota_namespace }}.example.com"

# Static web root served at the domain root (/). Ansible-managed and entirely
# outside the bot: the path is not under istota_home, the istota user has no
# write access, and nothing binds it into the bwrap sandbox — so this is not a
# return of the agent-writable web root removed in ISSUE-194. Content is the
# operator's; the templated index is written only when the file is missing.
# Set istota_web_root_enabled: false to keep `/` returning 404.
istota_web_root_enabled: true
istota_web_root_path: /srv/www/html
istota_web_root_owner: root
# nginx (www-data on Debian) needs read access, not write — group-read is
# enough, so the directory stays root-owned.
istota_web_root_group: www-data
istota_web_root_dir_mode: "0755"
istota_web_root_file_mode: "0644"

# Backup settings
istota_backup_enabled: true
istota_backup_local_dir: "{{ istota_home }}/data/backups"
istota_backup_remote_dir: "{{ istota_nextcloud_mount_path }}/Backups"
# Local snapshots are the fast-restore working set and sit on the same disk the
# daemon is running out of; the copies on the mount are the durable tail and
# cost nothing locally, so they keep the longer window. Before these were split
# both finds read the same variable, and shrinking the local window to reclaim
# disk silently truncated the off-host history too.
#
# The local window is not cut to the bone on purpose. The remote copy is gated
# on mount_available and there is no back-fill: a snapshot skipped while the
# mount is down is never copied up later, so the local daily file is its only
# copy. The window has to outlast a plausible mount outage.
#
# These feed `find -mtime +N`, which deletes strictly older than N*24h, so a
# value of N retains N+1 days.
istota_backup_db_daily_retention: 5          # delete local dailies older than N days
istota_backup_db_weekly_retention: 3         # delete local weeklies older than N weeks
istota_backup_db_daily_retention_remote: 7   # same, for the copies on the mount
istota_backup_db_weekly_retention_remote: 4
istota_backup_db_cron: "0 */6 * * *"
istota_backup_files_cron: "0 3 * * *"
istota_backup_files_sources:
  - src: "Users"
    dest: "files/Users"
    excludes:
      - "*/shared/**"
  - src: "Channels"
    dest: "files/Channels"
istota_backup_rclone_config: "{{ istota_home }}/.config/rclone/rclone.conf"
istota_backup_rclone_remote: "{{ istota_rclone_remote }}"
istota_backup_rclone_remote_path: "Backups"
istota_backup_log: "/var/log/{{ istota_namespace }}/{{ istota_namespace }}-backup.log"
# Optional command run when a backup run has one or more failures. Empty = no
# alert (backup still exits non-zero + logs the failure). The command receives
# the alert text in the ISTOTA_BACKUP_ALERT_MESSAGE env var, e.g.:
#   'curl -s -H "Title: istota backup failed" -d "$ISTOTA_BACKUP_ALERT_MESSAGE" https://ntfy.example.com/my-topic'
istota_backup_alert_command: ""

# Auto-update settings (poor man's CI)
istota_auto_update_enabled: false
istota_auto_update_cron: "*/5 * * * *"

# Whether to configure rclone automatically
istota_configure_rclone: true

# Security hardening
istota_security_sandbox_enabled: true             # bwrap filesystem isolation per user
# Required wherever sandbox_enabled is true. The databases are masked out of
# the sandbox, so a skill CLI that can't reach the proxy has nothing to read.
istota_security_skill_proxy_enabled: true         # proxy skill CLI calls via Unix socket (credential isolation)
istota_security_skill_proxy_timeout: 300          # timeout for proxied skill commands (seconds)
# Extra RO bind-mounts in the sandbox, for co-located services the agent needs
# to read. Was ["/srv/app"], for a co-located moneyman install that no longer
# exists — and since istota_home lives under it, that entry exposed the
# framework DB and every user's module DB to every task. Keep entries narrow;
# the DB directories are masked after this list either way.
istota_security_sandbox_ro_paths: []
istota_security_network_enabled: true              # --unshare-net + CONNECT proxy (requires sandbox)
istota_security_network_allow_pypi: true           # add pypi.org + files.pythonhosted.org to allowlist
istota_security_network_extra_hosts: []            # operator-specific additions
# When true, secrets are loaded from /etc/<namespace>/secrets.env via EnvironmentFile=
# and omitted from config.toml (config.py reads them from env vars)
istota_use_environment_file: true
