# The lean stack: one container, no Nextcloud, no database server, no browser.
#
# A standalone file rather than an overlay on docker-compose.yml. It shares
# almost nothing with the full stack, and an overlay that had to disable six
# services would be harder to read than a file that never mentions them.
#
# The full stack takes around ten minutes to reach healthy, almost all of it
# Nextcloud installing itself and the entrypoint polling it. This one targets
# thirty seconds, which is what makes it usable in a test.
#
# It is driven by tests/smoke/, never by hand — the config it needs does not
# exist until the harness renders it. `testbed/stack.py` holds the
# invocation.

services:
  istota:
    build:
      context: ..
      dockerfile: docker/istota/Dockerfile

    # An explicit tag, because the project name is unique per test.
    #
    # Left to itself compose names a built image `<project>-<service>`, and
    # every test in this tier invents a fresh project so that an interrupted
    # run's stack is never adopted by the next one. That trade is right for
    # containers and wrong for images: `down --volumes` reclaims containers and
    # volumes and never images, so each test left one more permanent tag behind
    # — measured at 32 after a few runs, each reported as 2.6 GB. The layers are
    # shared, so the disk cost is far less than that suggests, but the tag list
    # grows without bound and nothing ever cleans it.
    #
    # Interpolated rather than hardcoded so concurrent checkouts do not share
    # one tag: work in this repo runs in parallel git worktrees, and a second
    # `up --build` would otherwise move the tag out from under the first run's
    # containers mid-session. The harness supplies a checkout-scoped value; the
    # default is for a hand-run `docker compose -f` outside the harness.
    image: ${ISTOTA_TEST_LEAN_IMAGE:-istota-test/lean:local}

    # The command the shipped entrypoint execs, run directly. Bypassing
    # entrypoint.sh is the whole point: everything it does before this line is
    # Nextcloud provisioning, and the config it would generate has already been
    # rendered on the host by the same render-config.sh the container ships.
    #
    # Deliberately NOT `istota serve`. That launcher belongs to the local
    # single-user install; the Docker deployment runs istota-scheduler, and a
    # tier that verifies the deployment artifact should start it the way the
    # artifact does.
    # `istota init` first, then the scheduler — the same two steps the shipped
    # entrypoint runs (entrypoint.sh, `istota … init` then `exec … scheduler`).
    # Nothing else creates the schema: `init_db` is called from the `init`
    # subcommand alone, and the scheduler opens the DB without it. Skipping it
    # produced a container that passed a health check and then logged
    # "no such table: tasks" twice a second forever.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        uv run istota -c /data/config/config.toml init &&
        exec uv run istota-scheduler --daemon -c /data/config/config.toml

    # bubblewrap needs to create a user namespace, and Docker's default seccomp
    # profile blocks the `unshare(CLONE_NEWUSER)` that takes — measured on
    # Docker Desktop 29.x: `bwrap --unshare-user` reports "No permissions to
    # create new namespace, likely because the kernel does not allow
    # non-privileged user namespaces", which reads as a host misconfiguration
    # rather than as a container policy. Without this the daemon does not fail
    # loudly — `_bwrap_available` answers no, `build_bwrap_cmd` hands back the
    # unwrapped argv, and every task runs unconfined behind one warning line,
    # which is what makes an assertion on the masks the only way to tell the
    # two apart. (This comment used to say every Bash tool call fails. It does
    # not, and the reason it does not is the whole reason
    # `test_sandbox_in_stack.py` asserts on a tmpfs rather than on output
    # coming back.)
    #
    # `systempaths=unconfined` is the second half of the same grant, and it was
    # measured in Stage 7 rather than anticipated. seccomp lets bwrap *create*
    # the user namespace; it does not let it mount a fresh procfs inside one.
    # Docker's default masked paths (`/proc/kcore`, `/proc/keys`, … bind-mounted
    # over) and its read-only `/proc/sys` make the container's procfs not
    # "fully visible" to the kernel, and the kernel then refuses `mount("proc")`
    # in a nested user namespace — `build_bwrap_cmd` emits `--proc /proc`, so
    # with only the seccomp grant every real sandbox dies at "Can't mount proc
    # on /newroot/proc: Operation not permitted". Measured on the shipped image:
    # the same argv exits 0 with this line and 1 without it. `--cap-add=SYS_ADMIN`
    # is not an alternative — measured too, it gets past the unshare and fails
    # at `pivot_root`.
    #
    # The pair is the *whole* grant. One consequence worth stating: with
    # `/proc/sys` writable, `executor._bwrap_supports_disable_userns` now finds
    # `--disable-userns` supported and it reaches the real argv, so this tier
    # exercises more of the production sandbox than it used to rather than
    # less. Nothing here asserts about nested-userns behaviour either way.
    #
    # A test-harness concession, not a deployment recipe. The supported
    # production shape is bare metal via Ansible, where nothing blocks any of
    # this; docker-compose.yml deliberately carries neither line, which is why
    # a Docker deployment runs its tasks unsandboxed.
    security_opt:
      - seccomp:unconfined
      - systempaths=unconfined

    environment:
      # Config generation already happened on the host, so almost nothing is
      # needed here. What remains is what the daemon reads from the environment
      # at load time rather than from the file.
      # A fixed literal, NOT `${ISTOTA_BRAIN_NATIVE_API_KEY:-…}`. Interpolating
      # from the ambient environment would ship a developer's real key into a
      # test container that then POSTs to a listener on their own machine.
      # Nothing in this tier can use a real key: the endpoint is scripted and
      # ignores the Authorization header entirely.
      ISTOTA_BRAIN_NATIVE_API_KEY: unused-by-the-scripted-endpoint
      # The master key the encrypted `secrets` table is derived from. On the
      # full shape `entrypoint.sh` generates one and persists it to
      # `/data/.secret_key`; this stack bypasses the entrypoint, so without
      # this line every `istota secret` call and every per-user connected
      # service (ntfy, and anything else that lives in that table) fails with
      # "ISTOTA_SECRET_KEY is not set".
      #
      # A fixed literal for the same reason as the line above, and one that is
      # obviously not a key: it is committed in a public repository, it
      # encrypts nothing but the values this tier itself seeds, and the volume
      # holding them is destroyed at the end of every session. `_MIN_KEY_LEN`
      # is 32 characters, which is the only property the loader checks.
      ISTOTA_SECRET_KEY: not-a-real-key-for-the-lean-test-stack-only
      PYTHONUNBUFFERED: "1"

    volumes:
      # The rendered config, from a host directory the harness owns. A bind
      # mount rather than a named volume because the harness has to write the
      # file *before* the container starts, and a named volume has no host path
      # to write it through.
      - ${ISTOTA_TEST_CONFIG_DIR:?the harness must export ISTOTA_TEST_CONFIG_DIR}:/data/config:ro
      # The framework DB on a named volume, so Layer 4 can retain it across an
      # upgrade and assert that migrations applied over the old file.
      - istota_test_db:/data/db

    tmpfs:
      # The Nextcloud mount, which in this stack has no Nextcloud behind it.
      # tmpfs rather than a volume: nothing here outlives the run, and it keeps
      # a failed teardown from leaving state that the next run inherits.
      - /mnt/shared
      - /data/repos

    # `host.docker.internal` is built in on Docker Desktop and absent on Docker
    # Engine. Declaring it makes the scripted model endpoint — which runs in the
    # pytest process on the host — reachable by the same name on both.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      # The `tasks` table, not the file. The file appears the moment anything
      # opens the DB, which is *before* `init` has created a schema — measured:
      # a container that reported healthy and then logged "no such table:
      # tasks" on every scheduler tick. Readiness is "the daemon can do work",
      # and the cheapest honest proxy for that is the table it dispatches from.
      test:
        - CMD-SHELL
        - >-
          python -c "import sqlite3,sys;
          sys.exit(0 if sqlite3.connect('file:/data/db/istota.db?mode=ro', uri=True)
          .execute(\"SELECT 1 FROM sqlite_master WHERE type='table' AND name='tasks'\")
          .fetchone() else 1)"
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s

  # The Talk high-performance backend, behind the same compose profile name the
  # shipped file uses, so a profile is activated rather than a file substituted.
  #
  # This shape has no Nextcloud, so the daemon in this stack never connects to
  # it: hello-v2 needs Talk to mint and sign a JWT, and `require_hpb` refuses to
  # boot without a Nextcloud reporting `external` signaling mode. The scenario
  # drives istota's protocol module from the pytest process instead, and
  # publishes into a room through the backend API the way Talk's
  # `BackendNotifier` does. The server, and everything it decides about
  # relaying, is real.
  #
  # Every secret comes from the harness — `testbed/services/signaling.py`
  # generates one set per session into the compose env-file — because upstream's
  # `server.conf.in` carries published constants for all three, and one of them
  # is the door an internal client joins any room through.
  signaling:
    image: strukturag/nextcloud-spreed-signaling:${ISTOTA_TALK_SIGNALING_IMAGE_TAG:-2.1.1}
    profiles:
      - signaling
    # Port 0, so two sessions on one machine never collide; the harness reads
    # the real one back with `docker compose port`.
    ports:
      - "${ISTOTA_TALK_SIGNALING_BIND:-127.0.0.1}:${ISTOTA_TALK_SIGNALING_PORT:-0}:8080"
    environment:
      HTTP_LISTEN: 0.0.0.0:8080
      # There is nothing behind this name on this shape. The server only ever
      # matches it against the `backend` a client names, and the round trip that
      # would resolve it happens on auth paths this shape cannot reach.
      BACKENDS: nextcloud
      BACKEND_NEXTCLOUD_URLS: http://nextcloud
      # `:-` and not `:?`, which would be the honest preflight and cannot be
      # used: compose interpolates the whole file on every subcommand, before
      # it filters by profile, so a required variable here would break `up` for
      # `base`, `forge` and every other lean profile that never starts this
      # container. The entrypoint below closes the same hole from inside.
      BACKEND_NEXTCLOUD_SHARED_SECRET: ${ISTOTA_TALK_SIGNALING_SECRET:-}
      HASH_KEY: ${ISTOTA_TALK_SIGNALING_HASH_KEY:-}
      BLOCK_KEY: ${ISTOTA_TALK_SIGNALING_BLOCK_KEY:-}
      INTERNAL_SHARED_SECRET_KEY: ${ISTOTA_TALK_SIGNALING_INTERNAL_SECRET:-}
    # The same wrapper the shipped file carries, for the same reason: three of
    # the placeholders in upstream's `server.conf.in` are published constants,
    # and `[clients] internalsecret` is the door an internal client joins any
    # room through. A random value per container where the caller named none.
    entrypoint:
      - /bin/bash
      - -c
      - |
        for var in INTERNAL_SHARED_SECRET_KEY HASH_KEY BLOCK_KEY; do
          if [ -z "$${!var}" ]; then
            export "$$var=$$(head -c 24 /dev/urandom | base64 | tr -d '=')"
            echo "[signaling] $$var was not set; generated a random one for this container."
          fi
        done
        exec /entrypoint.sh

volumes:
  istota_test_db:
