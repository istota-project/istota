# The stack ships no Nextcloud. Storage is one of two modes, chosen by
# `[nextcloud] url` in config.toml:
#
#   - local (the default): the workspace is /data/workspace on the state volume.
#   - full Nextcloud integration: the bot is a user on an existing Nextcloud,
#     and the workspace is the VM's rclone mount of its files, bound at
#     /mnt/shared below. The entrypoint refuses to start when /mnt/shared is
#     not that mount, so nothing is written into an unmounted store.
#
# The bind is always present and unused in local mode. `rslave`, so a remount
# on the VM shows through without restarting the containers. Docker Desktop
# refuses `rslave` on a macOS path ("not a shared or slave mount"), which is one
# reason this file runs in a VM; the test tiers replace the mount.
# ISTOTA_MOUNT_DIR defaults to ./mount, which is /srv/istota/mount on the VM.
x-workspace-mount: &workspace_mount
  type: bind
  source: ${ISTOTA_MOUNT_DIR:-./mount}
  target: /mnt/shared
  bind:
    propagation: rslave
    create_host_path: true

# The credentials every service built from the istota image mounts. One file
# each under ISTOTA_SECRETS_DIR, named for the variable the daemon reads it
# from, lowercased; `istota setup --vm-dir` writes them all (empty when unused,
# since compose refuses to start a service whose secret file is missing), 0400
# and owned by uid 10001. `setup_wizard.SECRET_NAMES` is the same list, and
# tests/test_setup_container.py holds the two equal.
# The config directory: /srv/istota/config on the VM, bound at /data/config.
# Read-only for every running service, so the daemon cannot rewrite its own
# config. `istota setup` and `istota apply` write it from a one-shot container
# that `istota-stack` starts with ISTOTA_CONFIG_ACCESS=rw.
x-config-mount: &config_mount
  type: bind
  source: ${ISTOTA_CONFIG_DIR:-./config}
  target: /data/config
  read_only: ${ISTOTA_CONFIG_READ_ONLY:-true}
  bind:
    create_host_path: true

# The image every service built from docker/istota/Dockerfile runs. Built on the
# VM from a verified release tag by `istota-stack update`, which writes the tag
# to .env as ISTOTA_TAG; nothing is pulled from a registry.
x-istota-build: &istota_build
  context: ..
  dockerfile: docker/istota/Dockerfile
  args:
    # From host.env through `istota-stack`, which sets INSTALL_CLAUDE_CODE=0
    # when config.toml names no brain that needs it. Unset, the Dockerfile's
    # defaults apply.
    - INSTALL_CLAUDE_CODE
    - CLAUDE_CODE_VERSION

# web and webhooks have no root phase: they start as uid 0 only to run
# `istota-drop`, which needs SETUID, SETGID and SETPCAP (the last empties the
# bounding set) and nothing else, then serve as 10001 with every set empty.
# Read-only like istota: they write only under /data and /tmp.
x-dropped-service: &dropped_service
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  cap_add: [SETUID, SETGID, SETPCAP]
  read_only: true
  tmpfs:
    - /tmp

x-istota-secrets: &istota_secrets
  - anthropic_api_key
  - claude_code_oauth_token
  - istota_brain_native_api_key
  - istota_nextcloud_app_password
  - istota_web_oauth2_client_secret
  - istota_web_session_secret_key
  - istota_email_imap_password
  - istota_caldav_password
  - istota_developer_gitlab_token
  - istota_developer_github_token

services:
  istota:
    build: *istota_build
    image: istota-istota:${ISTOTA_TAG:-local}
    # The run contract. Every task runs in a bubblewrap sandbox inside this
    # container, and bwrap needs what Docker's defaults refuse: creating a user
    # namespace (seccomp), mounting inside it (seccomp and AppArmor), and
    # mounting a procfs there (systempaths). The first three lines are that
    # grant and nothing wider:
    #
    #   - seccomp-istota.json is Docker's default profile plus clone, clone3,
    #     mount, pivot_root, umount2 and unshare, minus the default's
    #     CAP_SYS_ADMIN rule (Docker applies it per container, so with the root
    #     phase's SYS_ADMIN below it would open bpf and perf_event_open to every
    #     sandbox). bpf, keyctl, userfaultfd and the rest stay denied.
    #   - apparmor=istota is docker-default plus mount and pivot_root. It has to
    #     be loaded on the host (provision.sh does it); a host without AppArmor
    #     ignores the option. It keeps docker-default's denial of writes to
    #     /proc/sys, which systempaths=unconfined would otherwise open to a
    #     uid-0 `docker exec`.
    #   - systempaths=unconfined unmasks /proc, without which the kernel refuses
    #     a procfs mount in a nested user namespace.
    #
    # tests/test_container_security_profiles.py holds both profiles to the
    # Docker defaults they were derived from, and these lines to the lean test
    # stack's.
    security_opt:
      - seccomp=./istota/seccomp-istota.json
      - apparmor=istota
      - systempaths=unconfined
      - no-new-privileges:true
    # The root phase (root-phase.sh) needs these six and nothing after it:
    # CHOWN and FOWNER for the one-time ownership fix, SETUID, SETGID and
    # SETPCAP for the drop (SETPCAP is what empties the bounding set), and
    # SYS_ADMIN for the cgroup remount alone. `istota-drop` removes all six
    # before the daemon starts. A `docker exec` does not inherit the drop, so
    # every exec path goes through `istota-drop` too.
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, SETUID, SETGID, SETPCAP, SYS_ADMIN]
    read_only: true
    tmpfs:
      - /tmp
    # A private cgroup namespace and no bind of /sys/fs/cgroup: Docker then
    # mounts the container's own cgroup, read-only, which the root phase
    # remounts and delegates to the daemon for per-task limits. A bind of the
    # host path would show the VM's root cgroup instead; the root phase refuses
    # to start on one.
    cgroup: private
    networks:
      - default
      - browser
    healthcheck:
      # The `tasks` table, not the file, which appears the moment anything opens
      # the database. Through `istota-drop`: a healthcheck runs the way
      # `docker exec` does, as uid 0 with the cap_add set, and a root-owned
      # sidecar is how the daemon gets locked out of its own database.
      test:
        - CMD-SHELL
        - >-
          istota-drop python3 -c "import sqlite3,sys;
          sys.exit(0 if sqlite3.connect('file:/data/db/istota.db?mode=ro', uri=True)
          .execute(\"SELECT 1 FROM sqlite_master WHERE type='table' AND name='tasks'\")
          .fetchone() else 1)"
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 30s
    volumes:
      - istota_data:/data
      - *config_mount
      - *workspace_mount
    # The ingress mode and the public name, for the entrypoint's check that
    # `[site] hostname` is DOMAIN behind TLS. host.env is written by `istota
    # setup --vm-dir`; `istota-stack` names /srv/istota/host.env. Without one
    # the stack is `local`.
    env_file:
      - path: ${ISTOTA_HOST_ENV:-./host.env}
        required: false
    # No istota configuration here. config.toml is an input: `istota setup`
    # writes /data/config/config.toml on the state volume once, and the
    # operator owns it after that. What remains are three facts about the
    # container that every process in it, `docker compose exec` included,
    # has to agree on.
    environment:
      # Where the root phase delegated the container's cgroup. Declared here as
      # well as exported by the root phase, so a process started by
      # `docker compose exec` (doctor through `istota-drop`) checks the same
      # root the daemon uses.
      ISTOTA_TASK_CGROUP_ROOT: /sys/fs/cgroup
      # The admin allowlist `istota setup` writes beside the config. Shared
      # with the web and webhooks services.
      ISTOTA_ADMINS_FILE: /data/config/admins
      # So `docker compose exec istota istota-drop istota <verb>` finds the
      # config: /data/config/config.toml is on none of the four search paths.
      ISTOTA_CONFIG_PATH: /data/config/config.toml
    # Credentials, one file each, mounted under /run/secrets and read into the
    # environment by `istota-secrets` after the drop, so no value is in this
    # file or in `docker inspect`. See the top-level `secrets:` below.
    secrets: *istota_secrets
    restart: unless-stopped

  # Web UI service. Shares the istota image (built once) and reads the same
  # config.toml the scheduler container generates. Depends on `istota` so the
  # config file exists before uvicorn starts.
  web:
    <<: *dropped_service
    build: *istota_build
    image: istota-istota:${ISTOTA_TAG:-local}
    # Healthy, not started: the istota service's healthcheck is the `tasks`
    # table, so this starts on a migrated database. The config is an input and
    # exists before either starts.
    depends_on:
      istota:
        condition: service_healthy
    volumes:
      - istota_data:/data
      - *config_mount
      - *workspace_mount
    # Internal-only — nginx routes /istota/ to web:${WEB_PORT}. To bypass nginx,
    # uncomment the ports block below.
    # ports:
    #   - "${WEB_PORT:-8766}:${WEB_PORT:-8766}"
    expose:
      - "${WEB_PORT:-8766}"
    environment:
      WEB_PORT: ${WEB_PORT:-8766}
      # Static SPA build location (not derivable from package path under non-editable installs).
      ISTOTA_WEB_STATIC_DIR: /app/web/build
      # The session cookie carries Secure unless this is 1, in every ingress
      # mode: `local` is http://localhost, which browsers treat as a secure
      # context. Off unless an operator sets it.
      ISTOTA_WEB_INSECURE_COOKIES: ${ISTOTA_WEB_INSECURE_COOKIES:-0}
      # Admin allowlist (shared with the istota and webhooks services).
      ISTOTA_ADMINS_FILE: /data/config/admins
      # The config, where the istota service reads it; the root filesystem is
      # read-only, so nothing links it into /app/config.
      ISTOTA_CONFIG_PATH: /data/config/config.toml
    # The web process calls a model on its own (the health OCR extractors, the
    # biomarker explainer, shared-block run-now) and talks to Nextcloud, so it
    # needs the daemon's credentials: the same files, read the same way.
    secrets: *istota_secrets
    # Dropped first, as the daemon's uid like everything else that writes under
    # /data: a root-owned database sidecar locks the daemon out (ISSUE-458).
    # The drop reads the master key (istota-secrets); the web-only token key,
    # which the istota service creates on its first boot, is read here.
    # Healthy means both exist.
    entrypoint:
      - istota-drop
      - /bin/sh
      - -c
      - |
        if [ -z "$${ISTOTA_WEB_TOKEN_KEY:-}" ] && [ -f /data/.web_token_key ]; then
          export ISTOTA_WEB_TOKEN_KEY=$$(cat /data/.web_token_key)
        fi
        exec /app/.venv/bin/uvicorn istota.webui.app:app --no-access-log --host 0.0.0.0 --port "$${WEB_PORT}"
    command: []
    restart: unless-stopped

  # The only listener the stack publishes, in every ingress mode. INGRESS
  # (host.env: direct, proxied or local) picks the server blocks the start script
  # renders from docker/nginx/ (istota-ingress.sh, run by the image's own
  # entrypoint before nginx starts); the location blocks exist once, in
  # istota.conf.template. tests/image/test_nginx_ingress.py runs `nginx -t`
  # over every mode.
  #
  # The two published ports are written by `istota setup` into .env, per mode:
  # `direct` publishes 80 and 443 on every address; `proxied` one private
  # address, on whichever slot it terminates; `local` loopback. Compose cannot
  # leave a `ports:` entry out, so a slot a mode does not use is an ephemeral
  # loopback port with nothing listening behind it.
  #
  # Certificates: CERTS_DIR is /srv/istota/letsencrypt (TLS_CERT_SOURCE=acme,
  # written by certbot on the VM) or /srv/istota/certs (files), and ACME_WEBROOT
  # is /srv/istota/acme. Neither is mounted into any istota container.
  nginx:
    image: nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    depends_on:
      web:
        condition: service_started
    ports:
      - "${NGINX_PUBLISH:-127.0.0.1:8080:80}"
      - "${NGINX_PUBLISH_TLS:-127.0.0.1::443}"
    volumes:
      - ./nginx:/etc/istota-nginx:ro
      - ./nginx/istota-ingress.sh:/docker-entrypoint.d/15-istota-ingress.sh:ro
      - ${CERTS_DIR:-./nginx/certs}:/etc/nginx/certs:ro
      - ${ACME_WEBROOT:-./nginx/acme}:/var/www/acme:ro
    env_file:
      - path: ${ISTOTA_HOST_ENV:-./host.env}
        required: false
    environment:
      WEB_PORT: ${WEB_PORT:-8766}
      WEBHOOKS_PORT: ${ISTOTA_WEBHOOKS_PORT:-8765}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-512M}
    restart: unless-stopped

  browser:
    build:
      context: browser/
      dockerfile: Dockerfile
    image: istota-browser:${ISTOTA_TAG:-local}
    container_name: istota-browser
    platform: ${BROWSER_PLATFORM:-linux/amd64}
    # PID 1 in this image is `su` (entrypoint.sh ends with `exec su … python`),
    # which installs no SIGCHLD handler and reaps no orphan. Chrome's renderer,
    # GPU, zygote and crashpad processes are children of the browser process, so
    # every hard kill of it reparents them here — 43 zombies accumulated in 40
    # minutes of production before ISSUE-394. The API now kills Chrome's whole
    # process group and waits on it, which is the fix; this is the backstop for
    # whatever still escapes, since a container without an init has no reaper at
    # all and the pids cgroup limit is finite.
    init: true
    # A host whose core_pattern is plain `core` has each crashed renderer dump
    # ~1.1G into /app in the writable layer, which a restart keeps.
    ulimits:
      core: 0
    profiles:
      - browser
    ports:
      - "${BROWSER_API_BIND:-127.0.0.1}:${BROWSER_API_PORT:-9223}:9223"
      - "${BROWSER_VNC_BIND:-127.0.0.1}:${BROWSER_VNC_PORT:-6080}:6080"
    shm_size: ${BROWSER_SHM_SIZE:-2gb}
    environment:
      VNC_PASSWORD: ${VNC_PASSWORD:-}
      BROWSER_VNC_URL: ${ISTOTA_BROWSER_VNC_URL:-}
      BROWSER_MAX_INSTANCES: ${BROWSER_MAX_INSTANCES:-2}
      BROWSER_INSTANCE_IDLE_S: ${BROWSER_INSTANCE_IDLE_S:-900}
      BROWSER_MAX_TOTAL_SESSIONS: ${BROWSER_MAX_TOTAL_SESSIONS:-4}
      BROWSER_DISK_CACHE_BYTES: ${BROWSER_DISK_CACHE_BYTES:-104857600}
      MAX_BROWSER_SESSIONS: ${MAX_BROWSER_SESSIONS:-2}
    deploy:
      resources:
        limits:
          memory: ${BROWSER_MEMORY_LIMIT:-3G}
    # Probe the lightweight liveness endpoint on its own thread/port (9224),
    # not the single-threaded Flask /health (9223): a long in-flight browse
    # blocks Flask, which would make a busy-but-healthy container read as
    # unhealthy and get restarted mid-operation (ISSUE-143). The deep tier
    # (?deep=1) also probes Chrome's DevTools endpoint so a wedged-but-alive
    # Chrome reads as unhealthy too (ISSUE-149); a busy browse still passes.
    # Its third arm reads the CDP heartbeat, so an API process that can no longer
    # drive a perfectly healthy Chrome reads as unhealthy as well (ISSUE-384).
    # Nothing here acts on that verdict: `restart: unless-stopped` reacts to
    # process exit, and the debounced auto-heal actor is the Ansible shape's
    # cron watchdog. Documented in docs/deployment/docker.md, alongside the
    # sandbox posture this stack makes the same choice about.
    # A compose healthcheck overrides the image HEALTHCHECK, so this must match it.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9224/live?deep=1' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    volumes:
      - browser_profile:/data/browser-profile
    # Its own network, joined by the daemon alone: a page the browser renders
    # runs attacker-chosen code, and from the default network it could reach
    # the web app, the webhook receiver and the signaling server directly.
    networks:
      - browser
    restart: unless-stopped

  # The Nextcloud Talk high-performance backend, which is what makes inbound
  # Talk a push rather than a poll. Off by default, behind a compose profile:
  #
  #     docker compose --profile signaling up -d
  #
  # Three things have to line up, and turning the profile on is only the first.
  # Your Nextcloud's Talk has to have the server registered (`occ
  # talk:signaling:add https://<this stack>/standalone-signaling/ <secret>`,
  # with ISTOTA_TALK_SIGNALING_SECRET as the secret), and the daemon has to be
  # told to use it, with `[talk.signaling] enabled = true` in config.toml.
  #
  # Registering an external signaling server changes call signaling for every
  # Talk user on this Nextcloud, not only for istota. With no MCU configured
  # media stays peer-to-peer and calls keep working, but it is a change to a
  # shared service.
  #
  # No Janus and no external NATS: `[mcu] type` is left empty and the image
  # defaults `[nats] url` to `nats://loopback`, so this is one small Go binary
  # with no dependencies of its own. istota never publishes or subscribes to a
  # media stream.
  signaling:
    image: strukturag/nextcloud-spreed-signaling:${ISTOTA_TALK_SIGNALING_IMAGE_TAG:-2.1.1}
    profiles:
      - signaling
    # Loopback by default, and normally nothing outside the container network
    # needs it: nginx proxies `/standalone-signaling/` through to this service,
    # which is the address Talk gets registered with — one URL that a browser
    # and Nextcloud's own PHP both resolve. The publish stays for debugging and
    # for an operator fronting the server themselves. Loopback rather than
    # 0.0.0.0 because publishing it unencrypted on a public interface would put
    # the hello token and every relayed chat message on the wire in clear.
    ports:
      - "${ISTOTA_TALK_SIGNALING_BIND:-127.0.0.1}:${ISTOTA_TALK_SIGNALING_PORT:-8081}:8080"
    environment:
      HTTP_LISTEN: 0.0.0.0:8080
      BACKENDS: nextcloud
      # **Two URLs, and both are needed.**  (This comment describes the key
      # below it, `BACKEND_NEXTCLOUD_URLS`.) The server matches an incoming
      # request against this list twice over, from opposite directions: Talk
      # stamps every backend request with the URL a *browser* reaches it on
      # (`overwrite.cli.url`), while the daemon's hello names the URL *it*
      # reaches Nextcloud on, which on this network is the service name. A list
      # with only one of them refuses the other, and the refusal is not obvious
      # from where it lands — an unmatched backend request is counted as a
      # bruteforce attempt, so after a handful of them Talk gets `429 Too Many
      # Requests` and every room creation fails with a 500 that names nothing.
      #
      # Both are your Nextcloud's: the URL browsers reach it on (what Talk
      # stamps) and the one this stack reaches it on (what the daemon names),
      # comma-separated, or one URL when they are the same. No default, since
      # the stack runs no Nextcloud of its own.
      BACKEND_NEXTCLOUD_URLS: ${ISTOTA_TALK_SIGNALING_BACKEND_URLS:-}
      # Talk's credential for this server, and the reason the two variables are
      # one value: `occ talk:signaling:add` on the Nextcloud side and the
      # backend secret here have to match or every backend request is refused.
      # Left empty it is generated at random by the entrypoint below, which
      # makes the mismatch loud rather than leaving the server accepting a
      # backend request signed with an empty key.
      BACKEND_NEXTCLOUD_SHARED_SECRET: ${ISTOTA_TALK_SIGNALING_SECRET:-}
      # Session checksum and encryption keys. Distinct from the backend secret
      # and from each other; the block key must be 16, 24 or 32 bytes.
      HASH_KEY: ${ISTOTA_TALK_SIGNALING_HASH_KEY:-}
      BLOCK_KEY: ${ISTOTA_TALK_SIGNALING_BLOCK_KEY:-}
      # Deliberately *not* interpolated from ISTOTA_TALK_SIGNALING_SECRET or
      # given a default — see the entrypoint below.
      INTERNAL_SHARED_SECRET_KEY: ${ISTOTA_TALK_SIGNALING_INTERNAL_SECRET:-}
    # The image's own entrypoint renders /config/server.conf from the variables
    # above the first time it starts, substituting each placeholder in
    # server.conf.in only where the matching variable is non-empty. Three of
    # those placeholders are *published constants* in the upstream file, and one
    # of them is the administrative door: `[clients] internalsecret` is what an
    # internal client authenticates with, and an internal client can join any
    # room on the instance, invisibly to everyone in it (hub.go:1922-1927). Left
    # to the image's default this stack would ship that door with a password
    # printed in a public repository.
    #
    # So a random value per container when the operator names none. Random
    # rather than empty: an empty secret is still a secret an attacker can
    # compute an HMAC with. istota holds no internal secret at all and needs
    # none, so the generated value has no reader and that is the intent — an
    # operator running a talk-recording server beside this one sets
    # ISTOTA_TALK_SIGNALING_INTERNAL_SECRET and configures both ends.
    #
    # The two session keys get the same treatment for the same reason: with the
    # published defaults, anyone can forge a session checksum. So does the
    # backend secret, which is the door `publish_chat` in the testbed uses to
    # write arbitrary chat events into any room — an operator who starts the
    # profile without setting it gets a server Talk cannot reach rather than one
    # anybody can.
    #
    # `tr '+/' '-_'` because these values are substituted into the config by the
    # image's own `sed`, and an alphabet without the delimiter characters costs
    # nothing and removes the question. `exec /entrypoint.sh` with no arguments
    # is correct: the image declares no CMD (`docker image inspect … .Config.Cmd`
    # is null), so there is nothing being discarded.
    #
    # **Nothing orders the istota container after this one**, and that is a
    # limitation rather than an oversight: compose auto-enables the profile of
    # any service a running service depends on, so a `depends_on` here would
    # start the signaling server on every deployment. The daemon's watchers
    # retry on their own backoff, so a late start costs nothing on that side —
    # but Talk's own message path is coupled to the backend, and a chat POST
    # made while the server is unreachable was measured answering HTTP 400. A
    # stack whose provisioning posts during that window fails that post.
    entrypoint:
      - /bin/bash
      - -c
      - |
        for var in INTERNAL_SHARED_SECRET_KEY HASH_KEY BLOCK_KEY BACKEND_NEXTCLOUD_SHARED_SECRET; do
          if [ -z "$${!var}" ]; then
            export "$$var=$$(head -c 24 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=')"
            echo "[signaling] $$var was not set; generated a random one for this container."
          fi
        done
        exec /entrypoint.sh
    restart: unless-stopped

  webhooks:
    <<: *dropped_service
    build: *istota_build
    image: istota-istota:${ISTOTA_TAG:-local}
    profiles:
      - location
      - sms
      - whatsapp
    # Healthy for the reason `web` waits: a migrated database, and the config
    # (an input) in place.
    depends_on:
      istota:
        condition: service_healthy
    expose:
      - "${ISTOTA_WEBHOOKS_PORT:-8765}"
    volumes:
      - istota_data:/data
      - *config_mount
      - *workspace_mount
    environment:
      ISTOTA_WEBHOOKS_PORT: ${ISTOTA_WEBHOOKS_PORT:-8765}
      # Admin allowlist (shared with the istota and web services).
      ISTOTA_ADMINS_FILE: /data/config/admins
      ISTOTA_CONFIG_PATH: /data/config/config.toml
    # The SMS and WhatsApp webhook credentials it verifies callbacks with.
    secrets: *istota_secrets
    entrypoint:
      - istota-drop
      - /bin/sh
      - -c
      - |
        # --no-access-log, because one route's query string is a credential.
        # Meta sends the WhatsApp verify token as `?hub.verify_token=` on the
        # GET subscription handshake, and uvicorn's default access formatter
        # renders the path *with* the query string — so the container log
        # would hold the token however nginx is configured. nginx is told not
        # to log that path too; this is the half nginx cannot reach. The
        # receiver logs each event itself under a stable name, without it.
        exec /app/.venv/bin/uvicorn istota.webui.webhook_receiver:app --host 0.0.0.0 --port "$${ISTOTA_WEBHOOKS_PORT}" --no-access-log
    command: []
    restart: unless-stopped

  whatsapp-baileys:
    build:
      # This directory, not the repository root: the program is three files and
      # needs nothing from the tree.
      context: whatsapp-baileys
      dockerfile: Dockerfile
    image: istota-whatsapp-baileys:${ISTOTA_TAG:-local}
    # Its own profile, and not `whatsapp`, because the two adapters need
    # opposite things: Cloud needs the webhook receiver and no sidecar, Baileys
    # needs the sidecar and no receiver. A compose profile cannot read
    # `provider` out of the rendered config, so the operator names the one that
    # matches — `whatsapp` for Meta, `whatsapp-baileys` for a paired session.
    profiles:
      - whatsapp-baileys
    depends_on:
      # The daemon owns the listener. The sidecar retries a missing socket
      # every two seconds either way, so this only saves a burst of reconnect
      # lines on a cold start, so `service_started` is enough.
      istota:
        condition: service_started
    volumes:
      # The whole data volume, for one directory and one socket in it. Both
      # live beside db_path, which `istota setup` writes as
      # /data/db/istota.db, and both are the daemon's to create — the sidecar
      # dials the socket and Baileys writes the session files, so this
      # container must see the same inodes rather than a copy.
      - istota_data:/data
    environment:
      # Derived from db_path above rather than configured: the socket name has
      # no config override at all, and session_dir is left unset in the config
      # so it resolves to exactly this path. The media directory is the same
      # kind of value — where an inbound photo is staged between this
      # container's download and the daemon's copy into the sender's workspace
      # — and it has no override at all, by decision. All three are fixed
      # literals rather than `${...}` interpolations because none of them is an
      # operator's to choose. The program exits 2 without either of the first
      # two; the media directory is an override it derives from the session
      # directory when absent (ISSUE-508), and the literal is pinned against
      # that derivation rather than being what the program cannot start
      # without.
      ISTOTA_BAILEYS_SOCKET: /data/db/whatsapp-baileys.sock
      ISTOTA_BAILEYS_SESSION_DIR: /data/db/whatsapp-baileys-session
      ISTOTA_BAILEYS_MEDIA_DIR: /data/db/whatsapp-media
      ISTOTA_BAILEYS_LOG_LEVEL: ${ISTOTA_BAILEYS_LOG_LEVEL:-info}
    # No ports and no expose: it speaks to the daemon over the volume's socket
    # and to WhatsApp outbound, and nothing ever dials it.
    restart: unless-stopped

  # The devboxes are not in this file. Compose cannot loop over users, so
  # `istota devbox compose-file` renders them from [devbox] users into a
  # second file, compose.devbox.yml, passed as a second -f: one devbox-<user>
  # service each, plus this service's mounts of every user's devbox-exec-<user>
  # and devbox-cred-<user> volumes. Each devbox mounts only its own pair; that
  # is what identifies a credential-proxy client (src/istota/devbox/proxy.py).
  # No Docker socket is mounted here or there. See docs/deployment/docker.md
  # and tests/test_devbox_compose_file.py.

networks:
  default:
  # The browser container and the daemon that drives it, nothing else.
  browser:

# One file per credential, in the stack's secrets directory (/srv/istota/secrets
# on the VM, docker/secrets in a checkout). Compose bind-mounts each as it is on
# disk and does not apply a secret's uid, gid or mode outside Swarm, so the
# 0400 and uid 10001 are the writer's job: `istota setup --vm-dir`, run in the
# image as uid 10001, creates them that way.
secrets:
  anthropic_api_key:
    file: ${ISTOTA_SECRETS_DIR:-./secrets}/anthropic_api_key
  claude_code_oauth_token:
    file: ${ISTOTA_SECRETS_DIR:-./secrets}/claude_code_oauth_token
  istota_brain_native_api_key:
    file: ${ISTOTA_SECRETS_DIR:-./secrets}/istota_brain_native_api_key
  istota_nextcloud_app_password:
    file: ${ISTOTA_SECRETS_DIR:-./secrets}/istota_nextcloud_app_password
  istota_web_oauth2_client_secret:
    file: ${ISTOTA_SECRETS_DIR:-./secrets}/istota_web_oauth2_client_secret
  istota_web_session_secret_key:
    file: ${ISTOTA_SECRETS_DIR:-./secrets}/istota_web_session_secret_key
  istota_email_imap_password:
    file: ${ISTOTA_SECRETS_DIR:-./secrets}/istota_email_imap_password
  istota_caldav_password:
    file: ${ISTOTA_SECRETS_DIR:-./secrets}/istota_caldav_password
  istota_developer_gitlab_token:
    file: ${ISTOTA_SECRETS_DIR:-./secrets}/istota_developer_gitlab_token
  istota_developer_github_token:
    file: ${ISTOTA_SECRETS_DIR:-./secrets}/istota_developer_github_token

volumes:
  istota_data:
  browser_profile:
