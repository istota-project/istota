# Skill plugins, on the dedicated VM only.
#
# istota-stack adds this file with -f when /srv/app/istota/plugins/installed
# exists, which provision.sh creates, and exports ISTOTA_PLUGINS_DIR for it.
# `istota-stack plugins sync` installs the wheels in plugins/src/ into
# plugins/installed/site, which the image's venv reads through
# istota-plugins.pth. The parent is bound, not site/, so a tree a sync replaces
# is seen by the next process without recreating a container. daemon and web
# load the skill index; nothing else does, and no task sandbox binds this. The
# base compose file carries none of it, so a stack started any other way (the
# testbed, Docker Desktop, an older istota-stack running a newer file) has no
# plugins and no bind.
services:
  daemon:
    volumes:
      - ${ISTOTA_PLUGINS_DIR:?istota-stack sets ISTOTA_PLUGINS_DIR}:/app/plugins:ro
  web:
    volumes:
      - ${ISTOTA_PLUGINS_DIR:?istota-stack sets ISTOTA_PLUGINS_DIR}:/app/plugins:ro
