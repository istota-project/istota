# What the stack answers outside /istota/, /webhooks/ and the signaling path.
# The stack serves no Nextcloud, so `/` goes to the web UI and the rest is 404.
# An explicit 404 is required: with no `location /` the server would fall back
# to the image's default root and serve nginx's own welcome page.
location = / {
    absolute_redirect off;
    return 302 /istota/;
}

location / {
    return 404;
}
