# The certificate and the protocol floor, for every server that terminates TLS.
# ${TLS_CERT_DIR} is where istota-ingress.sh found fullchain.pem and privkey.pem.
# privkey.pem is 0600 root on the VM; nginx's master process reads it as root
# before its workers drop privileges.
#
# Mozilla's intermediate configuration (TLS 1.2 and 1.3, its cipher list).
ssl_certificate ${TLS_CERT_DIR}/fullchain.pem;
ssl_certificate_key ${TLS_CERT_DIR}/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
ssl_session_cache shared:istota_tls:10m;
ssl_session_tickets off;
