# INGRESS=direct, once a certificate exists: this nginx terminates TLS for a VM
# reachable on the internet at its own name. direct-http.conf is the port-80
# server beside it, and the only server rendered before the first certificate.
#
# HSTS without includeSubDomains and without preload: the operator's other
# names are not this stack's to commit.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    include /etc/nginx/istota/tls.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;
    set $forwarded_proto https;
    include /etc/nginx/istota/server.conf;
}
