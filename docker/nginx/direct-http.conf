# INGRESS=direct, port 80: the ACME HTTP-01 challenge from a read-only webroot
# (certbot on the VM writes /srv/istota/acme), and a redirect to https for
# everything else.
#
# The redirect uses `$host`, which drops a port: it points at the scheme's
# default port, where a port in the Location has no business appearing.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ${DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
