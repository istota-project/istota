# INGRESS=proxied: behind a reverse proxy that terminates TLS, published on one
# private address.
#
# `[web] trusted_proxy_hops = 2` is only right if nothing but the upstream can
# reach this listener: a client that reaches it directly can send its own
# X-Forwarded-For, and the hop count then picks the forged address, which
# defeats the per-IP login throttle. So only UPSTREAM_PROXY is allowed here,
# and the VM's DOCKER-USER rule drops everyone else before they arrive. The
# real-IP module is not used: `$remote_addr` stays the TCP peer, and the app
# does the hop arithmetic itself.
#
# ${PROXIED_LISTEN} is `listen 80` for a plain hop, or `listen 443 ssl` with the
# certificate from files when the upstream re-encrypts (TLS_CERT_SOURCE=files).
# The scheme comes from the upstream's header, https when absent, since this
# mode always sits behind TLS.
server {
    ${PROXIED_LISTEN}
    ${UPSTREAM_ALLOW}
    deny all;
    set $forwarded_proto $istota_upstream_proto;
    include /etc/nginx/istota/server.conf;
}
