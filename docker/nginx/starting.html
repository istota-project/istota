  What the stack's nginx answers, as a 503, when it cannot reach the web
  service: the minutes an `istota-stack update` restarts it, or a crash. Served
  by nginx alone, so nothing here may load from the app: the sigil is inlined
  (tests/test_nginx_starting_page.py holds it to web/static/octopus-sigil.webp)
  and the tokens are the login page's (`_LOGIN_PAGE_CSS` in webui/app.py).
-->

<style>
:root {
  color-scheme: dark;
  --surface-base: #111;
  --surface-card: #1a1a1a;
  --surface-raised: #222;
  --text-primary: #e0e0e0;
  --text-muted: #888;
  --text-dim: #666;
  --border-default: #333;
  --border-subtle: #222;
  --accent-amber: #f5a623;
  --accent-blue: #7aa3d8;
  --glow: rgba(245, 166, 35, 0.09);
}
:root[data-theme='light'] {
  color-scheme: light;
  --surface-base: #ffffff;
  --surface-card: #f4f4f5;
  --surface-raised: #e8e8ea;
  --text-primary: #1a1a1a;
  --text-muted: #6b6b70;
  --text-dim: #8a8a90;
  --border-default: #d4d4d8;
  --border-subtle: #e4e4e7;
  --accent-amber: #b9740a;
  --accent-blue: #2563b0;
  --glow: rgba(185, 116, 10, 0.07);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  padding: 2rem 1.25rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.5rem;
  background: var(--surface-base);
  background-image: radial-gradient(60rem 32rem at 50% -8rem, var(--glow), transparent 70%);
  color: var(--text-primary);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  -webkit-font-smoothing: antialiased;
}
.card {
  width: 100%;
  max-width: 22rem;
  padding: 1.75rem 1.5rem 1.5rem;
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: 1rem;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 12px 32px rgba(0, 0, 0, 0.25);
  text-align: center;
}
.mark {
  height: 3.25rem;
  width: auto;
  margin: 0 auto 1rem;
  display: block;
  animation: breathe 2.4s ease-in-out infinite;
}
:root[data-theme='light'] .mark { filter: invert(1); }
@keyframes breathe {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}
h1 {
  margin: 0;
  font-size: 1.35rem;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.tagline {
  margin: 0.4rem 0 1.25rem;
  font-size: 0.85rem;
  color: var(--text-muted);
  line-height: 1.5;
}
.progress {
  position: relative;
  height: 3px;
  overflow: hidden;
  border-radius: 999px;
  background: var(--surface-raised);
}
.progress::after {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  width: 35%;
  border-radius: inherit;
  background: var(--accent-amber);
  animation: slide 1.6s ease-in-out infinite;
}
@keyframes slide {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(290%); }
}
.slow {
  margin: 1rem 0 0;
  font-size: 0.8rem;
  line-height: 1.5;
  color: var(--text-muted);
}
.slow[hidden] { display: none; }
footer {
  font-size: 0.72rem;
  color: var(--text-dim);
}
footer a {
  color: var(--text-muted);
  text-decoration: none;
  border-bottom: 1px solid var(--border-default);
}
footer a:hover { color: var(--accent-amber); border-bottom-color: var(--accent-amber); }
@media (prefers-reduced-motion: reduce) {
  .mark, .progress::after { animation: none; }
  .progress::after { width: 100%; opacity: 0.5; }
}
</style>
