# root-locations.conf's replacement when host.env sets SITE_DIR (#804): the
# operator's static site, mounted read-only at /srv/site on this container
# alone. /istota/, /webhooks/ and the signaling path are prefix locations in
# istota.conf.template, longer than `/`, so they keep their own routing.
location / {
    root /srv/site;
    index index.html;
    try_files $uri $uri/ =404;
    # The directory redirect (/docs to /docs/) relative, so it keeps the port
    # and the scheme the client used.
    absolute_redirect off;
    # A directory with no index.html is 403 from nginx; it is a missing page.
    error_page 403 = @istota_site_missing;
    # Search engines may index the operator's site, unlike the app.
    set $istota_robots "";

    # A checkout's .git, an editor's swap file: nothing hidden is published.
    location ~ /\. {
        return 404;
    }
}

location @istota_site_missing {
    return 404;
}
