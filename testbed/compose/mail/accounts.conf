# Used only by the entrypoint's account-creation step, never to serve anything.
#
# maddy's `creds` and `imap-acct` subcommands initialize every endpoint in the
# config they are given, and the submission block in `maddy.conf` breaks them
# ("no such instance registered"). So account creation gets its own config with
# no submission block. It shares `state_dir` and both DB dsns with `maddy.conf`,
# so the accounts it creates are exactly the ones the server then reads.
#
# maddy requires at least one endpoint even for a subcommand, hence the imap
# block. It is never bound: the subcommand exits before serving.

state_dir /data
runtime_dir /tmp

$(hostname) = {env:MADDY_HOSTNAME}

tls file /data/tls/fullchain.pem /data/tls/privkey.pem

auth.pass_table local_authdb {
    table sql_table {
        driver sqlite3
        dsn credentials.db
        table_name passwords
    }
}

storage.imapsql local_mailboxes {
    driver sqlite3
    dsn imapsql.db
}

imap tls://0.0.0.0:993 tcp://0.0.0.0:143 {
    auth &local_authdb
    storage &local_mailboxes
}
