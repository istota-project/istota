# The full shape's web process sends authentication mail itself. Trust the
# same generated Maddy certificate as the daemon, with hostname verification.
# Kept separate from mail.yml because only the full profile reads mail from
# the web process.
services:
  web:
    volumes:
      - ${ISTOTA_TESTBED_MAIL_CERT:?the harness must export ISTOTA_TESTBED_MAIL_CERT}:/etc/istota-testbed/mail-ca.crt:ro
    environment:
      SSL_CERT_FILE: /etc/istota-testbed/mail-ca.crt
      SSL_CERT_DIR: /etc/ssl/certs
