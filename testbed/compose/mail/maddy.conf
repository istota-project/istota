# Maddy for the testbed: two mailboxes, catch-all by destination domain, and
# nothing that can reach the internet.
#
# Maddy rather than GreenMail or Mailpit, settled the expensive way by
# istota-redteam: GreenMail's IMAP rejects the parenthesized `UID SEARCH` that
# imap-tools always sends, and Mailpit has no IMAP server at all. Maddy serves
# IMAPS on 993 and implicit-TLS submission on 465 from one small container,
# which is what lets istota's port-based TLS branch run unmodified.
#
# Two accounts, on domains reserved by RFC 6761 so they can never resolve:
#   *@bot.test    -> bot@bot.test        the mailbox istota polls. The rewrite
#                                        collapses `bot+tag@bot.test`, which is
#                                        how the plus-address routing rung is
#                                        reachable without pre-creating an
#                                        address per test.
#   everything else -> catchall@ext.test the outside world. Every reply istota
#                                        sends lands here whatever the To was,
#                                        so a test can invent a sender address
#                                        per case and still read the answer.
#
# `replace_rcpt` rewrites the *envelope* recipient only. The `To:` header
# arrives verbatim, which is the whole point — istota's routing reads the
# header, so a message addressed to `bot+testuser@bot.test` is delivered into
# the one real mailbox while still carrying the tag the router looks for.

state_dir /data
runtime_dir /tmp

$(hostname) = {env:MADDY_HOSTNAME}
$(local_domains) = bot.test ext.test

tls file /data/tls/fullchain.pem /data/tls/privkey.pem

auth.pass_table local_authdb {
    table sql_table {
        driver sqlite3
        dsn credentials.db
        table_name passwords
    }
}

storage.imapsql local_mailboxes {
    driver sqlite3
    dsn imapsql.db
}

hostname $(hostname)

msgpipeline local_routing {
    destination bot.test {
        modify {
            replace_rcpt regexp "(?i)^.+@bot\.test$" "bot@bot.test"
        }
        deliver_to &local_mailboxes
    }
    default_destination {
        modify {
            replace_rcpt regexp "(?i)^.+@.+$" "catchall@ext.test"
        }
        deliver_to &local_mailboxes
    }
}

# Authenticated submission only, implicit TLS on 465 and STARTTLS on 587.
# Accepts any destination and hands it to local_routing, which rewrites and
# delivers locally. Remote delivery does not exist here.
#
# The rate limit is 200/s rather than istota-redteam's 50/s. That value exists
# to make a target behave like a real MTA under a flood, which is not a property
# this rig needs; the wire suite sends its cases as fast as it can build them.
submission tls://0.0.0.0:465 tcp://0.0.0.0:587 {
    limits {
        all rate 200 1s
    }
    auth &local_authdb
    default_destination {
        deliver_to &local_routing
    }
}

imap tls://0.0.0.0:993 tcp://0.0.0.0:143 {
    auth &local_authdb
    storage &local_mailboxes
}
