# The full test tier's Nextcloud fixture, served by the stack's nginx on the
# same origin as the web UI. Swapped in for docker/nginx/root-locations.conf by
# nextcloud.yml (ISTOTA_NGINX_ROOT_LOCATIONS), so the OAuth2 login, Talk and
# WebDAV are reached on the one published port the fixture's callback URL was
# registered with. No shipped stack carries this: an operator's Nextcloud is
# reached at its own address.

# WebDAV and sync: no buffering, so large uploads stream straight to Apache.
location ~ ^/(remote\.php/(dav|webdav)|public\.php/dav) {
    set $upstream_nextcloud nextcloud:80;
    proxy_pass http://$upstream_nextcloud;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 0;
}

# Everything else is Nextcloud.
location / {
    set $upstream_nextcloud nextcloud:80;
    proxy_pass http://$upstream_nextcloud;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}
