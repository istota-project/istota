# Harness concessions for the full shape. NOT a deployment recipe.
#
# `docker/docker-compose.yml` is a production artifact whose defaults are tuned
# for production. This overlay is the complete list of places where the stack
# the `full` tier boots differs from the stack an operator boots, and each entry
# carries the reason inline — the same habit `docker/docker-compose.test.yml`
# keeps. A new concession goes here, where it gets read and reviewed, rather
# than into a fragment assembled in Python.
#
# What is deliberately *not* here: anything that varies per session. The
# generated passwords, the OAuth2 client, the ephemeral `NC_PORT` and its
# matching `ISTOTA_WEB_CALLBACK_URL`, and the two directories below are written
# into the compose env-file that `StackPool` owns, and istota's own config is a
# `config.toml` the testbed writes, because a file in the repository cannot
# hold a value that is invented at boot.
#
# Used as `-f docker/docker-compose.yml -f testbed/compose/testbed.yml`.
# `testbed/stack.py` assembles the invocation; this file is never run by hand.

services:
  istota:
    # `host.docker.internal` is built in on Docker Desktop and absent on Docker
    # Engine, and `docker-compose.yml` does not declare it because nothing in a
    # deployment reaches the host. The scripted model endpoint runs in the
    # pytest process on the host, so every full-shape task depends on this.
    #
    # It reaches inside the sandbox too, which is the obvious worry and is
    # unfounded: the testbed's config writes `[security.network] enabled =
    # false` (`testbed.stack.CONCESSIONS`), so `executor.py` builds no CONNECT
    # proxy and appends no `--unshare-net`, and `/etc/hosts` is bound into the
    # bwrap namespace. A profile that turns the CONNECT allowlist on would have
    # to allowlist each stub's host:port.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # No `security_opt` here. The shipped file carries the sandbox grant itself
    # (the seccomp and AppArmor profiles and systempaths=unconfined), so this
    # stack runs the run contract an operator runs. Docker Desktop has no
    # AppArmor and ignores `apparmor=istota`.

    # The config the testbed wrote, where `istota setup` would have written it.
    # A bind rather than the state volume, because the harness has to write the
    # file before the container starts and a named volume has no host path to
    # write it through. Read-only, as the container never writes it.
    volumes:
      - ${ISTOTA_TEST_CONFIG_DIR:?the harness must export ISTOTA_TEST_CONFIG_DIR}:/data/config:ro

    # The shipped `istota` service has the same `tasks` healthcheck; this one
    # differs only in timing, since a cold Nextcloud install (which `istota`
    # waits on) and the image build share the boot's budget.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          istota-drop python3 -c "import sqlite3,sys;
          sys.exit(0 if sqlite3.connect('file:/data/db/istota.db?mode=ro', uri=True)
          .execute(\"SELECT 1 FROM sqlite_master WHERE type='table' AND name='tasks'\")
          .fetchone() else 1)"
      interval: 5s
      timeout: 5s
      retries: 180
      start_period: 10s

  web:
    # The same config, for the same reason. `web` symlinks it into its working
    # directory and reads it on every request it authenticates.
    volumes:
      - ${ISTOTA_TEST_CONFIG_DIR:?the harness must export ISTOTA_TEST_CONFIG_DIR}:/data/config:ro
