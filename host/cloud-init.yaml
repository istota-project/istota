#cloud-config
# Bootstrap a Debian 13 server (a VM, a VPS or a bare-metal box) dedicated to
# one istota install. Pass this file as the machine's user data as it is, or
# change the values under "Fill in" first: a specific release, or a fork's
# repository and release key.
#
# What it does: clones the repository, picks the newest release tag (vX.Y.Z)
# unless TAG names one, verifies its signature against the key below before
# running anything from it, checks the tag out, runs host/provision.sh from
# that checkout, builds the images from the tag
# (`istota-stack update <tag>`), and starts the setup in a browser
# (`systemctl start istota-setup`). The address to open and the setup code are
# printed to the console, which a VPS provider's web console shows; on the
# machine, `sudo istota-stack setup-code` prints them again. Setup installs the
# config, builds what it needs, provisions again and starts the stack.
#
# To set up in the terminal instead, stop the unit (`systemctl stop
# istota-setup`) and run:
#
#   istota-stack setup            # the wizard: config.toml, secrets, host.env
#   istota-stack check-image || istota-stack update <tag>   # rebuild if the config needs Claude Code
#   /srv/app/istota/src/host/provision.sh   # picks up host.env
#   systemctl start istota-stack
#
# Nothing here is pulled from a registry: the images are built on the machine.

write_files:
  - path: /srv/app/istota/host.env
    permissions: "0644"
    content: |
      # Fill in: the release signing key, one line of an SSH public key. Every
      # tag `istota-stack update` deploys is verified against it. This is the
      # project's (host/release-signing-key.pub); a fork puts its own here.
      RELEASE_SIGNING_KEY=ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM8wnX7YSjgMETMV8EOf/hQ6J5HpZsw9WfY/r0Glfq4z istota-releases
  - path: /root/istota-bootstrap.sh
    permissions: "0700"
    content: |
      #!/bin/bash
      set -euo pipefail
      # Fill in: where to clone from, and the release tag to provision from
      # (empty: the newest release).
      REPO_URL="https://github.com/istota-project/istota.git"
      TAG=""

      SRC=/srv/app/istota/src
      ALLOWED_SIGNERS=/srv/app/istota/allowed_signers
      refuse_tag() { echo "[istota-bootstrap] REFUSE: $*" >&2; exit 65; }

      # --- newest release ---
      # The newest release among the tag names on stdin, one bare name per line: the
      # highest vX.Y.Z by number (v0.10.0 is newer than v0.9.9). Prints nothing and
      # fails when no name is one. It only picks: the caller verifies the tag. Not
      # `sort -V`, which macOS's sort lacks.
      newest_release_tag() {
          local newest
          newest="$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' \
              | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)" || true
          [ -n "$newest" ] || return 1
          echo "v${newest}"
      }
      # --- end newest release ---

      # Copied from host/istota-stack, which is authoritative: nothing from the
      # checkout may run before its tag is verified, so this cannot source it.
      # tests/test_host_units.py holds the copy byte for byte equal to the original.
      # --- release tags ------------------------------------------------------------

      # git against the checkout, reading no configuration but this.
      verified_git() {
          GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 git -C "$SRC" \
              -c gpg.format=ssh \
              -c "gpg.ssh.allowedSignersFile=${ALLOWED_SIGNERS}" \
              -c gpg.openpgp.program=false \
              -c gpg.x509.program=false \
              "$@"
      }

      check_tag_name() {
          case "$1" in
              ""|-*|*[!A-Za-z0-9._-]*|*..*) refuse_tag "'$1' is not a release tag name." ;;
          esac
      }

      # Print the object id of a release tag that passes every check, or refuse.
      verify_release_tag() {
          local tag="$1" object kind named body
          check_tag_name "$tag"
          if ! object="$(verified_git rev-parse -q --verify "refs/tags/${tag}" 2>/dev/null)"; then
              refuse_tag "${tag} is not a tag in the checkout. Only a signed release tag is deployed, never a branch or a commit."
          fi
          kind="$(verified_git cat-file -t "$object")"
          if [ "$kind" != "tag" ]; then
              refuse_tag "${tag} is a lightweight tag; a release tag is annotated and signed."
          fi
          # Read once and tested as text: a `cat-file | grep -q` under pipefail
          # reads a match as a failure when grep closes the pipe early.
          body="$(verified_git cat-file tag "$object")"
          named="$(awk '/^tag / { print $2; exit } /^$/ { exit }' <<<"$body")"
          if [ "$named" != "$tag" ]; then
              refuse_tag "the ref ${tag} points at a tag object named '${named}'."
          fi
          if ! grep -qx -- '-----BEGIN SSH SIGNATURE-----' <<<"$body"; then
              refuse_tag "${tag} carries no SSH signature."
          fi
          if [ ! -s "$ALLOWED_SIGNERS" ]; then
              refuse_tag "${ALLOWED_SIGNERS} is missing or empty; provision.sh writes it from RELEASE_SIGNING_KEY."
          fi
          if ! verified_git verify-tag "$object" >/dev/null 2>&1; then
              refuse_tag "${tag} is not signed by the key in ${ALLOWED_SIGNERS}."
          fi
          echo "$object"
      }

      apt-get update -qq
      DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git openssh-client ca-certificates
      key="$(sed -n 's/^RELEASE_SIGNING_KEY=//p' /srv/app/istota/host.env)"
      # The file provision.sh writes from host.env, in the same form.
      printf 'releases namespaces="git,istota-images" %s\n' "$key" > "$ALLOWED_SIGNERS"
      chmod 0644 "$ALLOWED_SIGNERS"
      git clone --quiet --no-checkout "$REPO_URL" "$SRC"
      if [ -z "$TAG" ]; then
          TAG="$(verified_git tag --list | newest_release_tag)" \
              || refuse_tag "${REPO_URL} has no release tag (vX.Y.Z); set TAG to the release to install."
      fi
      if ! object="$(verify_release_tag "$TAG")"; then
          echo "[istota-bootstrap] nothing was installed; set TAG to install another release." >&2
          exit 65
      fi
      verified_git checkout --quiet --detach "${object}^{commit}"
      ISTOTA_REPO_URL="$REPO_URL" "${SRC}/host/provision.sh"

      /usr/local/sbin/istota-stack update "$TAG"
      systemctl start istota-setup.service
      # The unit mints the code and the certificate first; print its
      # instructions once they exist. cloud-init's output reaches the console.
      for _ in $(seq 1 60); do
          if /usr/local/sbin/istota-stack setup-code 2>/dev/null; then break; fi
          sleep 5
      done

runcmd:
  - [bash, /root/istota-bootstrap.sh]
