<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <script>
      // Apply the saved theme and text scale before first paint to avoid a flash
      // of the wrong theme / a reflow once the size lands. Mirrors
      // lib/stores/persisted.ts (values are JSON-encoded).
      (function () {
        var root = document.documentElement;
        function read(key, fallback) {
          try {
            var raw = localStorage.getItem(key);
            return raw ? JSON.parse(raw) : fallback;
          } catch (e) {
            return fallback;
          }
        }
        var theme = read('theme', 'dark');
        root.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
        var size = read('fontSize', 'medium');
        root.setAttribute('data-font-size', size === 'small' || size === 'large' ? size : 'medium');
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
