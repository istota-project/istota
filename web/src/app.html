<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the page paint into the rounded corners / home
         indicator instead of being letterboxed above them, which is what makes
         env(safe-area-inset-*) report real values. Everything pinned to a
         viewport edge pads by the matching --safe-* token in app.css. The
         pre-paint script below locks zoom in the iOS app, and zoomPin.ts
         rewrites this tag on focus (iOS zoom guard) — keep the flag in all of
         its strings. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="text-scale" content="scale" />

    <!-- Icons + PWA manifest. Assets live in static/ and are taken from the
         main Istota site. %sveltekit.assets% resolves per page depth (the build
         emits relative paths), so these stay correct under the /istota base. -->
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link
      rel="manifest"
      href="%sveltekit.assets%/manifest.webmanifest"
      crossorigin="use-credentials"
    />
    <!-- Mobile browser chrome. Content is --surface-card for the active theme,
         the app nav's fill, so the chrome continues the nav; the iOS app paints
         its native bar from it too. The pre-paint script below seeds it and
         applyTheme() keeps it in step
         with the toggle. Deliberately not a prefers-color-scheme pair — the
         theme follows the OS only until one is chosen, and the stored choice
         can disagree with it. -->
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="apple-mobile-web-app-title" content="Istota" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <script>
      // Apply the saved theme and text scale, and the iOS app's viewport lock,
      // before first paint to avoid a flash
      // of the wrong theme / a reflow once the size lands. Mirrors
      // @minot/ui's ui/persisted (values are JSON-encoded).
      (function () {
        var root = document.documentElement;
        function read(key, fallback) {
          try {
            var raw = localStorage.getItem(key);
            return raw ? JSON.parse(raw) : fallback;
          } catch (e) {
            return fallback;
          }
        }
        // No stored choice follows the OS, as lib/stores/theme.ts does.
        var stored = read('theme', null);
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        root.setAttribute('data-theme', theme);
        var chrome = document.querySelector('meta[name="theme-color"]');
        if (chrome) chrome.setAttribute('content', theme === 'light' ? '#f4f4f5' : '#1a1a1a');
        var size = read('fontSize', 'medium');
        root.setAttribute('data-font-size', size === 'small' || size === 'large' ? size : 'medium');
        // The iOS app never page-zooms (ISSUE-818). Set before first paint, not
        // after hydration, or a double tap in between can still zoom. Mirrors
        // VIEWPORT_LOCKED in lib/zoomPin.ts; a browser keeps pinch-zoom.
        if (/(?:^|\s)IstotaApp\//.test(navigator.userAgent)) {
          var viewport = document.querySelector('meta[name="viewport"]');
          if (viewport)
            viewport.setAttribute(
              'content',
              'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover',
            );
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
